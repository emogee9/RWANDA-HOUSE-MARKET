<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffdf5;
  color: #4a3900;
}

header {
  background: #f2c300;
  color: #fff;
  padding: 22px 15px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.15);
}

header h1 {
  margin: 0;
  font-size: 28px;
  text-shadow: 0 2px 5px rgba(0,0,0,.15);
}

.back {
  display: inline-block;
  margin-top: 10px;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px 20px 50px;
}

.photo-slider {
  position: relative;
  background: #fff;
  padding: 12px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(180,140,0,.15);
  border-top: 5px solid #f2c300;
}

.photo-slider img {
  width: 100%;
  height: 520px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: #f2c300;
  color: #fff;
  border: 0;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 28px;
  cursor: pointer;
  font-weight: bold;
  z-index: 2;
}

.arrow:hover {
  background: #d9ad00;
}

.left {
  left: 25px;
}

.right {
  right: 25px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.gallery img {
  width: 100%;
  height: 105px;
  object-fit: cover;
  border-radius: 10px;
  cursor: pointer;
  border: 3px solid white;
  box-shadow: 0 3px 8px rgba(180,140,0,.15);
}

.gallery img.active {
  border-color: #f2c300;
}

.info {
  background: #fff;
  margin-top: 25px;
  padding: 28px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(180,140,0,.15);
  border-top: 5px solid #f2c300;
}

.info h2 {
  font-size: 30px;
  margin-top: 0;
  color: #b28b00;
}

.type {
  display: inline-block;
  background: #fff7d6;
  color: #b28b00;
  padding: 8px 15px;
  border-radius: 20px;
  font-weight: bold;
  border: 1px solid #f2c300;
}

.price {
  font-size: 25px;
  font-weight: bold;
  margin: 15px 0;
  color: #b28b00;
}

.location {
  font-size: 18px;
  margin-bottom: 20px;
  color: #5f5000;
}

.details-list {
  line-height: 2;
  font-size: 17px;
  color: #5f5000;
}

.description {
  color: #70652f;
  line-height: 1.7;
}

.action-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.action-button,
.call,
.social-links a {
  padding: 13px 20px;
  border-radius: 8px;
  color: white;
  background: #f2c300;
  text-decoration: none;
  font-weight: bold;
  transition: .2s;
}

.action-button:hover,
.call:hover,
.social-links a:hover {
  background: #d9ad00;
  transform: translateY(-2px);
}

.call {
  display: inline-block;
  margin-top: 15px;
  padding: 13px 25px;
}

.social {
  margin-top: 30px;
  padding-top: 25px;
  border-top: 2px solid #f2c300;
  text-align: center;
}

.social h3 {
  color: #b28b00;
}

.social-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 15px;
}

@media(max-width:700px) {

  .photo-slider img {
    height: 300px;
  }

  .gallery {
    grid-template-columns: repeat(3, 1fr);
  }

  .gallery img {
    height: 90px;
  }

  .info h2 {
    font-size: 25px;
  }

  .action-button {
    width: 100%;
    text-align: center;
  }
}

/* =========================
   GALLERY
========================= */

function renderGallery() {

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";

  photos.forEach((src, i) => {

    const img =
      document.createElement("img");

    img.src = src;

    img.alt =
      "Property " + (i + 1);

    img.className =
      i === currentProperty
        ? "active"
        : "";

    img.onclick =
      () => showProperty(i);

    gallery.appendChild(img);

  });
}

========================= */

    p.title.English;

  document.getElementById("houseTitle").textContent =
    p.title[language] ||
    p.title.English;

  document.getElementById("propertyType").textContent =
    p.type[language] ||
    p.type.English;

  document.getElementById("price").textContent =
    p.price;

  document.getElementById("houseLocation").textContent =
    p.location[language] ||
    p.location.English;

  document.getElementById("detailsList").textContent =
    p.details[language] ||
    p.details.English;

  document.getElementById("houseDescription").textContent =
    p.description[language] ||
    p.description.English;

  [
    ...document.querySelectorAll(".gallery img")
  ].forEach((el, n) => {

    el.classList.toggle(
      "active",
      n === i
    );

  });

}


/* =========================
   NEXT / PREVIOUS
========================= */

function nextProperty() {

  showProperty(
    (currentProperty + 1) %
    properties.length
  );

}

function previousProperty() {

  showProperty(
    (currentProperty - 1 + properties.length) %
    properties.length
  );

}


/* =========================
   START
========================= */

applyLanguage();

renderGallery();

showProperty(0);

</script>

</body>
</html>
