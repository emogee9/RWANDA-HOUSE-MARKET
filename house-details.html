<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rwanda Property Visata</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffdf5;
      color: #4a3900;
    }

    header {
      background: #f2c300;
      color: #fff;
      padding: 22px 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      text-shadow: 0 2px 5px rgba(0,0,0,.15);
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      background: #b28b00;
      padding: 10px 18px;
      border-radius: 8px;
    }

    .back:hover {
      background: #8f7000;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px 70px;
    }

    .empty-box {
      background: #fff;
      border-radius: 15px;
      padding: 60px 25px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(180,140,0,.15);
      border-top: 5px solid #f2c300;
    }

    .empty-box h2 {
      margin: 0 0 15px;
      color: #b28b00;
      font-size: 30px;
    }

    .empty-box p {
      margin: 0;
      color: #70652f;
      font-size: 17px;
      line-height: 1.6;
    }

    .empty-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    @media(max-width:700px) {

      header {
        padding: 20px 12px;
      }

      header h1 {
        font-size: 23px;
      }

      .container {
        padding: 25px 15px 60px;
      }

      .empty-box {
        padding: 45px 20px;
      }

      .empty-box h2 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1 id="headerTitle">
      🏠 RWANDA PROPERTY VISATA
    </h1>

    <a
      href="./rent.html"
      class="back"
      id="backButton">
      ← Back to Houses for Rent
    </a>

  </header>


  <div class="container">

    <div class="empty-box">

      <div class="empty-icon">
        🏠
      </div>

      <h2 id="emptyTitle">
        No Properties Available
      </h2>

      <p id="emptyText">
        There are currently no properties posted.
        Please check again later.
      </p>

    </div>

  </div>


  <script>

    /* =========================
       LANGUAGE
    ========================= */

    const language =
      localStorage.getItem("selectedLanguage") || "English";


    /* =========================
       TRANSLATIONS
    ========================= */

    const translations = {

      Kinyarwanda: {

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Subira ku mazu",

        title:
          "Nta mutungo uhari",

        text:
          "Kugeza ubu nta mutungo washyizweho. Ongera ugerageze nyuma."

      },


      English: {

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Back to Houses for Rent",

        title:
          "No Properties Available",

        text:
          "There are currently no properties posted. Please check again later."

      },


      Français: {

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Retour aux maisons",

        title:
          "Aucune propriété disponible",

        text:
          "Aucune propriété n'est actuellement publiée. Veuillez revenir plus tard."

      },


      Kiswahili: {

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Rudi kwenye nyumba",

        title:
          "Hakuna mali inayopatikana",

        text:
          "Kwa sasa hakuna mali iliyowekwa. Tafadhali jaribu tena baadaye."

      },


      "中文": {

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← 返回房屋",

        title:
          "暂无房产",

        text:
          "目前没有发布任何房产。请稍后再查看。"

      }

    };


    /* =========================
       SELECT LANGUAGE
    ========================= */

    const t =
      translations[language] ||
      translations.English;


    /* =========================
       APPLY LANGUAGE
    ========================= */

    document.getElementById(
      "headerTitle"
    ).textContent =
      t.header;


    document.getElementById(
      "backButton"
    ).textContent =
      t.back;


    document.getElementById(
      "emptyTitle"
    ).textContent =
      t.title;


    document.getElementById(
      "emptyText"
    ).textContent =
      t.text;


    document.title =
      "Rwanda Property Visata";

  </script>

</body>

</html>
