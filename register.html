<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - Rwanda House Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222222;
      min-height: 100vh;
    }

    header {
      background: #f4b400;
      color: #222222;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      color: #222222;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    nav a:hover {
      background: #ffffff;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border: 2px solid #f4b400;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #eeeeee;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #222222;
    }

    input:focus {
      border-color: #f4b400;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #f4b400;
      color: #222222;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd45a;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block !important;
      background: #ffffff;
      color: #176b2c;
      border: 2px solid #f4b400;
    }

    .error {
      display: block !important;
      background: #ffffff;
      color: #b00020;
      border: 2px solid #f4b400;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #b88600;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 50px;
      background: #f4b400;
      color: #222222;
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }

    @media (max-width: 700px) {

      header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      nav {
        justify-content: center;
      }

      nav a {
        background: #ffffff;
      }

      .container {
        margin: 30px auto;
      }

      .card {
        padding: 25px 18px;
      }

    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      RWANDA HOUSE MARKET 🇷🇼
    </div>

    <nav>
      <a href="index.html" id="homeLink">Home</a>
      <a href="customer-home.html" id="propertiesLink">Properties</a>
      <a href="login.html" id="loginLink">Login</a>
    </nav>

  </header>


  <div class="container">

    <div class="card">

      <h1 id="title">
        Create Account
      </h1>

      <p class="subtitle" id="subtitle">
        Create your Rwanda House Market account
      </p>


      <form id="registerForm">

        <label for="fullname" id="fullnameLabel">
          Full Name
        </label>

        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          required
        >


        <label for="email" id="emailLabel">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >


        <label for="password" id="passwordLabel">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >


        <label for="phone" id="phoneLabel">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          required
        >


        <button
          type="submit"
          id="registerButton">
          Create Account
        </button>

      </form>


      <div id="message"></div>


      <div class="login-link">

        <span id="alreadyAccount">
          Already have an account?
        </span>

        <a
          href="login.html"
          id="loginHere">
          Login here
        </a>

      </div>

    </div>

  </div>


  <footer id="footerText">
    © 2026 Rwanda House Market 🇷🇼 — Find Houses, Plots & Properties
  </footer>


  <script>

    /* =========================================
       SUPABASE
    ========================================= */

    const SUPABASE_URL =
      "https://hsmnybmcddtsyooltozw.supabase.co";

    /*
    sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u
    */

    const SUPABASE_KEY =
      "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       LANGUAGE
    ========================================= */

    const language =
      localStorage.getItem("selectedLanguage") || "English";


    const translations = {

      Kinyarwanda: {

        home: "Ahabanza",

        properties: "Imitungo",

        login: "Kwinjira",

        title: "Fungura Konti",

      },


      English: {

        login: "Login",

        fullname:
          "Full Name",

        password:

        phone:

          "07XXXXXXXX",

          "Create Account",

        creating:
          "Creating Account...",

        already:
          "Already have an account?",

        loginHere:
          "Login here",

        success:

        footer:

      },

        footer:

      },


      Kiswahili: {

        home: "Mwanzo",

        properties: "Mali",

        login: "Ingia",

        title: "Fungua Akaunti",

        subtitle:
          "Fungua akaunti yako ya Rwanda House Market",

        fullname:

        fullnamePlaceholder:

        email:

        passwordPlaceholder:

        already:

        success:

        footer:

      },


      "中文": {

        home: "首页",

        properties: "房产",

        login: "登录",

        title: "创建账户",

        subtitle:
          "创建您的 Rwanda House Market 账户",

        fullname:

        email:

        emailPlaceholder:

        password:

        passwordPlaceholder:

          "电话号码",

        phonePlaceholder:
          "07XXXXXXXX",

        register:

        creating:
          "正在创建账户...",

        already:
          "已经有账户？",

        loginHere:
          "在这里登录",

        success:
          "✅ 账户创建成功！如果需要确认，请检查您的电子邮件。",

        footer:
          "© 2026 Rwanda House Market 🇷🇼 — 寻找房屋、土地和房产"

      }

    };


    const t =
      translations[language] ||
      translations.English;


    /* =========================================
       APPLY LANGUAGE
    ========================================= */

    document.getElementById("homeLink").textContent =
      t.home;

    document.getElementById("propertiesLink").textContent =
      t.properties;

    document.getElementById("loginLink").textContent =
      t.login;

    document.getElementById("title").textContent =
      t.title;

    document.getElementById("subtitle").textContent =
      t.subtitle;

    document.getElementById("fullnameLabel").textContent =
      t.fullname;

    document.getElementById("fullname").placeholder =
      t.fullnamePlaceholder;

    document.getElementById("emailLabel").textContent =
      t.email;

    document.getElementById("email").placeholder =
      t.emailPlaceholder;

    document.getElementById("passwordLabel").textContent =
      t.password;

    document.getElementById("password").placeholder =
      t.passwordPlaceholder;

    document.getElementById("phoneLabel").textContent =
      t.phone;

    document.getElementById("phone").placeholder =
      t.phonePlaceholder;

    document.getElementById("registerButton").textContent =
      t.register;

    document.getElementById("alreadyAccount").textContent =
      t.already + " ";

    document.getElementById("loginHere").textContent =
      t.loginHere;

    document.getElementById("footerText").textContent =
      t.footer;


    /* =========================================
       REGISTER
    ========================================= */

    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const registerButton =
      document.getElementById("registerButton");


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        message.className = "";

        message.style.display = "none";


        const fullname =
          document
            .getElementById("fullname")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        registerButton.disabled = true;

        registerButton.textContent =
          t.creating;


        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                fullname: fullname,

                phone: phone

              }

            }

          });


        if (error) {

          message.textContent =
            "❌ " + error.message;

          message.className =
            "error";

          registerButton.disabled =
            false;

          registerButton.textContent =
            t.register;

          return;

        }


        message.textContent =
          t.success;

        message.className =
          "success";


        form.reset();


        registerButton.disabled =
          false;

        registerButton.textContent =
          t.register;

      }
    );

  </script>

</body>

</html>
