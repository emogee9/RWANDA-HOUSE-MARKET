<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - Rwanda House Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222222;
      min-height: 100vh;
    }

    header {
      background: #f4b400;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      color: #222;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    nav a:hover {
      background: #fff;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      padding: 30px;
      border: 2px solid #f4b400;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #f4b400;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #f4b400;
      color: #222;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd45a;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block !important;
      background: #e8f5e9;
      color: #176b2c;
    }

    .error {
      display: block !important;
      background: #ffebee;
      color: #b00020;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #c58b00;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      margin-top: 50px;
      background: #f4b400;
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .container {
        margin: 30px auto;
      }

      .card {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      RWANDA HOUSE MARKET 🇷🇼
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="customer-home.html">Properties</a>
      <a href="login.html">Login</a>
    </nav>

  </header>

  <div class="container">

    <div class="card">

      <h1>Create Account</h1>

      <p class="subtitle">
        Create your Rwanda House Market account
      </p>

      <form id="registerForm">

        <label for="fullname">
          Full Name
        </label>

        <input
          type="text"
          id="fullname"
          placeholder="Enter your full name"
          required
        >

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="07XXXXXXXX"
          required
        >

        <button type="submit" id="registerButton">
          Create Account
        </button>

      </form>

      <div id="message"></div>

      <div class="login-link">
        Already have an account?
        <a href="login.html">Login here</a>
      </div>

    </div>

  </div>

  <footer>
    © 2026 Rwanda House Market 🇷🇼 — Find Houses, Plots & Properties
  </footer>

  <script>

    const SUPABASE_URL = "YOUR_SUPABASE_URL";

    const SUPABASE_KEY =
      "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const form =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const registerButton =
      document.getElementById("registerButton");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.className = "";
      message.style.display = "none";

      const fullname =
        document.getElementById("fullname").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const phone =
        document.getElementById("phone").value.trim();

      registerButton.disabled = true;
      registerButton.textContent = "Creating Account...";

      const {
        data,
        error
      } = await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {
          data: {
            fullname: fullname,
            phone: phone
          }
        }

      });

      if (error) {

        message.textContent =
          "❌ " + error.message;

        message.className = "error";

        registerButton.disabled = false;
        registerButton.textContent = "Create Account";

        return;
      }

      message.textContent =
        "✅ Account created successfully!";

      message.className = "success";

      form.reset();

      registerButton.disabled = false;
      registerButton.textContent = "Create Account";

    });

  </script>

</body>

</html>
