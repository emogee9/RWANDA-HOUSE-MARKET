<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"

</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f5ef;
  color:#33251d;
}

/* ================= NAVBAR ================= */

.navbar{
  background:#d4a017;
  color:white;
  padding:15px 20px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:15px;

  position:sticky;
  top:0;
  z-index:1000;

  box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.nav-buttons{
  display:flex;
  gap:8px;
}

.nav-buttons button{
  border:0;
  background:white;
  color:#a87800;

  padding:9px 14px;

  border-radius:7px;

  font-weight:bold;
  cursor:pointer;
}

.nav-buttons button:hover{
  background:#fff8d6;
}

/* ================= CONTAINER ================= */

.container{
  max-width:1200px;
  margin:auto;

  padding:25px 18px 60px;
}

/* ================= TITLE ================= */

.page-title{
  background:white;

  padding:25px;

  border-radius:14px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.1);

  margin-bottom:20px;
}

.page-title h1{
  margin-top:0;
}

/* ================= CARD ================= */

.card{
  background:white;

  border-radius:14px;

  padding:22px;

  margin-bottom:20px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.1);
}

/* ================= FORM ================= */

label{
  display:block;

  font-weight:bold;

  margin:14px 0 6px;
}

input,
select,
textarea{

  width:100%;

  padding:12px;

  border:2px solid #eee;

  border-radius:8px;

  font-size:15px;

  outline:none;

}

input:focus,
select:focus,
textarea:focus{

  border-color:#d4a017;

}

textarea{

  min-height:140px;

  resize:vertical;

}

.grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:15px;

}

/* ================= BUTTON ================= */

.button{

  border:0;

  padding:12px 18px;

  border-radius:8px;

  font-weight:bold;

  cursor:pointer;

  margin-top:15px;

}

.primary{

  background:#d4a017;

  color:white;

}

.primary:hover{

  background:#a87800;

}

.delete{

  background:#c62828;

  color:white;

}

.delete:hover{

  background:#9e1f1f;

}

.secondary{

  background:#eee;

  color:#333;

}

.secondary:hover{

  background:#ddd;

}

/* ================= MESSAGE ================= */

.message{

  display:none;

  padding:12px;

  border-radius:8px;

  margin-top:15px;

  font-weight:bold;

}

.success{

  display:block;

  background:#e9f8e9;

  color:#227522;

}

.error{

  display:block;

  background:#ffe8e8;

  color:#a00000;

}

/* ================= PREVIEW ================= */

.photos-preview{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:15px;

}

.photos-preview img{

  width:120px;

  height:90px;

  object-fit:cover;

  border-radius:8px;

  border:2px solid #eee;

}

/* ================= PROPERTIES ================= */

.properties{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:18px;

}

.property{

  background:white;

  border-radius:14px;

  overflow:hidden;

  box-shadow:
    0 3px 12px rgba(0,0,0,.12);

}

.property img{

  width:100%;

  height:210px;

  object-fit:cover;

  display:block;

}

.property-body{

  padding:16px;

}

.property-title{

  font-size:19px;

  font-weight:bold;

  margin-bottom:8px;

}

.price{

  color:#b27b00;

  font-size:19px;

  font-weight:bold;

  margin-bottom:10px;

}

.location{

  color:#666;

  line-height:1.5;

}

.property-actions{

  display:flex;

  gap:8px;

  margin-top:15px;

}

.property-actions button{

  flex:1;

}

.empty{

  text-align:center;

  padding:35px;

  color:#777;

  background:white;

  border-radius:12px;

}

/* ================= LANGUAGE ================= */

.language-box{

  margin-bottom:20px;

}

.language-box select{

  max-width:300px;

}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .properties{

    grid-template-columns:
      repeat(2,1fr);

  }

}

@media(max-width:650px){

  .navbar{

    flex-direction:column;

  }

  .grid,
  .properties{

    grid-template-columns:1fr;

  }

  .property-actions{

    flex-direction:column;

  }

  .photos-preview img{

    width:100px;

    height:80px;

  }

}

</style>

    <option value="中文">
      中文
    </option>

  </select>

</div>



<!-- ================= NEW POST ================= -->

<div class="card">

  <h2 id="formTitle">
    ➕ Add Property
  </h2>


  <form id="propertyForm">


    <!-- TITLE -->

    <label id="titleLabel">
      Property Title
    </label>

    <input
      type="text"
      id="title"
      placeholder="Example: Beautiful House in Kigali"
      required
    >

    <label id="typeLabel">
      Property Type
    </label>

    <select
      id="propertyType"
      required
    >

      <option value="">
        Choose property type
      </option>

      <option value="rent">
        House for Rent
      </option>

      <option value="sale">
        House for Sale
      </option>

      <option value="plot">
        Plot for Sale
      </option>

    </select>



    <!-- PRICE -->

    <label id="priceLabel">
      Price
    </label>

    <input
      type="number"
      id="price"
      placeholder="Example: 500000"
      min="0"
      required
    >



    <!-- LOCATION -->

    <div class="grid">


      <div>

        <label id="countryLabel">
          Country
        </label>

        <input
          type="text"
          id="country"
          value="Rwanda"
          required
        >

      </div>



      <div>

        <label id="provinceLabel">
          Province
        </label>

        <input
          type="text"
          id="province"
          placeholder="Kigali"
          required
        >

      </div>



      <div>

        <label id="districtLabel">
          District
        </label>

        <input
          type="text"
          id="district"
          placeholder="Gasabo"
          required
        >

      </div>



      <div>

        <label id="sectorLabel">
          Sector
        </label>

        <input
          type="text"
          id="sector"
          placeholder="Remera"
          required
        >

      </div>


    </div>



    <!-- DETAILS -->

    <div class="grid">


      <div>

        <label id="bedroomsLabel">
          Bedrooms
        </label>

        <input
          type="number"
          id="bedrooms"
          min="0"
          value="0"
        >

      </div>



      <div>

        <label id="bathroomsLabel">
          Bathrooms
        </label>

        <input
          type="number"
          id="bathrooms"
          min="0"
          value="0"
        >

      </div>



      <div>

        <label id="parkingLabel">
          Parking
        </label>

        <input
          type="number"
          id="parking"
          min="0"
          value="0"
        >

      </div>


    </div>



    <!-- MAIN PHOTO -->

    <label id="mainPhotoLabel">
      Main Photo
    </label>

    <input
      type="file"
      id="mainPhoto"
      accept="image/*"
      required
    >



    <!-- OTHER PHOTOS -->

    <label id="otherPhotosLabel">
      Other Photos
    </label>

    <input
      type="file"
      id="otherPhotos"
      accept="image/*"
      multiple
    >



    <!-- DESCRIPTION -->

    <label id="descriptionLabel">
      Description
    </label>

    <textarea
      id="description"
      placeholder="Write property description..."
    ></textarea>



    <!-- PREVIEW -->

    <div
      id="photoPreview"
      class="photos-preview"
    >
    </div>



    <!-- SUBMIT -->

    <button
      type="submit"
      id="postButton"
      class="button primary"
    >
      ➕ Post Property
    </button>



    <!-- MESSAGE -->

    <div
      id="postMessage"
      class="message"
    >
    </div>


  </form>

</div>



<!-- ================= EXISTING PROPERTIES ================= -->

<div class="card">

  <h2 id="propertiesTitle">
    🏠 My Properties
  </h2>

  </p>

</div>



<div
  id="properties"
  class="properties"

  <div class="empty">
    Loading properties...
  </div>

</div>


</div>

let currentLanguage =
  localStorage.getItem(
    "selectedLanguage"
  ) || "Kinyarwanda";


const languageSelector =
  document.getElementById(
    "languageSelector"
  );


languageSelector.value =
  currentLanguage;



function changeLanguage(){

  currentLanguage =
    languageSelector.value;

  localStorage.setItem(
    "selectedLanguage",
    currentLanguage
  );

  applyLanguage();

}



function applyLanguage(){

  const t =
    translations[currentLanguage] ||
    translations.English;


  document.title =
    t.browserTitle;


  document.getElementById(
    "logoText"
  ).textContent =
    t.logo;


  document.getElementById(

    t.home;

    t.pageTitle;


  document.getElementById(
    "pageDescription"
  ).textContent =
    t.pageDescription;


  document.getElementById(
    "languageLabel"
  ).textContent =
    t.language;


  document.getElementById(
    "formTitle"
  ).textContent =
    t.formTitle;


  document.getElementById(
    "titleLabel"
  ).textContent =
    t.title;


  document.getElementById(
    "title"
  ).placeholder =
    t.titlePlaceholder;


  document.getElementById(
    "typeLabel"
  ).textContent =
    t.type;


  const typeSelect =
    document.getElementById(
      "propertyType"
    );


  typeSelect.options[0].text =
    t.chooseType;

  typeSelect.options[1].text =
    t.rent;

  typeSelect.options[2].text =
    t.sale;

  typeSelect.options[3].text =
    t.plot;


  document.getElementById(
    "priceLabel"
  ).textContent =
    t.price;

/* =====================================================
   UPLOAD IMAGE
===================================================== */


async function uploadImage(
  file
){

  const fileName =

    Date.now() +

    "-" +

    Math.random()
      .toString(36)
      .substring(2) +

    "-" +

    file.name
      .replace(
        /\s+/g,
        "-"
      );


  const filePath =
    "properties/" +
    fileName;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from(
      "property-images"
    )
    .upload(
      filePath,
      file,
      {
        upsert:false
      }
    );


  if(error){

    throw error;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from(
      "property-images"
    )
    .getPublicUrl(
      filePath
    );


  return data.publicUrl;

}

  await supabaseClient
    .from(

    .order(
      "created_at",
      {

          <div class="location">

            📍

            ${escapeHtml(
              property.country ||
              ""
            )}

            ,

            ${escapeHtml(
              property.province ||
              ""
            )}

            ,

            ${escapeHtml(
              property.district ||
              ""
            )}

/* =====================================================
   DELETE PROPERTY
===================================================== */


async function deleteProperty(
  id
){

  const t =
    translations[
      currentLanguage
    ] ||
    translations.English;


  if(
    !confirm(
      t.confirmDelete
    )
  ){

    return;

  }


  try{


    /* =========================
       GET PROPERTY
    ========================= */


    const {
      data:property,
      error:fetchError
    } =
    await supabaseClient
      .from(
        "properties"
      )
      .select(
        "main_photo,other_photos"
      )
      .eq(
        "id",
        id
      )
      .maybeSingle();


    if(fetchError){

      throw fetchError;

    }



    /* =========================
       DELETE DATABASE RECORD
    ========================= */


    const {
      error
    } =
    await supabaseClient
      .from(
        "properties"
      )
      .delete()
      .eq(
        "id",
        id
      );


    if(error){

      throw error;

    }



    /* =========================
       DELETE STORAGE FILES
    ========================= */


    const filesToDelete =
      [];


    if(
      property &&
      property.main_photo
    ){

      const path =
        getStoragePath(
          property.main_photo
        );

      if(path){

        filesToDelete.push(
          path
        );

      }

    }


    if(
      property &&
      Array.isArray(
        property.other_photos
      )
    ){

      property.other_photos
        .forEach(
          url => {

            const path =
              getStoragePath(
                url
              );

            if(path){

              filesToDelete.push(
                path
              );

            }

          }
        );

    }


    if(
      filesToDelete.length
    ){

      const {
        error:storageError
      } =
      await supabaseClient
        .storage
        .from(
          "property-images"
        )
        .remove(
          filesToDelete
        );


      if(storageError){

        console.warn(
          "Storage cleanup error:",
          storageError
        );

      }

    }



    alert(
      t.deleted
    );


    await loadProperties();


  }
  catch(error){

    console.error(error);


    alert(
      "❌ " +
      error.message
    );

  }

}



/* =====================================================
   GET STORAGE PATH
===================================================== */


function getStoragePath(
  url
){

  try{

    if(
      !url ||
      typeof url !==
      "string"
    ){

      return null;

    }


    const marker =
      "/storage/v1/object/public/property-images/";


    const index =
      url.indexOf(
        marker
      );


    if(index === -1){

      return null;

    }


    return decodeURIComponent(
      url.substring(
        index +
        marker.length
      )
    );

  }
  catch(error){

    return null;

  }

}



/* =====================================================
   ESCAPE HTML
===================================================== */


function escapeHtml(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
