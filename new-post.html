<!DOCTYPE html>
<html lang="rw">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>New Post - Rwanda House Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5ef;
      color: #33251d;
    }

    header {
      background: #d4a017;
      color: white;
      padding: 18px 20px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.18);
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 18px 60px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      background: white;
      color: #a87800;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #eeeeee;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d4a017;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .language-box {
      border: 2px solid #eee;
      border-radius: 12px;
      padding: 18px;
      margin-top: 18px;
      background: #fffdf7;
    }

    .language-title {
      font-size: 18px;
      font-weight: bold;
      color: #a87800;
      margin-bottom: 10px;
    }

    .button {
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      font-size: 15px;
    }

    .primary {
      background: #d4a017;
      color: white;
    }

    .primary:hover {
      background: #a87800;
    }

    .primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .secondary {
      background: #eeeeee;
      color: #333;
      text-decoration: none;
      display: inline-block;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #e9f8e9;
      color: #227522;
    }

    .error {
      display: block;
      background: #ffe8e8;
      color: #a00000;
    }

    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .preview img {
      width: 110px;
      height: 85px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #eee;
    }

    .info {
      background: #fff8d6;
      border-left: 5px solid #d4a017;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    @media(max-width:700px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

      header h1 {
        font-size: 21px;
      }

    }

  </style>
</head>


<body>

<header>

  <h1>
    🏠 RWANDA HOUSE MARKET — NEW POST
  </h1>

  <a
    href="admin.html"
    class="back">
    ← Back to Admin
  </a>

</header>


<div class="container">


  <div class="card">

    <h2>
      ➕ Shyiraho Property Nshya
    </h2>

    <div class="info">

      Wandika amakuru y'umutungo mu Kinyarwanda.
      System izabika translations z'indimi 5:
      <strong>
        Kinyarwanda, English, Français, Kiswahili na 中文.
      </strong>

    </div>


    <form id="propertyForm">


      <!-- ================= KINYARWANDA ================= -->

      <div class="language-box">

        <div class="language-title">
          🇷🇼 Kinyarwanda
        </div>


        <label>
          Izina ry'inzu / Property
        </label>

        <input
          type="text"
          id="title_rw"
          placeholder="Urugero: Inzu nziza iri i Kigali"
          required
        >


        <label>
          Ibisobanuro
        </label>

        <textarea
          id="description_rw"
          placeholder="Andika ibisobanuro by'iyi property..."
          required
        ></textarea>

      </div>


      <!-- ================= ENGLISH ================= -->

      <div class="language-box">

        <div class="language-title">
          🇬🇧 English
        </div>


        <label>
          Property Title
        </label>

        <input
          type="text"
          id="title_en"
          placeholder="Example: Beautiful House in Kigali"
          required
        >


        <label>
          Description
        </label>

        <textarea
          id="description_en"
          placeholder="Write property description..."
          required
        ></textarea>

      </div>


      <!-- ================= FRENCH ================= -->

      <div class="language-box">

        <div class="language-title">
          🇫🇷 Français
        </div>


        <label>
          Titre de la propriété
        </label>

        <input
          type="text"
          id="title_fr"
          placeholder="Exemple : Belle maison à Kigali"
          required
        >


        <label>
          Description
        </label>

        <textarea
          id="description_fr"
          placeholder="Écrivez la description..."
          required
        ></textarea>

      </div>


      <!-- ================= KISWAHILI ================= -->

      <div class="language-box">

        <div class="language-title">
          🇹🇿 Kiswahili
        </div>


        <label>
          Jina la Nyumba
        </label>

        <input
          type="text"
          id="title_sw"
          placeholder="Mfano: Nyumba nzuri Kigali"
          required
        >


        <label>
          Maelezo
        </label>

        <textarea
          id="description_sw"
          placeholder="Andika maelezo ya nyumba..."
          required
        ></textarea>

      </div>


      <!-- ================= CHINESE ================= -->

      <div class="language-box">

        <div class="language-title">
          🇨🇳 中文
        </div>


        <label>
          房产名称
        </label>

        <input
          type="text"
          id="title_zh"
          placeholder="例如：基加利漂亮的房子"
          required
        >


        <label>
          描述
        </label>

        <textarea
          id="description_zh"
          placeholder="请输入房产描述..."
          required
        ></textarea>

      </div>


      <!-- ================= PROPERTY TYPE ================= -->

      <div class="language-box">

        <div class="language-title">
          🏠 Property Information
        </div>


        <label>
          Property Type
        </label>

        <select
          id="propertyType"
          required>

          <option value="">
            Hitamo ubwoko
          </option>

          <option value="rent">
            House for Rent
          </option>

          <option value="sale">
            House for Sale
          </option>

          <option value="plot">
            Plot for Sale
          </option>

        </select>


        <label>
          Price (RWF)
        </label>

        <input
          type="number"
          id="price"
          placeholder="Urugero: 85000000"
          min="0"
          required
        >


        <div class="grid">


          <div>

            <label>
              Country
            </label>

            <input
              type="text"
              id="country"
              value="Rwanda"
              required
            >

          </div>


          <div>

            <label>
              Province
            </label>

            <input
              type="text"
              id="province"
              placeholder="Kigali"
              required
            >

          </div>


          <div>

            <label>
              District
            </label>

            <input
              type="text"
              id="district"
              placeholder="Gasabo"
              required
            >

          </div>


          <div>

            <label>
              Sector
            </label>

            <input
              type="text"
              id="sector"
              placeholder="Remera"
              required
            >

          </div>

        </div>


        <div class="grid">


          <div>

            <label>
              Bedrooms
            </label>

            <input
              type="number"
              id="bedrooms"
              value="0"
              min="0"
            >

          </div>


          <div>

            <label>
              Bathrooms
            </label>

            <input
              type="number"
              id="bathrooms"
              value="0"
              min="0"
            >

          </div>


          <div>

            <label>
              Parking
            </label>

            <input
              type="number"
              id="parking"
              value="0"
              min="0"
            >

          </div>

        </div>


        <!-- ================= MAIN PHOTO ================= -->

        <label>
          Main Photo
        </label>

        <input
          type="file"
          id="mainPhoto"
          accept="image/*"
          required
        >


        <!-- ================= OTHER PHOTOS ================= -->

        <label>
          Other Photos
        </label>

        <input
          type="file"
          id="otherPhotos"
          accept="image/*"
          multiple
        >


        <div
          id="photoPreview"
          class="preview">
        </div>


        <!-- ================= POST ================= -->

        <button
          type="submit"
          id="postButton"
          class="button primary">

          ➕ Post Property

        </button>


        <a
          href="admin.html"
          class="button secondary">

          Cancel

        </a>


        <div
          id="message"
          class="message">
        </div>


      </div>

    </form>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "propertyForm"
  );


const postButton =
  document.getElementById(
    "postButton"
  );


const message =
  document.getElementById(
    "message"
  );


const photoPreview =
  document.getElementById(
    "photoPreview"
  );


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkLogin(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(!session){

    window.location.href =
      "login.html";

    return false;

  }


  return true;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  message.textContent =
    text;

  message.className =
    "message " + type;

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

document
  .getElementById("otherPhotos")
  .addEventListener(
    "change",
    function(){

      photoPreview.innerHTML =
        "";

      Array
        .from(this.files)
        .forEach(file => {

          const img =
            document.createElement(
              "img"
            );

          img.src =
            URL.createObjectURL(
              file
            );

          photoPreview.appendChild(
            img
          );

        });

    }
  );


/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadImage(
  file
){

  if(!file){

    throw new Error(
      "Ifoto irakenewe."
    );

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const filePath =
    "properties/" +
    fileName;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from(
      "property-images"
    )
    .upload(
      filePath,
      file,
      {
        upsert:false
      }
    );


  if(error){

    throw error;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from(
      "property-images"
    )
    .getPublicUrl(
      filePath
    );


  return data.publicUrl;

}


/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    postButton.disabled =
      true;

    postButton.textContent =
      "Posting...";


    showMessage(
      "",
      ""
    );


    try{


      /* =========================================
         TRANSLATIONS
      ========================================= */

      const titleTranslations = {

        Kinyarwanda:
          document
            .getElementById(
              "title_rw"
            )
            .value
            .trim(),

        English:
          document
            .getElementById(
              "title_en"
            )
            .value
            .trim(),

        Français:
          document
            .getElementById(
              "title_fr"
            )
            .value
            .trim(),

        Kiswahili:
          document
            .getElementById(
              "title_sw"
            )
            .value
            .trim(),

        "中文":
          document
            .getElementById(
              "title_zh"
            )
            .value
            .trim()

      };


      const descriptionTranslations = {

        Kinyarwanda:
          document
            .getElementById(
              "description_rw"
            )
            .value
            .trim(),

        English:
          document
            .getElementById(
              "description_en"
            )
            .value
            .trim(),

        Français:
          document
            .getElementById(
              "description_fr"
            )
            .value
            .trim(),

        Kiswahili:
          document
            .getElementById(
              "description_sw"
            )
            .value
            .trim(),

        "中文":
          document
            .getElementById(
              "description_zh"
            )
            .value
            .trim()

      };


      /* =========================================
         BASIC INFORMATION
      ========================================= */

      const propertyType =
        document
          .getElementById(
            "propertyType"
          )
          .value;


      const price =
        Number(
          document
            .getElementById(
              "price"
            )
            .value
        );


      const country =
        document
          .getElementById(
            "country"
          )
          .value
          .trim();


      const province =
        document
          .getElementById(
            "province"
          )
          .value
          .trim();


      const district =
        document
          .getElementById(
            "district"
          )
          .value
          .trim();


      const sector =
        document
          .getElementById(
            "sector"
          )
          .value
          .trim();


      const bedrooms =
        Number(
          document
            .getElementById(
              "bedrooms"
            )
            .value || 0
        );


      const bathrooms =
        Number(
          document
            .getElementById(
              "bathrooms"
            )
            .value || 0
        );


      const parking =
        Number(
          document
            .getElementById(
              "parking"
            )
            .value || 0
        );


      /* =========================================
         MAIN PHOTO
      ========================================= */

      const mainPhotoFile =
        document
          .getElementById(
            "mainPhoto"
          )
          .files[0];


      if(!mainPhotoFile){

        throw new Error(
          "Main Photo irakenewe."
        );

      }


      const mainPhotoUrl =
        await uploadImage(
          mainPhotoFile
        );


      /* =========================================
         OTHER PHOTOS
      ========================================= */

      const otherPhotoFiles =
        Array.from(
          document
            .getElementById(
              "otherPhotos"
            )
            .files
        );


      const otherPhotoUrls = [];


      for(
        const file
        of otherPhotoFiles
      ){

        const url =
          await uploadImage(
            file
          );

        otherPhotoUrls.push(
          url
        );

      }


      /* =========================================
         INSERT INTO SUPABASE
      ========================================= */

      const {
        error
      } =
      await supabaseClient
        .from(
          "properties"
        )
        .insert({

          title:
            titleTranslations.Kinyarwanda,

          title_translations:
            titleTranslations,

          property_type:
            propertyType,

          price:
            price,

          country:
            country,

          province:
            province,

          district:
            district,

          sector:
            sector,

          bedrooms:
            bedrooms,

          bathrooms:
            bathrooms,

          parking:
            parking,

          main_photo:
            mainPhotoUrl,

          other_photos:
            otherPhotoUrls,

          description:
            descriptionTranslations.Kinyarwanda,

          description_translations:
            descriptionTranslations

        });


      if(error){

        throw error;

      }


      /* =========================================
         SUCCESS
      ========================================= */

      showMessage(
        "✅ Property yashyizwe kuri website neza!",
        "success"
      );


      form.reset();


      document
        .getElementById(
          "country"
        )
        .value =
        "Rwanda";


      photoPreview.innerHTML =
        "";


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });


    }
    catch(error){

      console.error(
        "POST ERROR:",
        error
      );


      showMessage(
        "❌ " +
        (
          error.message ||
          "Habaye ikibazo."
        ),
        "error"
      );

    }


    postButton.disabled =
      false;

    postButton.textContent =
      "➕ Post Property";

  }
);


/* =====================================================
   START
===================================================== */

(async function(){

  await checkLogin();

})();

</script>

</body>
</html>
