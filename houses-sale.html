<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Houses for Sale - Rwanda Property Visata</title>

<link rel="icon" type="image/png" href="logo.png">


<!-- ================= GOOGLE ADSENSE ================= -->

<script
  async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7520250190173475"
  crossorigin="anonymous">
</script>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}


/* ================= HEADER ================= */

header{
  background:#f2c400;
  padding:25px 15px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:30px;
}

.back{
  display:inline-block;
  margin-top:12px;
  background:white;
  color:#222;
  text-decoration:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  transition:.2s;
}

.back:hover{
  background:#fff8d6;
}


/* ================= CONTAINER ================= */

.container{
  max-width:1150px;
  margin:auto;
  padding:30px 20px 60px;
}


/* ================= PAGE TITLE ================= */

.page-title{
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  margin-bottom:25px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.page-title h2{
  margin:0 0 10px;
}

.page-title p{
  margin:0;
  color:#666;
  line-height:1.6;
}


/* ================= ADSENSE ================= */

.ad-container{
  width:100%;
  background:white;
  padding:15px;
  margin:25px 0;
  border-radius:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  text-align:center;
  overflow:hidden;
}

.ad-label{
  font-size:12px;
  color:#777;
  margin-bottom:8px;
}


/* ================= PROPERTIES ================= */

.properties{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.property{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  transition:.2s;
}

.property:hover{
  transform:translateY(-3px);
  box-shadow:0 7px 20px rgba(0,0,0,.17);
}

.property img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}

.property-body{
  padding:18px;
}

.property-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
  line-height:1.4;
}

.price{
  color:#b27b00;
  font-size:21px;
  font-weight:bold;
  margin-bottom:10px;
}

.location{
  color:#555;
  line-height:1.6;
  margin-bottom:15px;
}

.details{
  display:block;
  text-align:center;
  background:#f2c400;
  color:#222;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
}

.details:hover{
  background:#d4a900;
}


/* ================= EMPTY / ERROR ================= */

.empty{
  background:white;
  padding:40px;
  border-radius:12px;
  text-align:center;
  color:#777;
  grid-column:1/-1;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  line-height:1.7;
}

.error{
  background:#ffe8e8;
  color:#a00000;
}


/* ================= MOBILE ================= */

@media(max-width:900px){

  .properties{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  header h1{
    font-size:24px;
  }

  .container{
    padding:20px 14px 50px;
  }

  .page-title{
    padding:20px 15px;
  }

  .properties{
    grid-template-columns:1fr;
  }

  .property img{
    height:230px;
  }

  .property-title{
    font-size:19px;
  }

  .price{
    font-size:20px;
  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

  <h1 id="headerTitle">
    🏡 RWANDA PROPERTY VISATA
  </h1>

  <a
    href="home.html"
    class="back"
    id="backButton">
    ← Back to Home
  </a>

</header>


<div class="container">


<!-- ================= PAGE TITLE ================= -->

<div class="page-title">

  <h2 id="pageTitle">
    🏠 Houses for Sale
  </h2>

  <p id="pageDescription">
    Find houses available for sale in Rwanda.
  </p>

</div>


<!-- ================= ADSENSE ================= -->

<div class="ad-container">

  <div class="ad-label" id="adLabel">
    Advertisement
  </div>

  <ins
    class="adsbygoogle"
    style="display:block"
    data-ad-client="ca-pub-7520250190173475"
    data-ad-slot="7793944660"
    data-ad-format="auto"
    data-full-width-responsive="true">
  </ins>

</div>


<!-- ================= PROPERTIES ================= -->

<div
  id="properties"
  class="properties">

  <div
    class="empty"
    id="loadingMessage">
    Loading houses...
  </div>

</div>

</div>


<script>

/* =====================================================
   LANGUAGE
===================================================== */

const language =
  localStorage.getItem("selectedLanguage") ||
  "English";


/* =====================================================
   TRANSLATIONS
===================================================== */

const translations = {

Kinyarwanda: {

  header:"🏡 RWANDA PROPERTY VISATA",

  back:"← Subira kuri Home",

  title:"🏠 Amazu Agurishwa",

  description:"Shakisha amazu ari kugurishwa mu Rwanda.",

  advertisement:"Kwamamaza",

  loading:"Tegereza, amazu arimo kuboneka...",

  noProperties:"Nta nzu zigurishwa ziraboneka.",

  error:"Habaye ikibazo mu kubona amazu.",

  view:"Reba Ibisobanuro",

  house:"Inzu Igurishwa",

  rwanda:"Rwanda",

  location:"Aho iherereye",

  currency:"RWF"

},


English: {

  header:"🏡 RWANDA PROPERTY VISATA",

  back:"← Back to Home",

  title:"🏠 Houses for Sale",

  description:"Find houses available for sale in Rwanda.",

  advertisement:"Advertisement",

  loading:"Loading houses...",

  noProperties:"No houses for sale available yet.",

  error:"There was a problem loading the houses.",

  view:"View Detail",

  house:"House for Sale",

  rwanda:"Rwanda",

  location:"Location",

  currency:"RWF"

},


Français: {

  header:"🏡 RWANDA PROPERTY VISATA",

  back:"← Retour à l'accueil",

  title:"🏠 Maisons à vendre",

  description:"Trouvez des maisons disponibles à la vente au Rwanda.",

  advertisement:"Publicité",

  loading:"Chargement des maisons...",

  noProperties:"Aucune maison à vendre n'est disponible pour le moment.",

  error:"Un problème est survenu lors du chargement des maisons.",

  view:"Voir les détails",

  house:"Maison à vendre",

  rwanda:"Rwanda",

  location:"Emplacement",

  currency:"RWF"

},


Kiswahili: {

  header:"🏡 RWANDA PROPERTY VISATA",

  back:"← Rudi Mwanzo",

  title:"🏠 Nyumba za Kuuza",

  description:"Pata nyumba zinazopatikana kwa ajili ya kuuza nchini Rwanda.",

  advertisement:"Tangazo",

  loading:"Inapakia nyumba...",

  noProperties:"Hakuna nyumba za kuuza zinazopatikana kwa sasa.",

  error:"Kuna tatizo wakati wa kupakia nyumba.",

  view:"Angalia Maelezo",

  house:"Nyumba ya Kuuza",

  rwanda:"Rwanda",

  location:"Mahali",

  currency:"RWF"

},


"中文": {

  header:"🏡 RWANDA PROPERTY VISATA",

  back:"← 返回首页",

  title:"🏠 出售房屋",

  description:"寻找卢旺达境内可出售的房屋。",

  advertisement:"广告",

  loading:"正在加载房屋...",

  noProperties:"目前没有可出售的房屋。",

  error:"加载房屋时出现问题。",

  view:"查看详情",

  house:"出售房屋",

  rwanda:"卢旺达",

  location:"位置",

  currency:"RWF"

}

};


const t =
  translations[language] ||
  translations.English;


/* =====================================================
   APPLY LANGUAGE
===================================================== */

document.documentElement.lang =
  language === "中文"
    ? "zh"
    : language === "Français"
      ? "fr"
      : language === "Kiswahili"
        ? "sw"
        : language === "Kinyarwanda"
          ? "rw"
          : "en";


document.getElementById("headerTitle").textContent =
  t.header;

document.getElementById("backButton").textContent =
  t.back;

document.getElementById("pageTitle").textContent =
  t.title;

document.getElementById("pageDescription").textContent =
  t.description;

document.getElementById("adLabel").textContent =
  t.advertisement;

document.getElementById("loadingMessage").textContent =
  t.loading;

document.title =
  t.title.replace("🏠 ","") +
  " - Rwanda Property Visata";


/* =====================================================
   SUPABASE
===================================================== */

/*
  IMPORTANT:

  SUPABASE_URL ntabwo ari /rest/v1/

  URL nyayo ni:
  https://hsmnybmcddtsyooltozw.supabase.co
*/

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";


/*
  Iyi ni Publishable Key.

  Niba iyi key yawe itagikora,
  uyisimbuze na Publishable key iri muri:

  Supabase
  → Project Settings
  → API
*/

const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcRe48WE9mw_FdzMO29";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENT
===================================================== */

const propertiesElement =
  document.getElementById("properties");


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   GET IMAGE
===================================================== */

function getPropertyImage(property){

  let image =
    property.main_photo || "";


  /*
    Handle other_photos if it is
    already an array.
  */

  if(
    !image &&
    Array.isArray(property.other_photos) &&
    property.other_photos.length > 0
  ){

    image =
      property.other_photos[0];

  }


  /*
    Handle other_photos if Supabase
    returns it as JSON string.
  */

  if(
    !image &&
    typeof property.other_photos === "string"
  ){

    try{

      const parsed =
        JSON.parse(property.other_photos);

      if(
        Array.isArray(parsed) &&
        parsed.length > 0
      ){

        image =
          parsed[0];

      }

    }
    catch(error){

      console.log(
        "Could not parse other_photos."
      );

    }

  }


  if(!image){

    image =
      "https://via.placeholder.com/800x500?text=" +
      encodeURIComponent(t.house);

  }


  return image;

}


/* =====================================================
   GET LOCATION
===================================================== */

function getLocation(property){

  const parts = [

    property.country,

    property.province,

    property.district,

    property.sector

  ].filter(
    value =>
      value !== null &&
      value !== undefined &&
      String(value).trim() !== ""
  );


  return parts.length > 0
    ? parts.join(", ")
    : t.rwanda;

}


/* =====================================================
   LOAD HOUSES
===================================================== */

async function loadSaleProperties(){

  propertiesElement.innerHTML = `

    <div class="empty">

      ${escapeHtml(t.loading)}

    </div>

  `;


  try{

    /*
      IMPORTANT:

      Ntabwo dushyizemo .eq("status","published")
      kuko bishobora gutuma houses zitagaragara
      niba table yawe idakoresha iyo column/value.
    */

    const {
      data,
      error
    } = await supabaseClient

      .from("property_posts")

      .select("*")

      .eq(
        "property_type",
        "sale"
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    /* ================= ERROR ================= */

    if(error){

      console.error(
        "Supabase error:",
        error
      );

      propertiesElement.innerHTML = `

        <div class="empty error">

          ❌ ${escapeHtml(
            error.message ||
            t.error
          )}

        </div>

      `;

      return;

    }


    /* ================= EMPTY ================= */

    if(
      !data ||
      data.length === 0
    ){

      propertiesElement.innerHTML = `

        <div class="empty">

          🏠

          <br><br>

          ${escapeHtml(
            t.noProperties
          )}

        </div>

      `;

      return;

    }


    /* ================= CLEAR ================= */

    propertiesElement.innerHTML = "";


    /* ================= CARDS ================= */

    data.forEach(property => {

      const card =
        document.createElement("div");

      card.className =
        "property";


      const image =
        getPropertyImage(property);


      const propertyTitle =
        property.title ||
        t.house;


      const price =
        Number(
          property.price || 0
        ).toLocaleString("en-US");


      const location =
        getLocation(property);


      const detailUrl =
        "house-sale-detail.html?id=" +
        encodeURIComponent(property.id);


      card.innerHTML = `

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(propertyTitle)}"
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/800x500?text=No+Photo'"
        >


        <div class="property-body">

          <div class="property-title">

            ${escapeHtml(propertyTitle)}

          </div>


          <div class="price">

            ${price} ${t.currency}

          </div>


          <div class="location">

            📍 ${escapeHtml(location)}

          </div>


          <a
            class="details"
            href="${escapeHtml(detailUrl)}">

            ${escapeHtml(t.view)}

          </a>

        </div>

      `;


      propertiesElement.appendChild(card);

    });

  }

  catch(error){

    console.error(
      "Unexpected error:",
      error
    );


    propertiesElement.innerHTML = `

      <div class="empty error">

        ❌ ${escapeHtml(
          error.message ||
          t.error
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

loadSaleProperties();


/* =====================================================
   START ADSENSE
===================================================== */

window.addEventListener(
  "load",
  function(){

    try{

      (
        window.adsbygoogle =
        window.adsbygoogle ||
        []
      ).push({});

    }
    catch(error){

      console.log(
        "AdSense:",
        error
      );

    }

  }
);

</script>

</body>
</html>
