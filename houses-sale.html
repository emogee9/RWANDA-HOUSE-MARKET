<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Houses for Sale - Rwanda House Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#f2c400;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

.back{
  display:inline-block;
  margin-top:12px;
  background:white;
  color:#222;
  text-decoration:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:30px 20px 60px;
}

.page-title{
  background:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  margin-bottom:25px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.properties{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.property{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.property img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}

.property-body{
  padding:18px;
}

.property-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.price{
  color:#b27b00;
  font-size:21px;
  font-weight:bold;
  margin-bottom:10px;
}

.location{
  color:#555;
  line-height:1.6;
  margin-bottom:15px;
}

.details{
  display:block;
  text-align:center;
  background:#f2c400;
  color:#222;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
}

.details:hover{
  background:#d4a900;
}

.empty{
  background:white;
  padding:40px;
  border-radius:12px;
  text-align:center;
  color:#777;
  grid-column:1/-1;
}

.loading{
  text-align:center;
  padding:40px;
}

@media(max-width:900px){
  .properties{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .properties{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

  <h1>🏡 RWANDA HOUSE MARKET</h1>

  <a href="home.html" class="back">
    ← Back to Home
  </a>

</header>


<div class="container">

  <div class="page-title">

    <h2>🏠 Houses for Sale</h2>

    <p>
      Find houses available for sale in Rwanda.
    </p>

  </div>


  <div id="properties" class="properties">

    <div class="empty">
      Loading houses...
    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ELEMENT
========================= */

const propertiesElement =
  document.getElementById("properties");


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   LOAD SALE PROPERTIES
========================= */

async function loadSaleProperties(){

  propertiesElement.innerHTML = `
    <div class="empty">
      Loading houses...
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("properties")
    .select("*")
    .eq("property_type","sale")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    propertiesElement.innerHTML = `
      <div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if(!data || data.length === 0){

    propertiesElement.innerHTML = `
      <div class="empty">
        No houses for sale available yet.
      </div>
    `;

    return;
  }


  propertiesElement.innerHTML = "";


  data.forEach(property => {

    const card =
      document.createElement("div");

    card.className = "property";


    const image =
      property.main_photo ||
      "https://via.placeholder.com/800x500?text=No+Photo";


    card.innerHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(property.title || "House")}"
      >

      <div class="property-body">

        <div class="property-title">
          ${escapeHtml(
            property.title || "House for Sale"
          )}
        </div>

        <div class="price">
          ${Number(
            property.price || 0
          ).toLocaleString()} RWF
        </div>

        <div class="location">

          🌍 Country:
          ${escapeHtml(property.country || "")}

          <br>

          📍 District:
          ${escapeHtml(property.district || "")}

        </div>

        <a
          class="details"
          href="house-sale-detail.html?id=${encodeURIComponent(property.id)}">

          View Detail

        </a>

      </div>

    `;


    propertiesElement.appendChild(card);

  });

}


/* =========================
   START
========================= */

loadSaleProperties();

</script>

</body>
</html>
