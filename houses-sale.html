/* =====================================================
   VISITOR TRACKING
===================================================== */

async function trackPageView(){

  try{

    let visitorId =
      localStorage.getItem("rpv_visitor_id");

    if(!visitorId){

      if(
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ){

        visitorId =
          crypto.randomUUID();

      }else{

        visitorId =
          "visitor_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2);

      }

      localStorage.setItem(
        "rpv_visitor_id",
        visitorId
      );

    }


    let sessionId =
      sessionStorage.getItem("rpv_session_id");

    if(!sessionId){

      if(
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ){

        sessionId =
          crypto.randomUUID();

      }else{

        sessionId =
          "session_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2);

      }

      sessionStorage.setItem(
        "rpv_session_id",
        sessionId
      );

    }


    const {
      error
    } = await supabaseClient

      .from("page_views")

      .insert({

        page:
          document.title ||
          location.pathname,

        path:
          location.pathname,

        visitor_id:
          visitorId,

        session_id:
          sessionId,

        referrer:
          document.referrer ||
          null,

        user_agent:
          navigator.userAgent,

        device_type:
          getDeviceType(),

        country:
          null,

        city:
          null

      });


    if(error){

      console.error(
        "Visitor tracking error:",
        error
      );

    }

  }

  catch(error){

    console.error(
      "Tracking failed:",
      error
    );

  }

}


function getDeviceType(){

  if(window.innerWidth <= 600){

    return "mobile";

  }

  if(window.innerWidth <= 1024){

    return "tablet";

  }

  return "desktop";

}


trackPageView();

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   GET IMAGE
===================================================== */

function getPropertyImage(property){

  let image =
    property.main_photo ||
    "";


  /* MAIN PHOTO EMPTY */

  if(
    !image &&
    Array.isArray(
      property.other_photos
    ) &&
    property.other_photos.length > 0
  ){

    image =
      property.other_photos[0];

  }


  /* OTHER PHOTOS JSON STRING */

  if(
    !image &&
    typeof property.other_photos ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          property.other_photos
        );


      if(
        Array.isArray(parsed) &&
        parsed.length > 0
      ){

        image =
          parsed[0];

      }

    }

    catch(error){

      console.log(
        "Photo parsing error:",
        error
      );

    }

  }


  /* PLACEHOLDER */

  if(!image){

    image =
      "https://via.placeholder.com/800x500?text=" +
      encodeURIComponent(
        t.noPhoto
      );

  }


  return image;

}


/* =====================================================
   GET LOCATION
===================================================== */

function getLocation(property){

  const parts = [

    property.country,

    property.province,

    property.district,

    property.sector

  ].filter(

    value =>

      value !== null &&

      value !== undefined &&

      String(value).trim() !== ""

  );


  if(parts.length > 0){

    return parts.join(", ");

  }


  return t.rwanda;

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(price){

  if(
    price === null ||
    price === undefined ||
    price === ""
  ){

    return "0";

  }


  const number =
    Number(price);


  if(
    Number.isNaN(number)
  ){

    return "0";

  }


  return number.toLocaleString(
    "en-US"
  );

}


/* =====================================================
   LOAD SALE PROPERTIES
===================================================== */

async function loadSaleProperties(){

  propertiesElement.innerHTML = `

    <div class="empty loading">

      ${escapeHtml(
        t.loading
      )}

    </div>

  `;


  try{

    const {
      data,
      error
    } = await supabaseClient

      .from("property_posts")

      .select("*")

      .eq(
        "property_type",
        "sale"
      )

      .eq(
        "status",
        "published"
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    /* =================================================
       ERROR
    ================================================= */

    if(error){

      console.error(
        "SUPABASE ERROR:",
        error
      );


      propertiesElement.innerHTML = `

        <div class="empty error">

          ❌<br><br>

          ${escapeHtml(
            t.error
          )}

          <br><br>

          <small>
            ${escapeHtml(
              error.message || ""
            )}
          </small>

        </div>

      `;


      return;

    }


    /* =================================================
       EMPTY
    ================================================= */

    if(
      !data ||
      data.length === 0
    ){

      propertiesElement.innerHTML = `

        <div class="empty">

          🏠<br><br>

          ${escapeHtml(
            t.noProperties
          )}

        </div>

      `;


      return;

    }


    /* =================================================
       CLEAR LOADING
    ================================================= */

    propertiesElement.innerHTML =
      "";


    /* =================================================
       CREATE PROPERTY CARDS
    ================================================= */

    data.forEach(
      property => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "property";


        /* ================= IMAGE ================= */

        const image =
          getPropertyImage(
            property
          );


        /* ================= TITLE ================= */

        const propertyTitle =
          property.title ||
          t.house;


        /* ================= PRICE ================= */

        const formattedPrice =
          formatPrice(
            property.price
          );


        /* ================= LOCATION ================= */

        const location =
          getLocation(
            property
          );


        /* ================= DETAIL URL ================= */

        const detailUrl =
          "house-sale-detail.html?id=" +
          encodeURIComponent(
            property.id
          );


        /* ================= CARD ================= */

        card.innerHTML = `

          <img

            src="${escapeHtml(
              image
            )}"

            alt="${escapeHtml(
              propertyTitle
            )}"

            loading="lazy"

            onerror="
              this.onerror=null;
              this.src='https://via.placeholder.com/800x500?text=${encodeURIComponent(
                t.noPhoto
              )}';
            "

          >


          <div class="property-body">


            <div class="property-title">

              ${escapeHtml(
                propertyTitle
              )}

            </div>


            <div class="price">

              ${escapeHtml(
                formattedPrice
              )}

              RWF

            </div>


            <div class="location">

              📍

              ${escapeHtml(
                location
              )}

            </div>


            <a

              class="details"

              href="${escapeHtml(
                detailUrl
              )}"

            >

              ${escapeHtml(
                t.view
              )}

            </a>


          </div>

        `;


        propertiesElement.appendChild(
          card
        );

      }
    );


  }

  catch(error){

    console.error(
      "Unexpected error:",
      error
    );


    propertiesElement.innerHTML = `

      <div class="empty error">

        ❌<br><br>

        ${escapeHtml(
          t.error
        )}

        <br><br>

        <small>
          ${escapeHtml(
            error.message || ""
          )}
        </small>

      </div>

    `;

  }

}


/* =====================================================
