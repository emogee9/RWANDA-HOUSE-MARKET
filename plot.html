<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plots for Sale - Rwanda House Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="language.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#f2c400;
  padding:25px 15px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:30px;
}

.back{
  display:inline-block;
  margin-top:12px;
  padding:10px 18px;
  background:white;
  color:#222;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:30px 20px 60px;
}

.page-title{
  background:white;
  padding:25px;
  text-align:center;
  border-radius:15px;
  margin-bottom:25px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.page-title h2{
  margin-top:0;
}

.plots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.plot{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.plot img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}

.plot-body{
  padding:18px;
}

.plot-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

.price{
  color:#b27b00;
  font-size:21px;
  font-weight:bold;
  margin-bottom:12px;
}

.location{
  color:#555;
  line-height:1.7;
}

.detail-button{
  display:block;
  margin-top:15px;
  background:#f2c400;
  color:#222;
  text-align:center;
  text-decoration:none;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.detail-button:hover{
  background:#d4a900;
}

.empty{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:12px;
  color:#777;
}

.error{
  background:#fff;
  padding:30px;
  text-align:center;
  border-radius:12px;
  color:#b00000;
  border:1px solid #e00000;
}

@media(max-width:900px){
  .plots{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .plots{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>

  <h1 id="headerTitle">
    🏡 RWANDA HOUSE MARKET
  </h1>

  <a
    href="home.html"
    class="back"
    id="backButton">
    ← Back to Home
  </a>

</header>

<div class="container">

  <div class="page-title">

    <h2 id="pageTitle">
      🌍 Plots for Sale
    </h2>

    <p id="pageDescription">
      Find plots available for sale in Rwanda.
    </p>

  </div>

  <div
    id="plots"
    class="plots">

    <div class="empty" id="loadingText">
      Loading plots...
    </div>

  </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTS
========================================================= */

const plotsElement =
  document.getElementById("plots");


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   LANGUAGE
========================================================= */

const language =
  localStorage.getItem("selectedLanguage")
  || "English";


const translations = {

  Kinyarwanda:{

    title:"🌍 Ibibanza bigurishwa",

    description:
      "Shaka ibibanza biri kugurishwa mu Rwanda.",

    back:"← Subira kuri Home",

    detail:"Reba ibisobanuro",

    loading:"Turimo gushaka ibibanza...",

    noPlots:
      "Nta kibanza kiraboneka.",

    country:"Igihugu",

    province:"Intara",

    district:"Akarere",

    sector:"Umurenge",

    error:"Habaye ikibazo mu kuzana ibibanza."

  },


  English:{

    title:"🌍 Plots for Sale",

    description:
      "Find plots available for sale in Rwanda.",

    back:"← Back to Home",

    detail:"View Detail",

    loading:"Loading plots...",

    noPlots:
      "No plots are available yet.",

    country:"Country",

    province:"Province",

    district:"District",

    sector:"Sector",

    error:"There was an error loading plots."

  },


  Français:{

    title:"🌍 Terrains à vendre",

    description:
      "Trouvez des terrains disponibles à la vente au Rwanda.",

    back:"← Retour à l'accueil",

    detail:"Voir les détails",

    loading:"Chargement des terrains...",

    noPlots:
      "Aucun terrain disponible.",

    country:"Pays",

    province:"Province",

    district:"District",

    sector:"Secteur",

    error:
      "Une erreur s'est produite lors du chargement."

  },


  Kiswahili:{

    title:"🌍 Viwanja vya Kuuza",

    description:
      "Pata viwanja vinavyopatikana kwa kuuza nchini Rwanda.",

    back:"← Rudi Mwanzo",

    detail:"Tazama Maelezo",

    loading:"Inapakia viwanja...",

    noPlots:
      "Hakuna viwanja vinavyopatikana.",

    country:"Nchi",

    province:"Mkoa",

    district:"Wilaya",

    sector:"Sekta",

    error:
      "Hitilafu imetokea wakati wa kupakia viwanja."

  },


  "中文":{

    title:"🌍 出售土地",

    description:
      "寻找卢旺达可出售的土地。",

    back:"← 返回首页",

    detail:"查看详情",

    loading:"正在加载土地...",

    noPlots:
      "目前没有可出售的土地。",

    country:"国家",

    province:"省",

    district:"地区",

    sector:"区域",

    error:"加载土地时发生错误。"

  }

};


const t =
  translations[language]
  || translations.English;


/* =========================================================
   APPLY LANGUAGE
========================================================= */

document.getElementById("pageTitle")
  .textContent = t.title;

document.getElementById("pageDescription")
  .textContent = t.description;

document.getElementById("backButton")
  .textContent = t.back;

document.getElementById("loadingText")
  .textContent = t.loading;


/* =========================================================
   OPEN ONLY THE CLICKED PLOT
========================================================= */

function openPlotDetail(plotId){

  /*
    ID iva muri database ni yo yonyine
    ijya kuri plot-detail.html.
  */

  if(!plotId){

    console.error(
      "Plot ID is missing."
    );

    alert(
      "This plot does not have a valid ID."
    );

    return;
  }


  const cleanId =
    String(plotId).trim();


  const url =
    "plot-detail.html?id=" +
    encodeURIComponent(cleanId);


  console.log(
    "Opening plot:",
    cleanId
  );


  window.location.href = url;

}


/* =========================================================
   LOAD PLOTS
========================================================= */

async function loadPlots(){

  plotsElement.innerHTML = `
    <div class="empty">
      ${escapeHtml(t.loading)}
    </div>
  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient

      .from("property_posts")

      .select(`
        id,
        title,
        price,
        property_type,
        country,
        province,
        district,
        sector,
        main_photo,
        other_photos,
        created_at
      `)

      .eq(
        "property_type",
        "plot"
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );


    /* =====================================================
       SUPABASE ERROR
    ===================================================== */

    if(error){

      console.error(
        "Supabase error:",
        error
      );

      plotsElement.innerHTML = `
        <div class="error">

          ❌ ${escapeHtml(t.error)}

          <br><br>

          ${escapeHtml(error.message)}

        </div>
      `;

      return;
    }


    /* =====================================================
       NO PLOTS
    ===================================================== */

    if(
      !data ||
      data.length === 0
    ){

      plotsElement.innerHTML = `
        <div class="empty">

          ${escapeHtml(t.noPlots)}

        </div>
      `;

      return;
    }


    /* =====================================================
       CLEAR
    ===================================================== */

    plotsElement.innerHTML = "";


    /* =====================================================
       CREATE EACH PLOT
    ===================================================== */

    data.forEach(plot => {

      /*
        IMPORTANT:

        plot.id ni ID nyayo iva muri
        property_posts.

        Ntitukora ID nshya.
      */

      const plotId =
        plot.id;


      /* PHOTO */

      let photo =
        plot.main_photo
        || "";


      if(
        !photo &&
        Array.isArray(
          plot.other_photos
        ) &&
        plot.other_photos.length
      ){

        photo =
          plot.other_photos[0];

      }


      photo =
        photo ||
        "https://via.placeholder.com/800x500?text=Plot";


      /* CARD */

      const card =
        document.createElement("div");

      card.className =
        "plot";


      /* CARD HTML */

      card.innerHTML = `

        <img
          src="${escapeHtml(photo)}"
          alt="${escapeHtml(
            plot.title || "Plot"
          )}"
        >

        <div class="plot-body">

          <div class="plot-title">

            ${escapeHtml(
              plot.title ||
              "Plot for Sale"
            )}

          </div>


          <div class="price">

            ${Number(
              plot.price || 0
            ).toLocaleString()}

            RWF

          </div>


          <div class="location">

            ${
              plot.country
              ? `
                🌍
                ${escapeHtml(t.country)}:
                ${escapeHtml(plot.country)}
                <br>
              `
              : ""
            }


            ${
              plot.province
              ? `
                📍
                ${escapeHtml(t.province)}:
                ${escapeHtml(plot.province)}
                <br>
              `
              : ""
            }


            ${
              plot.district
              ? `
                📍
                ${escapeHtml(t.district)}:
                ${escapeHtml(plot.district)}
                <br>
              `
              : ""
            }


            ${
              plot.sector
              ? `
                📍
                ${escapeHtml(t.sector)}:
                ${escapeHtml(plot.sector)}
              `
              : ""
            }

          </div>


          <button
            type="button"
            class="detail-button"
            data-plot-id="${escapeHtml(plotId)}">

            ${escapeHtml(t.detail)}

          </button>

        </div>

      `;


      /* ===================================================
         VIEW DETAIL BUTTON
      =================================================== */

      const detailButton =
        card.querySelector(
          ".detail-button"
        );


      detailButton.addEventListener(
        "click",
        function(){

          const id =
            this.getAttribute(
              "data-plot-id"
            );


          openPlotDetail(id);

        }
      );


      plotsElement.appendChild(
        card
      );

    });

  }

  catch(error){

    console.error(
      "Unexpected error:",
      error
    );

    plotsElement.innerHTML = `
      <div class="error">

        ❌ ${escapeHtml(t.error)}

      </div>
    `;

  }

}


/* =========================================================
   START
========================================================= */

loadPlots();

</script>

</body>
</html>
