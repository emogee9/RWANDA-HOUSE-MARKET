<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - Rwanda Property Visata</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4c542;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;

      background: white;
      padding: 35px;

      border-radius: 18px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.25);

      text-align: center;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: #d4a017;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin: 10px 0 28px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #3b2418;
    }

    input {
      width: 100%;
      padding: 14px;

      border: 2px solid #ddd;
      border-radius: 9px;

      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d4a017;
    }

    button {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 9px;

      background: #d4a017;
      color: white;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #b8860b;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;

      display: none;
      font-weight: bold;
    }

    .error {
      display: block !important;
      background: #ffe1e1;
      color: #b00000;
    }

    .success {
      display: block !important;
      background: #e0ffe7;
      color: #08752a;
    }

    .back {
      display: inline-block;
      margin-top: 20px;

      color: #d4a017;
      text-decoration: none;
      font-weight: bold;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      🔐
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Rwanda Property Visata
    </p>

    <form id="adminLoginForm">

      <div class="input-group">

        <label for="email">
          Admin Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter admin email"
          required
        >

      </div>


      <div class="input-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >

      </div>


      <button
        type="submit"
        id="loginButton">
        Login as Admin
      </button>

    </form>


    <div id="message"></div>


    <a
      href="./home.html"
      class="back">
      ← Back to Home
    </a>

  </div>


  <script>

    /*
      ==================================================
      SUPABASE CONFIGURATION
      ==================================================

      HANO USHYIRAMO:

      1. SUPABASE https://hsmnybmcddtsyooltozw.supabase.co
      2. SUPABASE sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u

      Ntushyiremo service_role key.
    */


    const SUPABASE_URL =
      "https://hsmnybmcddtsyooltozw.supabase.co";


    const SUPABASE_ANON_KEY =
      "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";


    const { createClient } =
      supabase;


    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /*
      ADMIN EMAIL
    */

    const ADMIN_EMAIL =
      "rwandahousemarket@gmail.com";


    /*
      ELEMENTS
    */

    const form =
      document.getElementById(
        "adminLoginForm"
      );

    const emailInput =
      document.getElementById(
        "email"
      );

    const passwordInput =
      document.getElementById(
        "password"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const message =
      document.getElementById(
        "message"
      );


    /*
      MESSAGE FUNCTION
    */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        type;

    }


    /*
      ADMIN LOGIN
    */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        /*
          REBA KO EMAIL ARI ADMIN
        */

        if (
          email !==
          ADMIN_EMAIL
        ) {

          showMessage(
            "You are not authorized as an admin.",
            "error"
          );

          return;
        }


        loginButton.disabled =
          true;

        loginButton.textContent =
          "Logging in...";


        try {

          /*
            SUPABASE LOGIN
          */

          const {
            data,
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });


          if (error) {

            showMessage(
              error.message,
              "error"
            );

            loginButton.disabled =
              false;

            loginButton.textContent =
              "Login as Admin";

            return;
          }


          /*
            LOGIN YAGENZE NEZA
          */

          if (
            data &&
            data.user
          ) {

            showMessage(
              "Login successful. Opening Admin Panel...",
              "success"
            );


            setTimeout(
              function() {

                window.location.href =
                  "./admin.html";

              },
              800
            );

          }

        }

        catch(error) {

          console.error(
            error
          );

          showMessage(
            "Something went wrong. Please try again.",
            "error"
          );

          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login as Admin";

        }

      }
    );

  </script>

</body>
</html>
