<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login - Rwanda Property Visata</title>

<link rel="icon" type="image/png" href="logo.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f7f5ef;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#33251d;
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  padding:35px;
  border-radius:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.logo{
  width:70px;
  height:70px;
  object-fit:contain;
  display:block;
  margin:0 auto 15px;
}

h1{
  text-align:center;
  margin:0 0 8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:17px;
  font-size:15px;
}

input:focus{
  outline:none;
  border-color:#d4a017;
}

.login-button{
  width:100%;
  border:0;
  background:#d4a017;
  color:white;
  padding:14px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.login-button:hover{
  background:#a87800;
}

.login-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  text-align:center;
  font-size:14px;
}

.message.error{
  display:block;
  background:#ffe5e5;
  color:#a00000;
}

.message.success{
  display:block;
  background:#e5f8e9;
  color:#14752c;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#8a6500;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

  <img
    src="logo.png"
    class="logo"
    alt="Rwanda Property Visata"
  >

  <h1>Admin Login</h1>

  <div class="subtitle">
    Rwanda Property Visata
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      required
      autocomplete="email"
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      required
      autocomplete="current-password"
    >

    <button
      type="submit"
      id="loginButton"
      class="login-button">
      Login
    </button>

  </form>

  <a
    href="home.html"
    class="back">
    ← Back to Home
  </a>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type = "error"
){

  message.textContent = text;

  message.className =
    "message " + type;

}


/* =========================================================
   CHECK EXISTING LOGIN
========================================================= */

async function checkExistingSession(){

  const {
    data
  } = await supabaseClient.auth.getSession();

  if(
    data &&
    data.session
  ){

    window.location.href =
      "admin.html";

  }

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(!email || !password){

      showMessage(
        "Please enter your email and password."
      );

      return;

    }


    loginButton.disabled =
      true;

    loginButton.textContent =
      "Logging in...";


    showMessage(
      "",
      "success"
    );


    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({

        email:
          email,

        password:
          password

      });


    if(error){

      console.error(
        "Login error:",
        error
      );


      showMessage(
        "Login failed: " +
        error.message,
        "error"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

      return;

    }


    if(
      !data ||
      !data.session
    ){

      showMessage(
        "Login failed. No active session.",
        "error"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

      return;

    }


    showMessage(
      "Login successful. Opening admin dashboard...",
      "success"
    );


    setTimeout(
      function(){

        window.location.href =
          "admin.html";

      },
      500
    );

  }
);


/* =========================================================
   START
========================================================= */

checkExistingSession();

</script>

</body>
</html>
