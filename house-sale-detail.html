/* =========================================================
   LANGUAGE

let currentLanguage =
  localStorage.getItem("selectedLanguage")

if(!translations[currentLanguage]){

    "Kinyarwanda";

function changeLanguage(){

  currentLanguage =
    document.getElementById(
      "languageSelect"
    ).value;

  localStorage.setItem(
    "selectedLanguage",
    currentLanguage
  );

  renderProperty();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   GET PROPERTY ID
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const propertyId =
  params.get("id");


/* =========================================================
   PROPERTY
========================================================= */

let property = null;

let galleryPhotos = [];

let currentPhoto = 0;


/* =========================================================
   LOAD ONE PROPERTY
========================================================= */

async function loadProperty(){

  const detailCard =
    document.getElementById(
      "detailCard"
    );

  const t =
    translations[currentLanguage];


  if(!propertyId){

    detailCard.innerHTML = `
      <div class="error">
        ❌ ${escapeHtml(t.error)}
      </div>
    `;

    return;

  }


  detailCard.innerHTML = `
    <div class="loading">
      ${escapeHtml(t.loading)}
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("property_posts")
    .select("*")
    .eq("id",propertyId)
    .maybeSingle();


  if(error){

    console.error(error);

    detailCard.innerHTML = `
      <div class="error">
        ❌ ${escapeHtml(error.message)}
      </div>
    `;

    return;

  }


  if(!data){

    detailCard.innerHTML = `
      <div class="error">
        ❌ ${escapeHtml(t.error)}
      </div>
    `;

    return;

  }


  /*
    IMPORTANT:

    Turerekana gusa property ifite
    ID yaje muri URL.

    Ntabwo tuzerekana izindi houses.
  */

  property = data;


  galleryPhotos = [];


  if(property.main_photo){

    galleryPhotos.push(
      property.main_photo
    );

  }


  if(
    Array.isArray(
      property.other_photos
    )
  ){

    property.other_photos.forEach(
      photo => {

        if(
          photo &&
          !galleryPhotos.includes(photo)
        ){

          galleryPhotos.push(photo);

        }

      }
    );

  }


  /*
    Sometimes other_photos can be
    stored as JSON text.
  */

  if(
    typeof property.other_photos ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          property.other_photos
        );

      if(Array.isArray(parsed)){

        parsed.forEach(
          photo => {

            if(
              photo &&
              !galleryPhotos.includes(photo)
            ){

              galleryPhotos.push(photo);

            }

          }
        );

      }

    }
    catch(e){

      console.warn(
        "other_photos is not valid JSON"
      );

    }

  }


  currentPhoto = 0;

  renderProperty();

}


/* =========================================================
   RENDER PROPERTY
========================================================= */

  if(!property){

/* =========================================================
   GALLERY CONTROLS
========================================================= */

function selectPhoto(index){

  if(
    index < 0 ||
    index >= galleryPhotos.length
  ){

    return;

  }


  currentPhoto = index;

  renderProperty();

}


function previousPhoto(){

  if(
    galleryPhotos.length <= 1
  ){

    return;

  }


  currentPhoto--;

  if(currentPhoto < 0){

    currentPhoto =
      galleryPhotos.length - 1;

  }


  renderProperty();

}


function nextPhoto(){

  if(
    galleryPhotos.length <= 1
  ){

    return;

  }


  currentPhoto++;

  if(
    currentPhoto >=
    galleryPhotos.length
  ){

    currentPhoto = 0;

  }


  renderProperty();

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  window.location.href =
    "home.html";
