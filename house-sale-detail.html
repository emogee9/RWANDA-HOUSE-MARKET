<header>

<div class="container">

  <div class="ad-container">

    <ins

<script>

/* =====================================================
   LANGUAGE - 5 LANGUAGES ONLY
===================================================== */

const translations = {

  Kinyarwanda: {
    header:"🏡 RWANDA PROPERTY VISATA",
    back:"← Subira kuri Home",
    title:"🏠 Amazu Agurishwa",
    description:"Shakisha amazu ari kugurishwa mu Rwanda.",
    advertisement:"Kwamamaza",
    loading:"Tegereza, amazu arimo kuboneka...",
    noProperties:"Nta nzu zigurishwa ziraboneka.",
    error:"Habaye ikibazo mu kubona amazu.",
    view:"Reba Ibisobanuro",
    house:"Inzu Igurishwa",
    rwanda:"Rwanda",
    noPhoto:"Nta Foto",
    designedBy:"Byakozwe na Irene"
  },

  English: {
    header:"🏡 RWANDA PROPERTY VISATA",
    back:"← Back to Home",
    title:"🏠 Houses for Sale",
    description:"Find houses available for sale in Rwanda.",
    advertisement:"Advertisement",
    loading:"Loading houses...",
    noProperties:"No houses for sale available yet.",
    error:"There was a problem loading the houses.",
    view:"View Details",
    house:"House for Sale",
    rwanda:"Rwanda",
    noPhoto:"No Photo",
    designedBy:"Designed by Irene"
  },

  Français: {
    header:"🏡 RWANDA PROPERTY VISATA",
    back:"← Retour à l'accueil",
    title:"🏠 Maisons à vendre",
    description:"Trouvez des maisons disponibles à la vente au Rwanda.",
    advertisement:"Publicité",
    loading:"Chargement des maisons...",
    noProperties:"Aucune maison à vendre n'est disponible pour le moment.",
    error:"Un problème est survenu lors du chargement des maisons.",
    view:"Voir les détails",
    house:"Maison à vendre",
    rwanda:"Rwanda",
    noPhoto:"Aucune photo",
    designedBy:"Conçu par Irene"
  },

  Kiswahili: {
    header:"🏡 RWANDA PROPERTY VISATA",
    back:"← Rudi Mwanzo",
    title:"🏠 Nyumba za Kuuza",
    description:"Pata nyumba zinazopatikana kwa ajili ya kuuza nchini Rwanda.",
    advertisement:"Tangazo",
    loading:"Inapakia nyumba...",
    noProperties:"Hakuna nyumba za kuuza zinazopatikana kwa sasa.",
    error:"Kuna tatizo wakati wa kupakia nyumba.",
    view:"Angalia Maelezo",
    house:"Nyumba ya Kuuza",
    rwanda:"Rwanda",
    noPhoto:"Hakuna Picha",
    designedBy:"Imeundwa na Irene"
  },

  "中文": {
    header:"🏡 RWANDA PROPERTY VISATA",
    back:"← 返回首页",
    title:"🏠 出售房屋",
    description:"寻找卢旺达境内可出售的房屋。",
    advertisement:"广告",
    loading:"正在加载房屋...",
    noProperties:"目前没有可出售的房屋。",
    error:"加载房屋时出现问题。",
    view:"查看详情",
    house:"出售房屋",
    rwanda:"卢旺达",
    noPhoto:"暂无照片",
    designedBy:"由 Irene 设计"
  }

};


/* =====================================================
   GET LANGUAGE
===================================================== */

const savedLanguage =
  localStorage.getItem("selectedLanguage") || "English";


/*
   Niba language.js isanzwe ibika izina ritandukanye,
   iyi code irifata gusa niba riri muri languages 5.
*/

const language =
  Object.prototype.hasOwnProperty.call(
    translations,
    savedLanguage
  )
  ? savedLanguage
  : "English";


const t = translations[language];


/* =====================================================
   HTML LANGUAGE
===================================================== */

const htmlLanguages = {
  Kinyarwanda:"rw",
  English:"en",
  Français:"fr",
  Kiswahili:"sw",
  "中文":"zh"
};

document.documentElement.lang =
  htmlLanguages[language];


/* =====================================================
   APPLY LANGUAGE
===================================================== */

document.getElementById("headerTitle").textContent =
  t.header;

document.getElementById("backButton").textContent =
  t.back;

document.getElementById("pageTitle").textContent =
  t.title;

document.getElementById("pageDescription").textContent =
  t.description;

document.getElementById("adLabel").textContent =
  t.advertisement;

document.getElementById("loadingMessage").textContent =
  t.loading;

document.getElementById("designedBy").textContent =
  t.designedBy;

document.title =
  t.title.replace("🏠 ","") +
  " - Rwanda Property Visata";


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENT
===================================================== */

const propertiesElement =
  document.getElementById("properties");


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   IMAGE
===================================================== */

function getPropertyImage(property){

  let image =
    property.main_photo || "";


  if(!image){

    if(Array.isArray(property.other_photos)){

      image =
        property.other_photos.find(
          photo =>
            typeof photo === "string" &&
            photo.trim() !== ""
        ) || "";

    }

  }


  if(!image && typeof property.other_photos === "string"){

    try{

      const parsed =
        JSON.parse(property.other_photos);

      if(Array.isArray(parsed)){

        image =
          parsed.find(
            photo =>
              typeof photo === "string" &&
              photo.trim() !== ""
          ) || "";

      }

    }
    catch(error){

      console.warn(
        "Could not parse other_photos:",
        error
      );

    }

  }


  return image ||
    "https://via.placeholder.com/800x500?text=" +
    encodeURIComponent(t.noPhoto);

}


/* =====================================================
   LOCATION
===================================================== */

function getLocation(property){

  const parts = [

    property.country,
    property.province,
    property.district,
    property.sector

  ].filter(
    value =>
      value !== null &&
      value !== undefined &&
      String(value).trim() !== ""
  );


  return parts.length
    ? parts.join(", ")
    : t.rwanda;

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price){

  if(
    price === null ||
    price === undefined ||
    price === ""
  ){

    return "0";

  }


  const number =
    Number(price);


  if(Number.isNaN(number)){

    return "0";

  }


  return number.toLocaleString("en-US");

}


/* =====================================================
   DETAIL URL
===================================================== */

function createDetailUrl(id){

  /*
    ID niyo twohereza kuri detail page.
    encodeURIComponent ikumira ko URL yangirika.
  */

  return (
    "house-sale-detail.html?id=" +
    encodeURIComponent(String(id))
  );

}


/* =====================================================
   LOAD SALE PROPERTIES
===================================================== */

async function loadSaleProperties(){

  propertiesElement.innerHTML = `
    <div class="empty loading">
      ${escapeHtml(t.loading)}
    </div>
  `;


  try{

    const result =
      await supabaseClient
        .from("property_posts")
        .select("*")
        .eq("property_type","sale")
        .eq("status","published")
        .order("created_at",{ascending:false});


    const data =
      result.data;

    const error =
      result.error;


    if(error){

      console.error(
        "SUPABASE ERROR:",
        error
      );

      propertiesElement.innerHTML = `
        <div class="empty error">
          ❌<br><br>
          ${escapeHtml(t.error)}
          <br><br>
          <small>
            ${escapeHtml(error.message || "")}
          </small>
        </div>
      `;

      return;

    }


    if(!data || data.length === 0){

      propertiesElement.innerHTML = `
        <div class="empty">
          🏠<br><br>
          ${escapeHtml(t.noProperties)}
        </div>
      `;

      return;

    }


    propertiesElement.innerHTML = "";


    data.forEach(property => {

      /*
        IMPORTANT:
        Niba record id idafite agaciro,
        ntidushyiraho link yangiritse.
      */

      if(
        property.id === null ||
        property.id === undefined ||
        String(property.id).trim() === ""
      ){

        console.warn(
          "Property skipped because it has no ID:",
          property
        );

        return;

      }


      const card =
        document.createElement("div");

      card.className =
        "property";


      const image =
        getPropertyImage(property);


      const propertyTitle =
        property.title ||
        t.house;


      const formattedPrice =
        formatPrice(property.price);


      const location =
        getLocation(property);


      const detailUrl =
        createDetailUrl(property.id);


      card.innerHTML = `

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(propertyTitle)}"
          loading="lazy"
        >

        <div class="property-body">

          <div class="property-title">
            ${escapeHtml(propertyTitle)}
          </div>

          <div class="price">
            ${escapeHtml(formattedPrice)} RWF
          </div>

          <div class="location">
            📍 ${escapeHtml(location)}
          </div>

          <a
            class="details"
            href="${escapeHtml(detailUrl)}"
          >
            ${escapeHtml(t.view)}
          </a>

        </div>

      `;


      const imageElement =
        card.querySelector("img");


      imageElement.addEventListener(
        "error",
        function(){

          this.onerror = null;

          this.src =
            "https://via.placeholder.com/800x500?text=" +
            encodeURIComponent(t.noPhoto);

        }
      );


      propertiesElement.appendChild(card);

    });


    /*
      Niba records zose zari zidafite ID,
      ntitugasige loading message.
    */

    if(
      propertiesElement.children.length === 0
    ){

      propertiesElement.innerHTML = `
        <div class="empty error">
          ❌<br><br>
          ${escapeHtml(t.error)}
        </div>
      `;

    }

  }
  catch(error){

    console.error(
      "Unexpected error:",
      error
    );


    propertiesElement.innerHTML = `
      <div class="empty error">
        ❌<br><br>
        ${escapeHtml(t.error)}
        <br><br>
        <small>
          ${escapeHtml(error.message || "")}
        </small>
      </div>
    `;

  }

}


/* =====================================================
   VISITOR TRACKING
===================================================== */

async function trackPageView(){

  try{

    let visitorId =
      localStorage.getItem("rpv_visitor_id");


    if(!visitorId){

      visitorId =
        window.crypto &&
        typeof window.crypto.randomUUID === "function"

        ? window.crypto.randomUUID()

        : "visitor_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2);


      localStorage.setItem(
        "rpv_visitor_id",
        visitorId
      );

    }


    let sessionId =
      sessionStorage.getItem("rpv_session_id");


    if(!sessionId){

      sessionId =
        window.crypto &&
        typeof window.crypto.randomUUID === "function"

        ? window.crypto.randomUUID()

        : "session_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2);


      sessionStorage.setItem(
        "rpv_session_id",
        sessionId
      );

    }


    const {error} =
      await supabaseClient
        .from("page_views")
        .insert({

          page:
            document.title ||
            location.pathname,

          path:
            location.pathname,

          visitor_id:
            visitorId,

          session_id:
            sessionId,

          referrer:
            document.referrer || null,

          user_agent:
            navigator.userAgent,

          device_type:
            getDeviceType(),

          country:null,

          city:null

        });


    if(error){

      console.warn(
        "Visitor tracking error:",
        error
      );

    }

  }
  catch(error){

    console.warn(
      "Tracking failed:",
      error
    );

  }

}


function getDeviceType(){

  if(window.innerWidth <= 600)
    return "mobile";

  if(window.innerWidth <= 1024)
    return "tablet";

  return "desktop";

}


/* =====================================================
   START PAGE
===================================================== */

loadSaleProperties();

trackPageView();


/* =====================================================
   ADSENSE
===================================================== */

window.addEventListener(
  "load",
  function(){

    try{

      (
        window.adsbygoogle =
        window.adsbygoogle ||
        []
      ).push({});

    }
    catch(error){

      console.warn(
        "AdSense error:",
        error
      );

    }

  }
);

</script>
