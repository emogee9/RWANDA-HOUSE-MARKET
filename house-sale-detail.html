/* =========================================================

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   FORMAT PRICE
========================================================= */

function formatPrice(price){

  const number =
    Number(price || 0);

  return number.toLocaleString(
    "en-US"
  );

}


/* =========================================================
   GET ALL PHOTOS
========================================================= */

function getPropertyImages(property){

  const result = [];


  /* MAIN PHOTO */

  if(
    property.main_photo &&
    typeof property.main_photo ===
      "string" &&
    property.main_photo.trim() !== ""
  ){

    result.push(
      property.main_photo.trim()
    );

  }


  /* OTHER PHOTOS AS ARRAY */

  if(
    Array.isArray(
      property.other_photos
    )
  ){

    property.other_photos.forEach(
      photo => {

        if(
          typeof photo ===
            "string" &&
          photo.trim() !== "" &&
          !result.includes(
            photo.trim()
          )
        ){

          result.push(
            photo.trim()
          );

        }

      }
    );

  }


  /* OTHER PHOTOS AS JSON STRING */

  else if(
    typeof property.other_photos ===
      "string" &&
    property.other_photos.trim() !== ""
  ){

    try{

      const parsed =
        JSON.parse(
          property.other_photos
        );


      if(
        Array.isArray(parsed)
      ){

        parsed.forEach(
          photo => {

            if(
              typeof photo ===
                "string" &&
              photo.trim() !== "" &&
              !result.includes(
                photo.trim()
              )
            ){

              result.push(
                photo.trim()
              );

            }

          }
        );

      }

    }
    catch(error){

      console.warn(
        "Could not parse other_photos:",
        error
      );

    }

  }


  /* FALLBACK */

  if(
    result.length === 0
  ){

    result.push(
      "https://via.placeholder.com/1000x650?text=" +
      encodeURIComponent(
        t.noPhoto
      )
    );

  }


  return result;

}


/* =========================================================
   GET LOCATION
========================================================= */

function getLocation(property){

  const parts = [

    property.country,

    property.province,

    property.district,

    property.sector

  ].filter(
    value =>
      value !== null &&
      value !== undefined &&
      String(value).trim() !== ""
  );


  return parts.length
    ? parts.join(", ")
    : "Rwanda";

}


/* =========================================================
   SHOW IMAGE
========================================================= */

function showImage(index){

  if(
    !images.length
  ){

    return;

  }


  currentImage =
    (index + images.length) %
    images.length;


  document.getElementById(
    "mainImage"
  ).src =
    images[currentImage];


  document.getElementById(
    "photoCounter"
  ).textContent =
    `${currentImage + 1} / ${images.length}`;


  document
    .querySelectorAll(".thumbnail")
    .forEach(
      (thumbnail,index) => {

        thumbnail.classList.toggle(
          "active",
          index === currentImage
        );

      }
    );

}


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function nextImage(){

  showImage(
    currentImage + 1
  );

}


function previousImage(){

  showImage(
    currentImage - 1
  );

}


/* =========================================================
   RENDER THUMBNAILS
========================================================= */

function renderThumbnails(){

  const container =
    document.getElementById(
      "thumbnails"
    );


  container.innerHTML =
    "";


  images.forEach(
    (image,index) => {

      const thumbnail =
        document.createElement(
          "img"
        );


      thumbnail.className =
        "thumbnail";


      thumbnail.src =
        image;


      thumbnail.alt =
        "Property photo";


      thumbnail.onclick =
        () =>
          showImage(index);


      container.appendChild(
        thumbnail
      );

    }
  );


  showImage(0);

}


/* =========================================================
   RENDER PROPERTY
========================================================= */

function renderProperty(){

  document.getElementById(
    "propertyTitle"
  ).textContent =
    property.title ||
    t.house;


  document.getElementById(
    "propertyPrice"
  ).textContent =
    formatPrice(
      property.price
    ) +
    " RWF";


  document.getElementById(
    "propertyLocation"
  ).textContent =
    "📍 " +
    getLocation(property);


  document.getElementById(
    "bedrooms"
  ).textContent =
    property.bedrooms ??
    0;


  document.getElementById(
    "bathrooms"
  ).textContent =
    property.bathrooms ??
    0;


  document.getElementById(
    "parking"
  ).textContent =
    property.parking ??
    0;


  document.getElementById(
    "propertyType"
  ).textContent =
    property.property_type ===
      "sale"
      ? t.sale
      : (
          property.property_type ||
          t.sale
        );


  document.getElementById(
    "description"
  ).textContent =
    property.description ||
    "-";


  document.getElementById(
    "fullLocation"
  ).textContent =
    getLocation(property);


  const seller =
    property.seller_name ||
    "-";


  const phone =
    property.phone ||
    "-";


  document.getElementById(
    "sellerName"
  ).textContent =
    t.name +
    ": " +
    seller;


  document.getElementById(
    "sellerPhone"
  ).textContent =
    t.phone +
    ": " +
    phone;


  const callButton =
    document.getElementById(
      "callButton"
    );


  if(
    property.phone &&
    String(
      property.phone
    ).trim() !== ""
  ){

    callButton.href =
      "tel:" +
      String(
        property.phone
      ).replace(
        /\s/g,
        ""
      );

    callButton.textContent =
      t.call;

    callButton.style.display =
      "inline-block";

  }
  else{

    callButton.style.display =
      "none";

  }


  document.getElementById(
    "propertyBadge"
  ).textContent =
    t.house;


  images =
    getPropertyImages(
      property
    );


  renderThumbnails();


  document.title =
    (
      property.title ||
      t.house.replace(
        "🏠 ",
        ""
      )
    ) +
    " - Rwanda Property Visata";


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "detailCard"
  ).style.display =
    "block";

}


/* =========================================================
   GET PROPERTY ID
========================================================= */

function getPropertyId(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return params.get(
    "id"
  );

}


/* =========================================================
   LOAD ONE PROPERTY ONLY
========================================================= */

async function loadProperty(){

  const id =
    getPropertyId();


  if(!id){

    showError(
      t.notFound
    );

    return;

  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient

      .from(
        "property_posts"
      )

      .select("*")

      .eq(
        "id",
        id
      )

      .eq(
        "property_type",
        "sale"
      )

      .eq(
        "status",
        "published"
      )

      .maybeSingle();


    if(error){

      console.error(
        error
      );

      showError(
        t.error +
        "\n\n" +
        error.message
      );

      return;

    }


    if(!data){

      showError(
        t.notFound
      );

      return;

    }


    property =
      data;


    renderProperty();

  }
  catch(error){

    console.error(
      error
    );

    showError(
      t.error
    );

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  const box =
    document.getElementById(
      "errorBox"
    );


  box.innerHTML =
    escapeHtml(
      message
    ).replace(
      /\n/g,
      "<br>"
    );


  box.style.display =
    "block";

}


/* =========================================================
   IMAGE MODAL
========================================================= */

function openImageModal(){

  if(!images.length){

    return;

  }


  document.getElementById(
    "modalImage"
  ).src =
    images[currentImage];


  document.getElementById(
    "imageModal"
  ).classList.add(
    "active"
  );

}


function closeImageModal(event){

  if(
    event &&
    event.target &&
    !event.target.classList.contains(
      "image-modal"
    )
  ){

    return;

  }


  document.getElementById(
    "imageModal"
  ).classList.remove(
    "active"
  );

}


function modalPrevious(event){

  if(event){

    event.stopPropagation();

  }


  previousImage();


  document.getElementById(
    "modalImage"
  ).src =
    images[currentImage];

}


function modalNext(event){

  if(event){

    event.stopPropagation();

  }


  nextImage();


  document.getElementById(
    "modalImage"
  ).src =
    images[currentImage];

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "ArrowRight"){

      nextImage();

      if(
        document
          .getElementById(
            "imageModal"
          )
          .classList.contains(
            "active"
          )
      ){

        document.getElementById(
          "modalImage"
        ).src =
          images[currentImage];

      }

    }


    if(event.key === "ArrowLeft"){

      previousImage();

      if(
        document
          .getElementById(
            "imageModal"
          )
          .classList.contains(
            "active"
          )
      ){

        document.getElementById(
          "modalImage"
        ).src =
          images[currentImage];

      }

    }


    if(event.key === "Escape"){

      document.getElementById(
        "imageModal"
      ).classList.remove(
        "active"
      );

    }

  }
);


/* =========================================================
   START
========================================================= */

loadProperty();

</script>
