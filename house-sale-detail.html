async function trackPageView(){

  try{

    let visitorId =
      localStorage.getItem("rpv_visitor_id");

    if(!visitorId){

      visitorId =
        crypto.randomUUID();

      localStorage.setItem(
        "rpv_visitor_id",
        visitorId
      );

    }


    let sessionId =
      sessionStorage.getItem("rpv_session_id");

    if(!sessionId){

      sessionId =
        crypto.randomUUID();

      sessionStorage.setItem(
        "rpv_session_id",
        sessionId
      );

    }


    const {
      error
    } = await supabaseClient

      .from("page_views")

      .insert({

        page:
          document.title || location.pathname,

        path:
          location.pathname,

        visitor_id:
          visitorId,

        session_id:
          sessionId,

        referrer:
          document.referrer || null,

        user_agent:
          navigator.userAgent,

        device_type:
          getDeviceType(),

        country:
          null,

        city:
          null

      });


    if(error){

      console.error(
        "Visitor tracking error:",
        error
      );

    }

  }
  catch(error){

    console.error(
      "Tracking failed:",
      error
    );

  }

}


function getDeviceType(){

  if(window.innerWidth <= 600){

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(phone){

  if(!phone){

    return "";

  }


  let value =
    String(phone)
    .trim()
    .replace(/\s+/g,"");


  if(
    value.startsWith("0") &&
    value.length >= 9
  ){

    value =
      "250" +
      value.substring(1);

  }


  if(
    value.startsWith("+250")
  ){

    value =
      value.substring(1);

  }


  return value
    .replace(/[^\d]/g,"");

}

async function loadProperty(){

    `;

    return;

  }


  const {
    data,
    error
  } =

  await supabaseClient

    .from("property_posts")

    .select("*")

    .eq(
      "id",
      propertyId
    )

    .eq(
      "property_type",
      "sale"
    )

    .maybeSingle();


  if(error){

    console.error(
      "Supabase error:",
      error
    );


    content.innerHTML = `

      <div class="error">

        ❌ ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  if(!data){

    content.innerHTML = `

      <div class="error">

        ${escapeHtml(t.notFound)}

      </div>

    `;

    return;

  }


  renderProperty(data);

}

function renderProperty(property){

  document.title =
    (
      property.title ||
      t.houseSale
    ) +
    " - Rwanda Property Visata";


  const mainPhoto =
    property.main_photo ||
    "https://via.placeholder.com/1000x600?text=No+Photo";


  /* ===================================================
     PHOTOS
  =================================================== */

  let photos = [];


  if(property.main_photo){

    photos.push(
      property.main_photo
    );

  }


  if(
    Array.isArray(
      property.other_photos
    )
  ){

    photos =
      photos.concat(
        property.other_photos
      );

  }


  if(
    typeof property.other_photos ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          property.other_photos
        );


      if(
        Array.isArray(parsed)
      ){

        photos =
          photos.concat(parsed);

      }

    }
    catch(error){

      console.log(
        "Other photos JSON parsing skipped."
      );

    }

  }


  const uniquePhotos =
    [
      ...new Set(
        photos
      )
    ]
    .filter(Boolean);


  /* ===================================================
     GALLERY
  =================================================== */

  let galleryHTML = "";


  uniquePhotos.forEach(
    photo => {

      galleryHTML += `

        <img

          src="${escapeHtml(photo)}"

          onclick="changeMainPhoto(this.src)"
