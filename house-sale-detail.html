/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =====================================================
   GET PROPERTY ID
===================================================== */

function getPropertyId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =====================================================
   IMAGE
===================================================== */

function getMainImage(property){

  let image =
    property.main_photo || "";


  if(!image){

    if(
      Array.isArray(
        property.other_photos
      )
    ){

      image =
        property.other_photos.find(
          photo =>
            typeof photo === "string" &&
            photo.trim() !== ""
        ) || "";

    }

  }


  if(
    !image &&
    typeof property.other_photos === "string"
  ){

    try{

      const parsed =
        JSON.parse(
          property.other_photos
        );


      if(Array.isArray(parsed)){

        image =
          parsed.find(
            photo =>
              typeof photo === "string" &&
              photo.trim() !== ""
          ) || "";

      }

    }

    catch(error){

      console.warn(
        "Could not parse other_photos:",
        error
      );

    }

  }


  return image;

}


/* =====================================================
   GET ALL PHOTOS
===================================================== */

function getAllPhotos(property){

  const photos = [];


  if(
    property.main_photo &&
    typeof property.main_photo === "string"
  ){

    photos.push(
      property.main_photo
    );

  }


  if(
    Array.isArray(
      property.other_photos
    )
  ){

    property.other_photos.forEach(
      photo => {

        if(
          typeof photo === "string" &&
          photo.trim() !== ""
        ){

          photos.push(photo);

        }

      }
    );

  }


  if(
    typeof property.other_photos === "string"
  ){

    try{

      const parsed =
        JSON.parse(
          property.other_photos
        );


      if(Array.isArray(parsed)){

        parsed.forEach(
          photo => {

            if(
              typeof photo === "string" &&
              photo.trim() !== ""
            ){

              photos.push(photo);

            }

          }
        );

      }

    }

    catch(error){

      console.warn(
        "Photo parsing error:",
        error
      );

    }

  }


  return [
    ...new Set(photos)
  ];

}


/* =====================================================
   LOCATION
===================================================== */

function getLocation(property){

  const parts = [

    property.country,

    property.province,

    property.district,

    property.sector

  ].filter(

    value =>
      value !== null &&
      value !== undefined &&
      String(value).trim() !== ""

  );


  return parts.length
    ? parts.join(", ")
    : t.rwanda;

}


/* =====================================================
   PRICE
===================================================== */

function formatPrice(price){

  if(
    price === null ||
    price === undefined ||
    price === ""
  ){

    return "0";

  }


  const number =
    Number(price);


  if(Number.isNaN(number)){

    return "0";

  }


  return number.toLocaleString(
    "en-US"
  );

}


/* =====================================================
   FIELD HELPER
===================================================== */

function getField(property, names){

  for(
    const name of names
  ){

    if(
      property[name] !== null &&
      property[name] !== undefined &&
      String(property[name]).trim() !== ""
    ){

      return property[name];

    }

  }


  return 0;

}

async function loadPropertyDetail(){

  const propertyId =
    getPropertyId();


  /* ================= NO ID ================= */

  if(
    !propertyId ||
    String(propertyId).trim() === ""
  ){

    detailContainer.innerHTML = `

      <div class="status error">

        ❌<br><br>

        ${escapeHtml(
          t.invalidId
        )}

      </div>

    `;

    return;

  }


  /* ================= LOADING ================= */

  detailContainer.innerHTML = `

    <div class="status loading">

      ${escapeHtml(
        t.loading
      )}

    </div>

  `;


  try{

    /*
      IMPORTANT:
      Dukoresha ID nyayo iri muri URL.
    */

    const {
      data: property,
      error
    } =

      await supabaseClient

        .from("property_posts")

        .select("*")

        .eq(
          "id",
          propertyId
        )

        .eq(
          "property_type",
          "sale"
        )

        .eq(
          "status",
          "published"
        )

        .maybeSingle();


    /* ================= ERROR ================= */

    if(error){

      console.error(
        "DETAIL SUPABASE ERROR:",
        error
      );


      detailContainer.innerHTML = `

        <div class="status error">

          ❌<br><br>

          ${escapeHtml(
            t.error
          )}

          <br><br>

          <small>

            ${escapeHtml(
              error.message || ""
            )}

          </small>

        </div>

      `;

      return;

    }


    /* ================= NOT FOUND ================= */

    if(!property){

      detailContainer.innerHTML = `

        <div class="status error">

          🏠<br><br>

          ${escapeHtml(
            t.notFound
          )}

        </div>

      `;

      return;

    }


    /* ================= DATA ================= */

    const title =
      property.title ||
      t.house;


    const price =
      formatPrice(
        property.price
      );


    const location =
      getLocation(
        property
      );


    const mainImage =
      getMainImage(
        property
      ) ||

      "https://via.placeholder.com/1100x600?text=" +
      encodeURIComponent(
        t.noPhoto
      );


    const allPhotos =
      getAllPhotos(
        property
      );


    const bedrooms =
      getField(
        property,
        [
          "bedrooms",
          "bedroom"
        ]
      );


    const bathrooms =
      getField(
        property,
        [
          "bathrooms",
          "bathroom"
        ]
      );


    const parking =
      getField(
        property,
        [
          "parking",
          "parking_spaces"
        ]
      );


    const description =
      property.description ||
      "";


    const phone =
      property.phone ||
      property.phone_number ||
      property.contact_phone ||
      "";


    /* ================= PAGE TITLE ================= */

    document.title =
      title +
      " - Rwanda Property Visata";


    /* ================= PHOTOS HTML ================= */

    let photosHtml = "";


    if(allPhotos.length > 0){

      photosHtml = `

        <div class="section">

          <h2>
            📷 ${escapeHtml(
              t.viewPhotos
            )}
          </h2>

          <div class="photos">

            ${allPhotos.map(
              photo => `

                <img
                  src="${escapeHtml(photo)}"
                  alt="${escapeHtml(title)}"
                  loading="lazy"
                  onerror="
                    this.style.display='none';
                  "
                >

              `
            ).join("")}

          </div>

        </div>

      `;

    }


    /* ================= CONTACT HTML ================= */

    let contactHtml = "";


    if(phone){

      const cleanPhone =
        String(phone)
          .replace(/[^\d+]/g,"");


      contactHtml = `

        <div class="contact-box">

          <h2>
            📞 ${escapeHtml(
              t.contact
            )}
          </h2>

          <p>
            ${escapeHtml(
              t.phone
            )}:
            <strong>
              ${escapeHtml(phone)}
            </strong>
          </p>

          <a
            class="contact-button"
            href="tel:${escapeHtml(cleanPhone)}"
          >

            📞
            ${escapeHtml(
              t.phone
            )}

          </a>

        </div>

      `;

    }


    /* ================= DETAIL PAGE ================= */

    detailContainer.innerHTML = `

      <article class="detail-card">

        <img
          class="main-image"
          src="${escapeHtml(mainImage)}"
          alt="${escapeHtml(title)}"
          onerror="
            this.onerror=null;
            this.src='https://via.placeholder.com/1100x600?text=${encodeURIComponent(
              t.noPhoto
            )}';
          "
        >


        <div class="detail-body">

          <div class="title">

            ${escapeHtml(title)}

          </div>


          <div class="price">

            ${escapeHtml(price)}
            RWF

          </div>


          <div class="location">

            📍
            <strong>
              ${escapeHtml(t.location)}:
            </strong>

            ${escapeHtml(location)}

          </div>


          <div class="info-grid">

            <div class="info-box">

              <div class="icon">
                🛏️
              </div>

              <div class="label">
                ${escapeHtml(t.bedrooms)}
              </div>

              <div class="value">
                ${escapeHtml(bedrooms)}
              </div>

            </div>


            <div class="info-box">

              <div class="icon">
                🚿
              </div>

              <div class="label">
                ${escapeHtml(t.bathrooms)}
              </div>

              <div class="value">
                ${escapeHtml(bathrooms)}
              </div>

            </div>


            <div class="info-box">

              <div class="icon">

              </div>

              <div class="label">

              </div>

          </div>


          ${

              <div class="section">

                <h2>
                  📝 ${escapeHtml(
                    t.description
                  )}
                </h2>

                <div class="description">

                  ${escapeHtml(

/* =====================================================
   VISITOR TRACKING
===================================================== */

async function trackPageView(){

  try{

    let visitorId =
      localStorage.getItem(
        "rpv_visitor_id"
      );


    if(!visitorId){

      visitorId =
        window.crypto &&
        typeof window.crypto.randomUUID ===
        "function"

        ? window.crypto.randomUUID()

        :

        "visitor_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      localStorage.setItem(
        "rpv_visitor_id",
        visitorId
      );

    }


    let sessionId =
      sessionStorage.getItem(
        "rpv_session_id"
      );


    if(!sessionId){

      sessionId =
        window.crypto &&
        typeof window.crypto.randomUUID ===
        "function"

        ? window.crypto.randomUUID()

        :

        "session_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      sessionStorage.setItem(
        "rpv_session_id",
        sessionId
      );

    }


    await supabaseClient

      .from("page_views")

      .insert({

        page:
          document.title ||
          location.pathname,

        path:
          location.pathname,

        visitor_id:
          visitorId,

        session_id:
          sessionId,

        referrer:
          document.referrer ||
          null,

        user_agent:
          navigator.userAgent,

        device_type:
          getDeviceType(),

        country:null,
