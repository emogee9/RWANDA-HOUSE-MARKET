<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sell Your Property - Rwanda House Market</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #f2b705;
      color: #222;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: #222;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    .title-box {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      border-top: 5px solid #f2b705;
    }

    .title-box h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .form-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      border-top: 5px solid #f2b705;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #f2b705;
      color: #222;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-button:hover {
      background: #dca500;
    }

    .note {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 15px 40px;
      }

      .form-box {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>
      🏠 RWANDA HOUSE MARKET
    </h1>

    <a href="./home.html" class="back">
      ← Back to Home
    </a>

  </header>


  <div class="container">

    <div class="title-box">

      <h2>🏠 Sell Your Property</h2>

      <p>
        List your property and connect with interested buyers.
      </p>

    </div>


    <div class="form-box">

      <form id="propertyForm">

        <label for="propertyType">
          1. Property Type
        </label>

        <select id="propertyType" required>

          <option value="">
            Select Property Type
          </option>

          <option value="House">
            House
          </option>

          <option value="Plot">
            Plot
          </option>

        </select>


        <label for="propertyTitle">
          2. Property Title
        </label>

        <input
          type="text"
          id="propertyTitle"
          placeholder="Example: Modern Family House"
          required
        >


        <label for="location">
          3. Location
        </label>

        <input
          type="text"
          id="location"
          placeholder="Example: Kigali, Kicukiro"
          required
        >


        <label for="price">
          4. Price
        </label>

        <input
          type="number"
          id="price"
          placeholder="Enter price in RWF"
          required
        >


        <label for="phone">
          5. Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="+250 7XX XXX XXX"
          required
        >


        <label for="description">
          6. Property Description
        </label>

        <textarea
          id="description"
          placeholder="Describe your property..."
          required
        ></textarea>


        <label for="images">
          7. Property Images
        </label>

        <input
          type="file"
          id="images"
          accept="image/*"
          multiple
        >


        <label for="video">
          8. Property Video
        </label>

        <input
          type="file"
          id="video"
          accept="video/*"
        >


        <label for="mapLocation">
          9. Property Location / Google Maps Link
        </label>

        <input
          type="url"
          id="mapLocation"
          placeholder="Paste Google Maps link"
        >


        <button
          type="submit"
          class="submit-button"
        >
          Submit Property
        </button>

        <p class="note">
          Your property information will be reviewed before being published.
        </p>

      </form>

    </div>

  </div>


  <script>

    document
      .getElementById("propertyForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        alert(
          "Thank you! Your property has been submitted successfully."
        );

      });

  </script>

</body>

</html>
