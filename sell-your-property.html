<!DOCTYPE html>
<html lang="en">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f5ef;
  color:#33251d;
}

header{
  background:#d4a017;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:28px;
}

.back{
  display:inline-block;
  margin-top:12px;
  background:white;
  color:#a87800;
  padding:9px 15px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 18px 60px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:16px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:2px solid #eee;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#d4a017;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.photo-preview{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:10px;
}

.photo-preview img{
  width:110px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
}

.fee-box{
  margin-top:25px;
  background:#fff8d6;
  border:2px solid #d4a017;
  border-radius:12px;
  padding:20px;
}

.fee-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin:9px 0;
}

.total{
  border-top:2px solid #d4a017;
  padding-top:12px;
  margin-top:12px;
  font-size:21px;
  font-weight:bold;
}

.post-button{
  width:100%;
  border:0;
  background:#d4a017;
  color:white;
  padding:15px;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:25px;
}

.post-button:hover{
  background:#a87800;
}

.message{
  display:none;
  padding:14px;
  margin-top:15px;
  border-radius:8px;
  font-weight:bold;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#a00000;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;

}

📍 Location

<div class="grid">

<div>

Country

<input
type="text"
id="country"
value="Rwanda"
required

</div>


<div>

<label id="provinceLabel">
Province
</label>

<input
type="text"
id="province"
required
>

</div>


<div>

<label id="districtLabel">
District

<input
type="text"
id="district"
required
>

</div>


<div>

<label id="sectorLabel">
Sector
</label>

<input
type="text"
id="sector"
required
>

</div>

</div>


<!-- HOUSE DETAILS -->

<div id="houseDetails">

<h3 id="detailsTitle">
🏠 Property Details
</h3>

<div class="grid">

<div>

<label id="bedroomsLabel">
Bedrooms
</label>

<input
type="number"
id="bedrooms"
min="0"
value="0"
>

</div>


<div>

<label id="bathroomsLabel">
Toilets / Bathrooms

<input
type="number"
id="bathrooms"
min="0"

<div>

Parking

type="number"
id="parking"

</div>

</div>


<!-- PHOTOS -->

<label id="photosLabel">
📷 Property Photos
</label>

<input
type="file"
id="photos"
accept="image/*"

required
>

<div
id="photoPreview"
class="photo-preview">
</div>


<!-- DESCRIPTION -->

<label id="descriptionLabel">
Property Details / Description
</label>

<textarea
id="description"
required
placeholder="Describe the property..."
></textarea>


<!-- PRICE -->

<label id="priceLabel">
Price
</label>

<input
type="number"
id="price"
min="1"
required
placeholder="Example: 50000000"
>


<!-- FEE -->

<div class="fee-box">

<h3 id="feeTitle">
💰 Posting Fee
</h3>

<div class="fee-row">

<span id="propertyPriceText">
Property Price
</span>

<strong id="displayPrice">
0 RWF
</strong>

</div>


<div class="fee-row">

<span id="feeRateText">
Posting Fee Rate
</span>

<strong id="feeRate">
0.01%
</strong>

</div>


<div class="fee-row total">

<span id="feeText">
Posting Fee
</span>

<strong id="postingFee">
0 RWF
</strong>

</div>

</div>


<button
type="submit"
class="post-button"
id="postButton">

Post Property

</button>


<div
id="message"
class="message">
</div>

</form>

</div>

</div>

/* =========================================
   FEE CALCULATION
========================================= */

const priceInput =
document.getElementById("price");

const displayPrice =
document.getElementById("displayPrice");

const feeRate =
document.getElementById("feeRate");

const postingFee =
document.getElementById("postingFee");


function calculateFee(){

const price =
Number(priceInput.value || 0);


/*
  Under or equal to 50M = 0.01%
  Above 50M = 0.02%
*/

let rate;

if(price <= 50000000){

rate = 0.0001;

}else{

rate = 0.0002;

}


const fee =
price * rate;


displayPrice.textContent =
price.toLocaleString() +
" RWF";


feeRate.textContent =
(rate * 100) +
"%";


postingFee.textContent =
Math.ceil(fee).toLocaleString() +
" RWF";


return Math.ceil(fee);

}


priceInput.addEventListener(
"input",
calculateFee
);

========================================= */

.addEventListener(
"change",

document.getElementById("photoPreview");

preview.innerHTML="";

Array.from(this.files)
.forEach(file=>{

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

preview.appendChild(img);

});

});

========================================= */

.getElementById("propertyType")
.addEventListener(

const message =

try{

button.textContent="Processing...";


const name =
document.getElementById("sellerName").value.trim();

const phone =
document.getElementById("sellerPhone").value.trim();

const propertyType =

const transactionType =

const country =
document.getElementById("country").value.trim();

const district =

const sector =

const bedrooms =
Number(document.getElementById("bedrooms").value || 0);

const bathrooms =

const parking =
Number(document.getElementById("parking").value || 0);

const description =
document.getElementById("description").value.trim();

const price =
Number(document.getElementById("price").value);

const photos =
document.getElementById("photos").files;


if(!name ||
!phone ||
!propertyType ||
!transactionType ||
!country ||
!province ||
!district ||
!sector ||
!price ||
photos.length===0){

throw new Error(t.required);

}


/* CALCULATE FEE */

const fee =
calculateFee();


/*
  Save information temporarily.
  The payment page will use this data.
*/

const propertyData = {

seller_name:name,

seller_phone:phone,

property_type:propertyType,

transaction_type:transactionType,

country:country,

province:province,

district:district,

sector:sector,

bedrooms:bedrooms,

bathrooms:bathrooms,

parking:parking,

description:description,

price:price,

posting_fee:fee,

};


localStorage.setItem(
"pendingProperty",
JSON.stringify(propertyData)
);


/*
  Save selected photos temporarily.
*/

const photoNames =
Array.from(photos)
.map(file=>file.name);

localStorage.setItem(
"pendingPropertyPhotoNames",
JSON.stringify(photoNames)
);


/*
  GO TO PAYMENT
*/

window.location.href =
"property-payment.html";


}
catch(error){
