<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="pageTitleBrowser">Houses for Rent - Rwanda Property Visata</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffdf5;
      color: #333333;
    }

    /* ================= HEADER ================= */

    header {
      background: #ffd21f;
      color: #222222;
      padding: 22px 15px;
      text-align: center;
      border-bottom: 3px solid #f0b900;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      background: white;
      color: #5c4700;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      padding: 10px 18px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .back:hover {
      background: #fff5b8;
    }

    /* ================= CONTAINER ================= */

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 35px 20px 70px;
    }

    /* ================= TITLE ================= */

    .title {
      background: white;
      text-align: center;
      padding: 28px 20px;
      margin-bottom: 30px;
      border-radius: 15px;
      border: 1px solid #f2df72;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .title h2 {
      color: #5c4700;
      font-size: 30px;
      margin: 0 0 10px;
    }

    .title p {
      color: #666666;
      margin: 0;
      font-size: 16px;
    }

    /* ================= PROPERTIES ================= */

    .properties {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 25px;
    }

    /* ================= EMPTY MESSAGE ================= */

    .empty-message {
      background: white;
      border: 2px dashed #f0c928;
      border-radius: 15px;
      padding: 50px 25px;
      text-align: center;
      color: #6b5a00;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .empty-message .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .empty-message h3 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .empty-message p {
      margin: 0;
      color: #777777;
      font-size: 16px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      header {
        padding: 20px 12px;
      }

      header h1 {
        font-size: 23px;
      }

      .container {
        padding: 20px 15px 60px;
      }

      .title {
        padding: 24px 15px;
      }

      .title h2 {
        font-size: 25px;
      }

      .empty-message {
        padding: 40px 20px;
      }

    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <h1 id="headerTitle">
      🏠 RWANDA PROPERTY VISATA
    </h1>

    <a
      href="customer-home.html"
      class="back"
      id="backButton">
      ← Back
    </a>

  </header>


  <!-- ================= MAIN ================= -->

  <div class="container">

    <div class="title">

      <h2 id="pageTitle">
        Houses for Rent
      </h2>

      <p id="pageDescription">
        Find houses available for rent in Rwanda.
      </p>

    </div>


    <!-- ================= PROPERTIES ================= -->

    <div
      class="properties"
      id="propertiesContainer">

      <!--
        NTA PROPERTY IRI HANO.

        Property zizajya zongerwa nyuma
        binyuze muri Admin New Post.
      -->

      <div class="empty-message">

        <div class="icon">
          🏠
        </div>

        <h3 id="emptyTitle">
          No houses available
        </h3>

        <p id="emptyText">
          There are currently no houses available for rent.
        </p>

      </div>

    </div>

  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    /* ================= LANGUAGE ================= */

    const language =
      localStorage.getItem("selectedLanguage") || "English";


    /* ================= TRANSLATIONS ================= */

    const translations = {

      Kinyarwanda: {

        browserTitle:
          "Amazu akodeshwa - Rwanda Property Visata",

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Subira kuri Home",

        title:
          "Amazu akodeshwa",

        description:
          "Shaka amazu ahari yo gukodesha mu Rwanda.",

        emptyTitle:
          "Nta nzu irahari",

        emptyText:
          "Kugeza ubu nta nzu ihari yo gukodesha."

      },


      English: {

        browserTitle:
          "Houses for Rent - Rwanda Property Visata",

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Back to Home",

        title:
          "Houses for Rent",

        description:
          "Find houses available for rent in Rwanda.",

        emptyTitle:
          "No houses available",

        emptyText:
          "There are currently no houses available for rent."

      },


      Français: {

        browserTitle:
          "Maisons à louer - Rwanda Property Visata",

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Retour à l'accueil",

        title:
          "Maisons à louer",

        description:
          "Trouvez des maisons disponibles à la location au Rwanda.",

        emptyTitle:
          "Aucune maison disponible",

        emptyText:
          "Il n'y a actuellement aucune maison disponible à la location."

      },


      Kiswahili: {

        browserTitle:
          "Nyumba za Kupangisha - Rwanda Property Visata",

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← Rudi kwenye Mwanzo",

        title:
          "Nyumba za Kupangisha",

        description:
          "Pata nyumba zinazopatikana kwa kupangisha nchini Rwanda.",

        emptyTitle:
          "Hakuna nyumba zinazopatikana",

        emptyText:
          "Kwa sasa hakuna nyumba zinazopatikana kwa kupangisha."

      },


      "中文": {

        browserTitle:
          "出租房屋 - Rwanda Property Visata",

        header:
          "🏠 RWANDA PROPERTY VISATA",

        back:
          "← 返回首页",

        title:
          "出租房屋",

        description:
          "寻找卢旺达可出租的房屋。",

        emptyTitle:
          "暂无房屋",

        emptyText:
          "目前没有可出租的房屋。"

      }

    };


    /* ================= SELECT LANGUAGE ================= */

    const t =
      translations[language] ||
      translations.English;


    localStorage.setItem(
      "selectedLanguage",
      language
    );


    /* ================= PAGE ================= */

    document.title =
      t.browserTitle;


    document.getElementById(
      "headerTitle"
    ).textContent =
      t.header;


    document.getElementById(
      "backButton"
    ).textContent =
      t.back;


    document.getElementById(
      "pageTitle"
    ).textContent =
      t.title;


    document.getElementById(
      "pageDescription"
    ).textContent =
      t.description;


    document.getElementById(
      "emptyTitle"
    ).textContent =
      t.emptyTitle;


    document.getElementById(
      "emptyText"
    ).textContent =
      t.emptyText;

  </script>

</body>
</html>
