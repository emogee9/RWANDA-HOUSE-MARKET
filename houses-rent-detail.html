async function trackPageView(){

  try{

    let visitorId =
      localStorage.getItem("rpv_visitor_id");

    if(!visitorId){

      visitorId =
        crypto.randomUUID();

      localStorage.setItem(
        "rpv_visitor_id",
        visitorId
      );

    }


    let sessionId =
      sessionStorage.getItem("rpv_session_id");

    if(!sessionId){

      sessionId =
        crypto.randomUUID();

      sessionStorage.setItem(
        "rpv_session_id",
        sessionId
      );

    }


    const {
      error
    } = await supabaseClient

      .from("page_views")

      .insert({

        page:
          document.title || location.pathname,

        path:
          location.pathname,

        visitor_id:
          visitorId,

        session_id:
          sessionId,

        referrer:
          document.referrer || null,

        user_agent:
          navigator.userAgent,

        device_type:
          getDeviceType(),

        country:
          null,

        city:
          null

      });


    if(error){

      console.error(
        "Visitor tracking error:",
        error
      );

    }

  }
  catch(error){

    console.error(
      "Tracking failed:",
      error
    );

  }

}


function getDeviceType(){

  if(window.innerWidth <= 600){

    return "mobile";

  if(window.innerWidth <= 1024){

/* =========================================
   GET PROPERTY ID
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const propertyId =
  params.get("id");


/* =========================================
   ELEMENTS
========================================= */

const mainPhoto =
  document.getElementById("mainPhoto");

const gallery =
  document.getElementById("gallery");

const info =
  document.getElementById("info");


/* =========================================
   PHOTOS
========================================= */

let photos = [];

let currentPhoto = 0;


function showPhoto(index){

  if(!photos.length){
    return;
  }

  currentPhoto =
    index;

  if(
    currentPhoto < 0
  ){
    currentPhoto =
      photos.length - 1;
  }

  if(
    currentPhoto >= photos.length
  ){
    currentPhoto = 0;
  }

  mainPhoto.src =
    photos[currentPhoto];

}


function nextPhoto(){

  showPhoto(
    currentPhoto + 1
  );

}


function previousPhoto(){

  showPhoto(
    currentPhoto - 1
  );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   LOAD PROPERTY
========================================= */

async function loadProperty(){

  if(!propertyId){

    info.innerHTML = `
      <div class="error">
        ❌ Property ID ntabwo yabonetse.
      </div>
    `;

    document.getElementById(
      "photoArea"
    ).style.display = "none";

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("property_posts")
    .select("*")
    .eq("id",propertyId)
    .eq("property_type","rent")
    .maybeSingle();


  if(error){

    console.error(error);

    info.innerHTML = `
      <div class="error">
        ❌ ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if(!data){

    info.innerHTML = `
      <div class="error">
        ❌ Iyi nzu ntiyabonetse cyangwa ntikiriho.
      </div>
    `;

    document.getElementById(
      "photoArea"
    ).style.display = "none";

    return;
  }


  /* =========================
     PHOTOS
  ========================= */

  photos = [];


  if(data.main_photo){

    photos.push(
      data.main_photo
    );

  }


  if(
    Array.isArray(
      data.other_photos
    )
  ){

    data.other_photos
      .forEach(photo => {

        if(
          photo &&
          !photos.includes(photo)
        ){

          photos.push(photo);

        }

      });

  }


  if(!photos.length){

    photos.push(
      "https://via.placeholder.com/1200x700?text=No+Photo"
    );

  }


  showPhoto(0);


  /* =========================
     GALLERY
  ========================= */

  gallery.innerHTML = "";


  photos.forEach(
    (photo,index) => {

      const img =
        document.createElement("img");

      img.src = photo;

      img.alt =
        data.title ||
        "House";

      img.onclick =
        function(){

          showPhoto(index);

        };

      gallery.appendChild(img);

    }
  );


  /* =========================
     INFO
  ========================= */

  info.innerHTML = `

    <h2>
      ${escapeHtml(
        data.title ||
        t.title
      )}
    </h2>


    <div class="type">
      ${escapeHtml(t.type)}
    </div>


    <div class="price">

      ${Number(
        data.price || 0
      ).toLocaleString()} RWF

    </div>


    <div class="location">

      🌍
      <strong>
        ${escapeHtml(t.country)}:
      </strong>
      ${escapeHtml(data.country || "")}

      <br>

      🗺️
      <strong>
        ${escapeHtml(t.province)}:
      </strong>
      ${escapeHtml(data.province || "")}

      <br>

      📍
      <strong>
        ${escapeHtml(t.district)}:
      </strong>
      ${escapeHtml(data.district || "")}

      <br>

      📌
      <strong>
        ${escapeHtml(t.sector)}:
      </strong>
      ${escapeHtml(data.sector || "")}

    </div>


    <h3>
      ${escapeHtml(t.propertyDetails)}
    </h3>


    <div class="details-list">

      🛏️
      ${escapeHtml(t.bedrooms)}:
      ${data.bedrooms ?? 0}

      <br>

      🚿
      ${escapeHtml(t.bathrooms)}:
      ${data.bathrooms ?? 0}

      <br>

      🚗
      ${escapeHtml(t.parking)}:
      ${data.parking ?? 0}

    </div>


    <h3>
      ${escapeHtml(t.description)}
    </h3>


    <p class="description">

      ${escapeHtml(
        data.description ||
        ""
      )}

    </p>


    <h3>
