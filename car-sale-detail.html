/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================

let carPhotos = [];

let currentPhotoIndex = 0;



/* =====================================================
   GET LOCATION
===================================================== */

function getLocation(car){

  const parts = [

    car.country,

    car.province,

    car.district,

    car.sector

  ].filter(

    value =>

      value !== null &&

      value !== undefined &&

      String(value).trim() !== ""

  );


  return parts.join(", ");

}



/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(phone){

  if(!phone){

    return "";

  }


  let value =
    String(phone)
      .trim()
      .replace(/\s+/g,"");


  if(
    value.startsWith("0") &&
    value.length >= 9
  ){

    value =
      "250" +
      value.substring(1);

  }


  if(
    value.startsWith("+250")
  ){

    value =
      value.substring(1);

  }


  return value.replace(
    /[^\d]/g,
    ""
  );

}



/* =====================================================
   GET ALL PHOTOS
===================================================== */

function getCarPhotos(car){

  let photos = [];


  /* MAIN PHOTO */

  const mainPhoto =
    car.main_photo ||
    car.mainPhoto ||
    car.image ||
    "";


  if(mainPhoto){

    photos.push(
      mainPhoto
    );

  }


  /* OTHER PHOTOS ARRAY */

  if(
    Array.isArray(
      car.other_photos
    )
  ){

    photos =
      photos.concat(
        car.other_photos
      );

  }


  /* OTHER PHOTOS JSON */

  else if(
    typeof car.other_photos ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          car.other_photos
        );


      if(
        Array.isArray(parsed)
      ){

        photos =
          photos.concat(
            parsed
          );

      }

    }
    catch(error){

      console.log(
        "Other photos parsing error:",
        error
      );

    }

  }


  /* OTHER POSSIBLE PHOTO COLUMN */

  if(
    Array.isArray(
      car.photos
    )
  ){

    photos =
      photos.concat(
        car.photos
      );

  }


  /* REMOVE EMPTY + DUPLICATES */

  photos =
    [
      ...new Set(
        photos
          .filter(Boolean)
          .map(
            photo =>
              String(photo).trim()
          )
          .filter(Boolean)
      )
    ];


  return photos;

}

/* =====================================================
   CHANGE PHOTO
===================================================== */

function changePhoto(index){

  if(
    !carPhotos.length
  ){

    return;

  }


  if(index < 0){

    index =
      carPhotos.length - 1;

  }


  if(
    index >= carPhotos.length
  ){

    index = 0;

  }


  currentPhotoIndex =
    index;


  const mainPhoto =
    document.getElementById(
      "mainPhoto"
    );


  if(mainPhoto){

    mainPhoto.src =
      carPhotos[
        currentPhotoIndex
      ];

  }


  const counter =
    document.getElementById(
      "photoCounter"
    );


  if(counter){

    counter.textContent =
      (
        currentPhotoIndex + 1
      ) +
      " / " +
      carPhotos.length;

  }


  document
    .querySelectorAll(
      ".gallery img"
    )
    .forEach(
      (img,index) => {

        img.classList.toggle(
          "active",
          index ===
          currentPhotoIndex
        );

      }
    );

}



/* =====================================================
   NEXT PHOTO
===================================================== */

  changePhoto(
    currentPhotoIndex + 1
  );

}



/* =====================================================

     CHECK ID
  =================================================== */

  if(!carId){

    content.innerHTML = `

      <div class="error">

        ${escapeHtml(
          t.idMissing

      </div>

    return;

  try{


    /* =================================================
       GET CAR FROM cars_post
    ================================================= */

    const {
      data,
      error
    } =

    await supabaseClient

      .from("cars_post")

      .select("*")

      .eq(
        "id",
        carId
      )

      .maybeSingle();



    /* =================================================
       SUPABASE ERROR
    ================================================= */

    if(error){

      console.error(
        "Supabase error:",
        error
      );


      content.innerHTML = `

        <div class="error">

          ❌ ${escapeHtml(
            error.message
          )}

        </div>

      `;

      return;

    }



    /* =================================================
       NOT FOUND
    ================================================= */

    if(!data){

      content.innerHTML = `

        <div class="error">

          ${escapeHtml(
            t.notFound
          )}

        </div>

      `;

      return;

    }



    renderCar(
      data
    );


  }
  catch(error){

    console.error(
      "Unexpected error:",
      error
    );


    content.innerHTML = `

      <div class="error">

        ❌ ${escapeHtml(
          error.message ||
          t.notFound
        )}

      </div>

    `;

  }

}



/* =====================================================

===================================================== */

function renderCar(car){

  =================================================== */

  const carTitle =

    car.title ||

    car.name ||

    car.car_name ||

    t.carSale;



  document.title =
    carTitle +
    " - Rwanda Property Visata";



  /* ===================================================

  =================================================== */

  carPhotos =
    getCarPhotos(
      car
    );


  currentPhotoIndex = 0;

          t.call

        ${escapeHtml(
          t.whatsapp
        )}

  /* ===================================================

  =================================================== */

  const location =

      car

  =================================================== */

    "0";

    Number(

    !Number.isNaN(

    formattedPrice =
      priceNumber.toLocaleString(

  /* ===================================================

        <!-- LEFT -->

        <button

          type="button"

          onclick="previousPhoto()"

          aria-label="${escapeHtml(

        >

        <!-- RIGHT -->

        <button

          class="photo-arrow next"

          )}"

        >

          ›

        </button>



        <!-- COUNTER -->

        <div
          id="photoCounter"
          class="photo-counter"
        >

          ${
            carPhotos.length > 0
              ? "1 / " + carPhotos.length

      </div>

      <div class="gallery">

    </div>



    <!-- ===============================================

    ================================================ -->

    <div id="adArea"></div>



    <!-- ===============================================

    ================================================ -->

    <div class="card">

      <h2 class="title">

      </h2>



      <div class="price">

        ${escapeHtml(

        RWF

      </div>



      <div class="info-grid">


        <!-- COUNTRY -->

        <div class="info">

          🌍

          <strong>

            ${escapeHtml(
              t.country
            )}

          </strong>

          <br>

          ${escapeHtml(
            car.country || ""
          )}

        </div>



        <!-- PROVINCE -->

        <div class="info">

          📍

          <strong>

            ${escapeHtml(
              t.province
            )}

          </strong>

          <br>

          ${escapeHtml(
            car.province || ""
          )}

        </div>



        <!-- DISTRICT -->

        <div class="info">

          📍

          <strong>

            ${escapeHtml(
              t.district
            )}

          </strong>

          <br>

          ${escapeHtml(
            car.district || ""
          )}

        </div>



        <!-- SECTOR -->

        <div class="info">

          📍

          <strong>

            ${escapeHtml(
              t.sector
            )}

          </strong>

          <br>

          ${escapeHtml(
            car.sector || ""
          )}

        </div>



        <!-- SELLER -->

        <div class="info">

          👤

          <strong>

            ${escapeHtml(
              t.seller

          <br>

          ${escapeHtml(

      </div>

      <h3>

          car.description ||

        )}

      <h3>

        ${escapeHtml(
          t.contact
        )}

        ${contactHTML}

    ================================================ -->

    <div class="social-box">


      <div class="social-title">

        ${escapeHtml(
          t.social
        )}

      </div>

        >

          ${escapeHtml(
            t.instagram
          )}

        </a>



        <a

          class="social-link youtube"

          href="https://youtube.com/@iranziirene-j5f?si=PtRA9dAwTog111BJ"

          rel="noopener noreferrer"

        >

          ${escapeHtml(
            t.youtube
          )}

        </a>


      </div>


    </div>


  `;



  /* ===================================================
     ADSENSE
  =================================================== */

  const adArea =
    document.getElementById(
      "adArea"
    );


  if(adArea){

    const advertisement =
      createAdvertisement();


    adArea.appendChild(
      advertisement
    );


    try{

      (
        window.adsbygoogle =
        window.adsbygoogle ||
        []
      ).push({});

    }
    catch(error){

      console.log(
        "AdSense:",
        error
      );

    }

  }

}
