/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(phone){

  if(!phone){

    return "";

  }

  let value =
    String(phone)
      .trim()
      .replace(/\s+/g,"");


  if(
    value.startsWith("0") &&
    value.length >= 9
  ){

    value =
      "250" +
      value.substring(1);

  }


  if(
    value.startsWith("+250")
  ){

    value =
      value.substring(1);

  }


  return value.replace(
    /[^\d]/g,
    ""
  );

}


/* =====================================================
   GET PHOTOS
===================================================== */

function getPhotos(car){

  let photos = [];


  /* MAIN PHOTO */

  if(car.main_photo){

    photos.push(
      car.main_photo
    );

  }


  /*
     OTHER PHOTOS AS ARRAY
  */

  if(
    Array.isArray(
      car.other_photos
    )
  ){

    photos =
      photos.concat(
        car.other_photos
      );

  }


  /*
     OTHER PHOTOS AS JSON
  */

  if(
    typeof car.other_photos ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(
          car.other_photos
        );


      if(
        Array.isArray(parsed)
      ){

        photos =
          photos.concat(parsed);

      }

    }
    catch(error){

      console.log(
        "Photo JSON parsing skipped."
      );

    }

  }


  /*
     POSSIBLE "photos" COLUMN
  */

  if(
    Array.isArray(car.photos)
  ){

    photos =
      photos.concat(
        car.photos
      );

  }


  if(
    typeof car.photos ===
    "string"
  ){

    try{

      const parsed =
        JSON.parse(car.photos);


      if(
        Array.isArray(parsed)
      ){

        photos =
          photos.concat(parsed);

      }

    }
    catch(error){}

  }


  /*
     REMOVE DUPLICATES
  */

  return [
    ...new Set(
      photos.filter(Boolean)
    )
  ];

}


/* =====================================================
   GLOBAL PHOTO INDEX
===================================================== */

let currentPhotoIndex = 0;

let currentPhotos = [];


/* =====================================================
   CHANGE MAIN PHOTO
===================================================== */

function showPhoto(index){

  if(
    !currentPhotos ||
    currentPhotos.length === 0
  ){

    return;

  }


  if(index < 0){

    index =
      currentPhotos.length - 1;

  }


  if(
    index >=
    currentPhotos.length
  ){

    index = 0;

  }


  currentPhotoIndex =
    index;


  const mainPhoto =
    document.getElementById(
      "mainPhoto"
    );


  if(mainPhoto){

    mainPhoto.src =
      currentPhotos[
        currentPhotoIndex
      ];

  }


  const counter =
    document.getElementById(
      "photoCounter"
    );


  if(counter){

    counter.textContent =
      `${t.photo} ${
        currentPhotoIndex + 1
      } ${t.of} ${
        currentPhotos.length
      }`;

  }


  document
    .querySelectorAll(
      ".gallery img"
    )
    .forEach(
      (img,index) => {

        img.classList.toggle(
          "active",
          index ===
          currentPhotoIndex
        );

      }
    );

}


/* =====================================================
   NEXT PHOTO
===================================================== */

function nextPhoto(){

  showPhoto(
    currentPhotoIndex + 1
  );

}


/* =====================================================
   PREVIOUS PHOTO
===================================================== */

function previousPhoto(){

  showPhoto(
    currentPhotoIndex - 1
  );

}

/* =====================================================
   LOAD CAR
===================================================== */

async function loadCar(){

  if(!carId){

    content.innerHTML = `

      <div class="error">

        ${escapeHtml(
          t.idMissing
        )}

      </div>

    `;

    return;

  }


  try{

    const {
      data,
      error
    } =

    await supabaseClient

      .from("cars_posts")

      .select("*")

      .eq(
        "id",
        carId
      )

      .maybeSingle();


    if(error){

      console.error(
        "Supabase error:",
        error
      );


      content.innerHTML = `

        <div class="error">

          ❌ ${escapeHtml(
            error.message
          )}

        </div>

      `;

      return;

    }


    if(!data){

      content.innerHTML = `

        <div class="error">

          ${escapeHtml(
            t.notFound
          )}

        </div>

      `;

      return;

    }


    renderCar(data);

  }
  catch(error){

    console.error(error);


    content.innerHTML = `

      <div class="error">

        ❌ ${escapeHtml(
          error.message ||
          t.notFound
        )}

      </div>

    `;

  }

}


/* =====================================================
   RENDER CAR
===================================================== */

function renderCar(car){

  /* ================= PHOTOS ================= */

  currentPhotos =
    getPhotos(car);


  if(
    currentPhotos.length === 0

    currentPhotos = [
      "https://via.placeholder.com/1000x600?text=No+Photo"

  currentPhotoIndex = 0;


  /* ================= TITLE ================= */

  const carTitle =
    car.title ||
    car.car_name ||
    car.name ||
    t.carSale;


  document.title =
    carTitle +
    " - Rwanda Property Visata";


  /* ================= PRICE ================= */

  const priceNumber =
    Number(
      car.price || 0
    );


  const formattedPrice =
    Number.isNaN(priceNumber)
      ? String(car.price || "0")
      : priceNumber.toLocaleString(
          "en-US"
        );


  /* ================= SELLER ================= */

  const sellerName =
    car.seller_name ||
    car.full_name ||
    car.owner_name ||
    "Rwanda Property Visata";


  const sellerPhone =
    car.phone ||
    car.phone_number ||
    car.seller_phone ||
    car.owner_phone ||
    "";


  const normalizedPhone =
    normalizePhone(
      sellerPhone
    );


  /* ================= CONTACT ================= */

  let contactHTML = "";


  if(sellerPhone){

    contactHTML += `

      <a

        href="tel:${escapeHtml(
          sellerPhone
        )}"

        class="button call"

      >

        ${escapeHtml(
          t.call
        )}

      </a>

    `;

  }


  if(normalizedPhone){

    contactHTML += `

      <a

        href="https://wa.me/${escapeHtml(
          normalizedPhone
        )}"

        target="_blank"

        rel="noopener noreferrer"

        class="button whatsapp"

      >

        ${escapeHtml(
          t.whatsapp
        )}

      </a>

    `;

  }


  /* ================= GALLERY ================= */

  let galleryHTML = "";


  currentPhotos.forEach(
    (photo,index) => {

      galleryHTML += `

        <img

          src="${escapeHtml(
            photo
          )}"

          alt="${escapeHtml(
            carTitle
          )}"

          loading="lazy"

          class="${
            index === 0
              ? "active"
              : ""
          }"

          onclick="
            showPhoto(${index})
          "

          onerror="
            this.style.display='none';
          "

        >

      `;

    }
  );


  /* ================= LOCATION ================= */

  const location =
    [
      car.country,
      car.province,
      car.district,
      car.sector,
      car.city
    ]
    .filter(
      value =>
        value !== null &&
        value !== undefined &&
        String(value).trim() !== ""
    )
    .join(", ");


  /* ================= HTML ================= */

  content.innerHTML = `

    <!-- ================= PHOTOS ================= -->

    <div class="card">

      <div class="photo-wrapper">

        <button

          type="button"

          class="photo-arrow photo-left"

          onclick="previousPhoto()"

          aria-label="Previous photo"

        >

          ‹

        </button>


        <img

          id="mainPhoto"

          class="main-photo"

          src="${escapeHtml(
            currentPhotos[0]
          )}"

          alt="${escapeHtml(
            carTitle
          )}"

          onerror="
            this.onerror=null;
            this.src='https://via.placeholder.com/1000x600?text=No+Photo';
          "

        >


        <button

          type="button"

          class="photo-arrow photo-right"

          onclick="nextPhoto()"

          aria-label="Next photo"

        >

          ›

        </button>


        <div

          class="photo-counter"

          id="photoCounter"

        >

          ${t.photo} 1 ${t.of} ${
            currentPhotos.length
          }

        </div>

      </div>


      <div class="gallery">

        ${galleryHTML}

      </div>

    </div>


    <!-- ================= AD ================= -->

    <div id="adArea"></div>


    <!-- ================= INFORMATION ================= -->

    <div class="card">

      <span class="type">

        ${escapeHtml(
          t.carSale
        )}

      </span>


      <h2 class="title">

        ${escapeHtml(
          carTitle
        )}

      </h2>


      <div class="price">

        ${escapeHtml(
          formattedPrice
        )}

        RWF

      </div>


      <div class="info-grid">


        ${
          car.country ||
          location
            ? `

        <div class="info">

          🌍

          <strong>
            ${escapeHtml(
              t.country
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.country ||
            ""
          )}

        </div>

        `
            : ""
        }


        ${
          car.province
            ? `

        <div class="info">

          📍

          <strong>
            ${escapeHtml(
              t.province
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.province
          )}

        </div>

        `
            : ""
        }


        ${
          car.district
            ? `

        <div class="info">

          📍

          <strong>
            ${escapeHtml(
              t.district
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.district
          )}

        </div>

        `
            : ""
        }


        ${
          car.sector
            ? `

        <div class="info">

          📍

          <strong>
            ${escapeHtml(
              t.sector
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.sector
          )}

        </div>

        `
            : ""
        }


        ${
          car.city
            ? `

        <div class="info">

          🏙️

          <strong>
            ${escapeHtml(
              t.city
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.city
          )}

        </div>

        `
            : ""
        }


        ${
          car.year
            ? `

        <div class="info">

          📅

          <strong>
            ${escapeHtml(
              t.year
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.year
          )}

        </div>

        `
            : ""
        }


        ${
          car.mileage
            ? `

        <div class="info">

          🛣️

          <strong>
            ${escapeHtml(
              t.mileage
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.mileage
          )}

        </div>

        `
            : ""
        }


        ${
          car.fuel
            ? `

        <div class="info">

          ⛽

          <strong>
            ${escapeHtml(
              t.fuel
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.fuel
          )}

        </div>

        `
            : ""
        }


        ${
          car.transmission
            ? `

        <div class="info">

          ⚙️

          <strong>
            ${escapeHtml(
              t.transmission
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.transmission
          )}

        </div>

        `
            : ""
        }


        ${
          car.color
            ? `

        <div class="info">

          🎨

          <strong>
            ${escapeHtml(
              t.color
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.color
          )}

        </div>

        `
            : ""
        }


        ${
          car.condition
            ? `

        <div class="info">

          🚘

          <strong>
            ${escapeHtml(
              t.condition
            )}
          </strong>

          <br>

          ${escapeHtml(
            car.condition
          )}

        </div>

        `
            : ""
        }


        <div class="info">

          👤

          <strong>
            ${escapeHtml(
              t.seller
            )}
          </strong>

          <br>

          ${escapeHtml(
            sellerName
          )}

        </div>


      </div>


      ${
        location
          ? `

      <div class="info" style="margin-top:15px;">

        📍

        <strong>
          ${escapeHtml(
            location
          )}
        </strong>

      </div>

      `
          : ""
      }


      <h3>

        ${escapeHtml(
          t.description
        )}

      </h3>


      <p class="description">

        ${escapeHtml(
          car.description ||
          car.details ||
          t.noDescription
        )}

      </p>


      <h3>

        ${escapeHtml(
          t.contact
        )}

      </h3>


      <div class="contact">

        ${contactHTML}

      </div>


      <!-- ================= SOCIAL LINKS ================= -->

      <h3 class="social-title">

        Rwanda Property Visata

      </h3>


      <div class="social-links">


        <a

          href="https://www.instagram.com/"

          target="_blank"

          rel="noopener noreferrer"

          class="social-link instagram"

        >

          ${escapeHtml(
            t.instagram
          )}

        </a>


        <a

          href="https://youtube.com/@iranziirene-j5f?si=PtRA9dAwTog111BJ2"

          target="_blank"

          rel="noopener noreferrer"

          class="social-link youtube"

        >

          ${escapeHtml(
            t.youtube
          )}

        </a>


      </div>


    </div>

  `;


  /* ================= ADSENSE ================= */

  const adArea =
    document.getElementById(
      "adArea"
    );


  if(adArea){

    const advertisement =
      createAdvertisement();


    adArea.appendChild(
      advertisement
    );


    try{

      (
        window.adsbygoogle =
        window.adsbygoogle ||
        []
      ).push({});

    }
    catch(error){

      console.log(
        "AdSense error:",
        error
      );

    }

  }


  /* ================= INITIAL PHOTO ================= */

  showPhoto(0);

}


/* =====================================================
   KEYBOARD PHOTO NAVIGATION
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "ArrowLeft"){

      previousPhoto();

    }

    if(event.key === "ArrowRight"){

      nextPhoto();

    }

  }
);


/* =====================================================
   START
===================================================== */

loadCar();

</script>


</body>
</html>
