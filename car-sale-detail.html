/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   GET CAR ID
===================================================== */

const params =

/* =====================================================
   NORMALIZE PHONE
===================================================== */

function normalizePhone(phone){

  if(!phone){
    return "";
  }

  let value =
    String(phone)
      .trim()
      .replace(/\s+/g,"");


  if(
    value.startsWith("0") &&
    value.length >= 9
  ){

    value =
      "250" +
      value.substring(1);

  }


  if(
    value.startsWith("+250")
  ){

    value =
      value.substring(1);

  }


  return value.replace(
    /[^\d]/g,
    ""
  );

}


/* =====================================================
   PARSE PHOTOS
===================================================== */

function getPhotos(car){

  let photos = [];


  /* ================= MAIN PHOTO ================= */

  if(car.mainph){

    photos.push(
      car.mainph
    );

  }


  /* ================= OTHER PHOTOS ARRAY ================= */

  if(
    Array.isArray(
      car.otherph
    )
  ){

    photos =
      photos.concat(
        car.otherph
      );

  }


  /* ================= OTHER PHOTOS JSON ================= */

  else if(
    typeof car.otherph ===
    "string" &&
    car.otherph.trim() !== ""
  ){

    try{

      const parsed =
        JSON.parse(
          car.otherph
        );

      if(
        Array.isArray(parsed)
      ){

        photos =
          photos.concat(
            parsed
          );

      }

      else if(
        typeof parsed ===
        "string"
      ){

        photos.push(
          parsed
        );

      }

    }
    catch(error){

      /*
        If otherph contains
        one URL only.
      */

      if(
        car.otherph.startsWith(
          "http"
        )
      ){

        photos.push(
          car.otherph
        );

      }

    }

  }


  /* ================= CLEAN PHOTOS ================= */

  photos =
    [
      ...new Set(
        photos
      )
    ]
    .filter(
      photo =>
        photo &&
        typeof photo ===
        "string"
    );


  return photos;

}

/* =====================================================
   CURRENT PHOTO
===================================================== */

let currentPhotoIndex = 0;

let currentPhotos = [];


/* =====================================================
   SHOW PHOTO
===================================================== */

function showPhoto(index){

  currentPhotos =
    currentPhotos.length
      ? currentPhotos
      : [];


  if(
    index < 0 ||
    index >= currentPhotos.length
  ){

    return;

  }


  currentPhotoIndex =
    index;


  const mainPhoto =
    document.getElementById(
      "mainPhoto"
    );


  if(mainPhoto){

    mainPhoto.src =
      currentPhotos[
        currentPhotoIndex
      ];

  }


  /* ================= ACTIVE THUMBNAIL ================= */

  document
    .querySelectorAll(
      ".gallery img"
    )
    .forEach(
      (img,index) => {

        img.classList.toggle(
          "active",
          index ===
          currentPhotoIndex
        );

      }
    );


  /* ================= COUNTER ================= */

  const counter =
    document.getElementById(
      "photoCounter"
    );


  if(counter){

    counter.textContent =
      `${currentPhotoIndex + 1} / ${currentPhotos.length}`;

  }

}


/* =====================================================
   PREVIOUS PHOTO
===================================================== */

function previousPhoto(){

  if(
    currentPhotos.length <= 1
  ){

    return;

  }


  currentPhotoIndex--;

  if(
    currentPhotoIndex < 0
  ){

    currentPhotoIndex =
      currentPhotos.length - 1;

  }


  showPhoto(
    currentPhotoIndex
  );

}


/* =====================================================
   NEXT PHOTO
===================================================== */

function nextPhoto(){

  if(
    currentPhotos.length <= 1
  ){

    return;

  }


  currentPhotoIndex++;

  if(
    currentPhotoIndex >=
    currentPhotos.length
  ){

    currentPhotoIndex = 0;

  }


  showPhoto(
    currentPhotoIndex
  );

}


/* =====================================================
   PHOTO CONTROLS
===================================================== */

function updatePhotoControls(){

  const left =
    document.getElementById(
      "previousButton"
    );

  const right =
    document.getElementById(
      "nextButton"
    );


  if(
    currentPhotos.length <= 1
  ){

    if(left){

      left.style.display =
        "none";

    }

    if(right){

      right.style.display =
        "none";

    }

  }
  else{

    if(left){

      left.style.display =
        "flex";

    }

    if(right){

      right.style.display =
        "flex";

    }

  }

}
