<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>House Detail - Rwanda House Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#f2c400;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0;
}

.back{
  display:inline-block;
  margin-top:12px;
  background:white;
  color:#222;
  text-decoration:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px 60px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.main-photo{
  width:100%;
  height:500px;
  object-fit:cover;
  border-radius:12px;
  display:block;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:12px;
}

.gallery img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
}

.gallery img:hover{
  opacity:.8;
}

.title{
  font-size:30px;
  margin-top:0;
}

.price{
  color:#b27b00;
  font-size:26px;
  font-weight:bold;
  margin:15px 0;
}

.type{
  display:inline-block;
  background:#fff4bf;
  border:1px solid #f2c400;
  color:#8a6500;
  padding:8px 14px;
  border-radius:20px;
  font-weight:bold;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-top:20px;
}

.info{
  background:#fafafa;
  padding:15px;
  border-radius:8px;
}

.description{
  line-height:1.7;
  color:#555;
}

.contact{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.button{
  display:inline-block;
  padding:13px 20px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.call{
  background:#f2c400;
  color:#222;
}

.whatsapp{
  background:#128c7e;
  color:white;
}

.loading{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:12px;
}

.error{
  background:#ffe8e8;
  color:#a00000;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

@media(max-width:700px){

  .main-photo{
    height:300px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .title{
    font-size:25px;
  }

}

</style>

</head>

<body>

<header>

  <h1>🏡 RWANDA HOUSE MARKET</h1>

  <a
    href="houses-sale.html"
    class="back">

    ← Back to Houses for Sale

  </a>

</header>


<div class="container">

  <div id="content">

    <div class="loading">
      Loading property...
    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ELEMENT
========================= */

const content =
  document.getElementById("content");


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   GET PROPERTY ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const propertyId =
  params.get("id");


/* =========================
   LOAD PROPERTY
========================= */

async function loadProperty(){

  if(!propertyId){

    content.innerHTML = `
      <div class="error">
        ❌ Property ID ntibonetse.
      </div>
    `;

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("property_posts")
    .select("*")
    .eq("id",propertyId)
    .eq("property_type","sale")
    .maybeSingle();


  if(error){

    console.error(error);

    content.innerHTML = `
      <div class="error">
        ❌ ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if(!data){

    content.innerHTML = `
      <div class="error">
        ❌ Iyi nzu ntiyabonetse.
      </div>
    `;

    return;
  }


  renderProperty(data);

}


/* =========================
   RENDER PROPERTY
========================= */

function renderProperty(property){

  document.title =
    (property.title || "House Detail") +
    " - Rwanda House Market";


  const mainPhoto =
    property.main_photo ||
    "https://via.placeholder.com/1000x600?text=No+Photo";


  let photos = [];


  if(property.main_photo){

    photos.push(
      property.main_photo
    );

  }


  if(
    Array.isArray(
      property.other_photos
    )
  ){

    photos =
      photos.concat(
        property.other_photos
      );

  }


  const uniquePhotos =
    [...new Set(photos)]
      .filter(Boolean);


  let galleryHTML = "";


  uniquePhotos.forEach(photo => {

    galleryHTML += `

      <img
        src="${escapeHtml(photo)}"
        onclick="changeMainPhoto(this.src)"
        alt="Property Photo">

    `;

  });


  content.innerHTML = `

    <div class="card">

      <img
        id="mainPhoto"
        class="main-photo"
        src="${escapeHtml(mainPhoto)}"
        alt="House">

      <div class="gallery">

        ${galleryHTML}

      </div>

    </div>


    <div class="card">

      <span class="type">
        🏠 House for Sale
      </span>

      <h2 class="title">
        ${escapeHtml(
          property.title ||
          "House for Sale"
        )}
      </h2>

      <div class="price">

        ${Number(
          property.price || 0
        ).toLocaleString()} RWF

      </div>


      <div class="info-grid">

        <div class="info">

          🌍 <strong>Country</strong><br>

          ${escapeHtml(
            property.country || ""
          )}

        </div>


        <div class="info">

          📍 <strong>Province</strong><br>

          ${escapeHtml(
            property.province || ""
          )}

        </div>


        <div class="info">

          📍 <strong>District</strong><br>

          ${escapeHtml(
            property.district || ""
          )}

        </div>


        <div class="info">

          📍 <strong>Sector</strong><br>

          ${escapeHtml(
            property.sector || ""
          )}

        </div>


        <div class="info">

          🛏️ <strong>Bedrooms</strong><br>

          ${property.bedrooms ?? 0}

        </div>


        <div class="info">

          🚿 <strong>Bathrooms</strong><br>

          ${property.bathrooms ?? 0}

        </div>


        <div class="info">

          🚗 <strong>Parking</strong><br>

          ${property.parking ?? 0}

        </div>

      </div>


      <h3>
        Description
      </h3>

      <p class="description">

        ${escapeHtml(
          property.description ||
          "No description available."
        )}

      </p>


      <h3>
        📞 Contact Rwanda House Market
      </h3>


      <div class="contact">

        <a
          href="tel:+250799645553"
          class="button call">

          📞 Call

        </a>


        <a
          href="https://wa.me/250799645553"
          target="_blank"
          class="button whatsapp">

          💬 WhatsApp

        </a>

      </div>

    </div>

  `;

}


/* =========================
   CHANGE MAIN PHOTO
========================= */

function changeMainPhoto(src){

  document
    .getElementById("mainPhoto")
    .src = src;

}


/* =========================
   START
========================= */

loadProperty();

</script>

</body>
</html>
