<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="browserTitle">House for Sale - Rwanda House Market</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222222;
    }

    /* ================= HEADER ================= */

    header {
      background: #f4b400;
      color: #222222;
      padding: 22px 15px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: #222222;
      text-decoration: none;
      font-weight: bold;
      background: #ffffff;
      padding: 9px 15px;
      border-radius: 8px;
    }

    .back:hover {
      background: #fff8d6;
    }

    /* ================= CONTAINER ================= */

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    /* ================= EMPTY ================= */

    .empty {
      min-height: 400px;
      background: #ffffff;
      border: 2px solid #f4b400;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 30px;
    }

    .empty-content {
      max-width: 600px;
    }

    .empty-icon {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .empty h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .empty p {
      margin: 0;
      color: #666666;
      font-size: 17px;
      line-height: 1.6;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {

      header {
        padding: 20px 12px;
      }

      header h1 {
        font-size: 24px;
      }

      .container {
        padding: 20px 15px 50px;
      }

      .empty {
        min-height: 300px;
      }

      .empty-icon {
        font-size: 50px;
      }

      .empty h2 {
        font-size: 23px;
      }

    }

  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <h1 id="headerTitle">
      🏡 RWANDA HOUSE MARKET
    </h1>

    <a
      href="./houses-sale.html"
      class="back"
      id="backButton">
      ← Back to Houses for Sale
    </a>

  </header>


  <!-- ================= MAIN ================= -->

  <div class="container">

    <div class="empty">

      <div class="empty-content">

        <div class="empty-icon">
          🏠
        </div>

        <h2 id="emptyTitle">
          No property available
        </h2>

        <p id="emptyDescription">
          There is currently no property posted here.
        </p>

      </div>

    </div>

  </div>


  <!-- ================= LANGUAGE ================= -->

  <script>

    const language =
      localStorage.getItem("selectedLanguage") || "English";


    const translations = {

      Kinyarwanda: {

        browserTitle:
          "Inzu igurishwa - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Subira ku mazu agurishwa",

        emptyTitle:
          "Nta mutungo uhari",

        emptyDescription:
          "Kugeza ubu nta mutungo washyizwe kuri iyi page."

      },


      English: {

        browserTitle:
          "House for Sale - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Back to Houses for Sale",

        emptyTitle:
          "No property available",

        emptyDescription:
          "There is currently no property posted here."

      },


      Français: {

        browserTitle:
          "Maison à vendre - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Retour aux maisons à vendre",

        emptyTitle:
          "Aucune propriété disponible",

        emptyDescription:
          "Aucune propriété n'est actuellement publiée ici."

      },


      Kiswahili: {

        browserTitle:
          "Nyumba ya Kuuza - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Rudi kwenye Nyumba za Kuuza",

        emptyTitle:
          "Hakuna mali inayopatikana",

        emptyDescription:
          "Kwa sasa hakuna mali iliyowekwa hapa."

      },


      "中文": {

        browserTitle:
          "出售房屋 - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← 返回出售房屋",

        emptyTitle:
          "暂无房产",

        emptyDescription:
          "目前这里没有发布任何房产。"

      }

    };


    const t =
      translations[language] ||
      translations.English;


    document.title =
      t.browserTitle;


    document.getElementById(
      "headerTitle"
    ).textContent =
      t.header;


    document.getElementById(
      "backButton"
    ).textContent =
      t.back;


    document.getElementById(
      "emptyTitle"
    ).textContent =
      t.emptyTitle;


    document.getElementById(
      "emptyDescription"
    ).textContent =
      t.emptyDescription;


    localStorage.setItem(
      "selectedLanguage",
      language
    );

  </script>

</body>

</html>
