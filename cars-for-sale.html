/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* =====================================================
   GET CAR IMAGE
===================================================== */

function getCarImage(car){

  let image =
    car.main_photo ||
    car.mainPhoto ||
    car.image ||
    "";


  /*
     If main photo is empty,
     use first other photo.
  */

  if(
    !image &&
    Array.isArray(car.other_photos) &&
    car.other_photos.length > 0
  ){

    image =
      car.other_photos[0];

  }


  /*
     If other_photos is JSON text.
  */

  if(
    !image &&
    typeof car.other_photos === "string"
  ){

    try{

      const parsed =
        JSON.parse(
          car.other_photos
        );


      if(
        Array.isArray(parsed) &&
        parsed.length > 0
      ){

        image =
          parsed[0];

      }

    }
    catch(error){

      console.log(
        "Photo parsing error:",
        error
      );

    }

  }


  /*
     Placeholder
  */

  if(!image){

    image =
      "https://via.placeholder.com/800x500?text=" +
      encodeURIComponent(
        t.car
      );

  }


  return image;

}



/* =====================================================
   GET LOCATION
===================================================== */

function getLocation(car){

  const parts = [

    car.country,

    car.province,

    car.district,

    car.sector

  ].filter(

    value =>

      value !== null &&

      value !== undefined &&

      String(value).trim() !== ""

  );


  if(parts.length > 0){

    return parts.join(", ");

  }


  return t.rwanda;

}



/* =====================================================
   LOAD CARS
===================================================== */

async function loadCars(){


  carsElement.innerHTML = `

    <div class="empty loading">

      ${escapeHtml(
        t.loading
      )}

    </div>

  `;


  try{


    /*
       IMPORTANT:

       This code expects a Supabase table
       called "car_posts".

       The table should contain:
       id
       title
       price
       main_photo
       other_photos
       country
       province
       district
       sector
       status
       created_at
    */


    const {
      data,
      error
    } =

    await supabaseClient

      .from("cars_posts")

      .select("*")

      .eq(
        "status",
        "published"
      )

      .order(
        "created_at",
        {
          ascending:false
        }
      );



    /* =================================================
       ERROR
    ================================================= */

    if(error){

      console.error(
        "SUPABASE ERROR:",
        error
      );


      carsElement.innerHTML = `

        <div class="empty error">

          ❌<br><br>

          ${escapeHtml(
            error.message ||
            t.error
          )}

        </div>

      `;

      return;

    }



    /* =================================================
       EMPTY
    ================================================= */

    if(
      !data ||
      data.length === 0
    ){

      carsElement.innerHTML = `

        <div class="empty">

          🚗<br><br>

          ${escapeHtml(
            t.noCars
          )}

        </div>

      `;

      return;

    }



    /* =================================================
       CLEAR
    ================================================= */

    carsElement.innerHTML = "";



    /* =================================================
       CREATE CAR CARDS
    ================================================= */

    data.forEach(
      car => {


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "car";



        /* IMAGE */

        const image =
          getCarImage(car);



        /* TITLE */

        const carTitle =

          car.title ||

          car.name ||

          car.car_name ||

          t.car;



        /* PRICE */

        let formattedPrice =
          "0";


        if(
          car.price !== null &&
          car.price !== undefined &&
          car.price !== ""
        ){

          const number =
            Number(
              car.price
            );


          if(
            !Number.isNaN(
              number
            )
          ){

            formattedPrice =
              number.toLocaleString(
                "en-US"
              );

          }

        }



        /* LOCATION */

        const location =
          getLocation(car);



        /* DETAIL URL */

        const detailUrl =
          "car-sale-detail.html?id=" +
          encodeURIComponent(
            car.id
          );



        /* =================================================
           CARD HTML
        ================================================= */

        card.innerHTML = `

          <img

            src="${escapeHtml(
              image
            )}"

            alt="${escapeHtml(
              carTitle
            )}"

            loading="lazy"

            onerror="
              this.onerror=null;
              this.src='https://via.placeholder.com/800x500?text=No+Photo';
            "

          >


          <div class="car-body">


            <div class="car-title">

              ${escapeHtml(
                carTitle
              )}

            </div>


            <div class="price">

              ${escapeHtml(
                formattedPrice
              )}

              RWF

            </div>


            <div class="location">

              📍

              ${escapeHtml(
                location
              )}

            </div>


            <a

              class="details"

              href="${escapeHtml(
                detailUrl
              )}"

            >

              ${escapeHtml(
                t.view
              )}

            </a>


          </div>

        `;



        carsElement.appendChild(
          card
        );


      }
    );


  }
  catch(error){


    console.error(
      "Unexpected error:",
      error
    );


    carsElement.innerHTML = `

      <div class="empty error">

        ❌<br><br>

        ${escapeHtml(
          t.error
        )}

        <br><br>

        ${escapeHtml(
          error.message ||
          ""
        )}

      </div>

    `;

  }

}



/* =====================================================

===================================================== */

loadCars();
