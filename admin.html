<style>

body{

<body>

<nav class="navbar">

  <div class="logo">
    🏠 Rwanda House Market — ADMIN
  </div>

  <div class="nav-buttons">
    <button onclick="goHome()">Home</button>
    <button onclick="logout()">Logout</button>
  </div>

</nav>

<div class="container">

  <div class="page-title">
    <h1>Admin Dashboard</h1>
    <p>Manage Rwanda House Market properties.</p>
  </div>

  <div class="tabs">

    <button
      class="tab active"
      onclick="showSection('propertiesSection',this)">
      🏠 Properties
    </button>

    <button
      class="tab"
      onclick="showSection('newPostSection',this)">
      ➕ New Post
    </button>

  </div>


  <!-- ================= PROPERTIES ================= -->

  <section
    id="propertiesSection"
    class="section active">

    <div class="card">

      <h2>🏠 All Properties</h2>

      <p>
        Posts zose ukoresheje New Post zizagaragara hano.
      </p>

    </div>

    <div
      id="properties"
      class="properties">

      <div class="empty">
        Loading properties...
      </div>

    </div>

  </section>


  <!-- ================= NEW POST ================= -->

  <section
    id="newPostSection"
    class="section">

    <div class="card">

      <h2>➕ New Property Post</h2>

      <form id="propertyForm">

        <label>Property Title</label>

        <input
          type="text"
          id="title"
          placeholder="Example: Beautiful House in Kigali"
          required
        >


        <label>Property Type</label>

        <select id="propertyType" required>

          <option value="">
            Choose property type
          </option>

          <option value="rent">
            🏠 House for Rent
          </option>

          <option value="sale">
            🏡 House for Sale
          </option>

          <option value="plot">
            📍 Plot for Sale
          </option>

        </select>


        <label>Transaction Type</label>

        <select id="transactionType" required>

          <option value="">
            Choose transaction
          </option>

          <option value="rent">
            For Rent
          </option>

          </option>

        </select>


        <label>Price</label>

        <input
          type="number"

          min="0"

        >


        <div class="grid">

          <div>

            <label>Country</label>

            <input
              type="text"
              id="country"
              value="Rwanda"
              required
            >

          </div>


          <div>

            <label>Province</label>

            <input
              type="text"
              id="province"
              placeholder="Kigali"
              required
            >

          </div>


          <div>

            <label>District</label>

            <input
              type="text"
              id="district"
              placeholder="Gasabo"
              required
            >

          </div>


          <div>

            <label>Sector</label>

            <input
              type="text"
              id="sector"

              required
            >

          </div>

        </div>


        <div class="grid">

          <div>

            <label>Bedrooms</label>

            <input
              type="number"
              id="bedrooms"
              min="0"
              value="0"
            >

          </div>


          <div>

            <label>Bathrooms</label>

            <input
              type="number"
              id="bathrooms"
              min="0"
              value="0"
            >

          </div>


          <div>

            <label>Parking</label>

            <input
              type="number"
              id="parking"
              min="0"
              value="0"
            >

          </div>

        </div>


        <label>Seller Name</label>

        <input
          type="text"
          id="sellerName"

        <input

        <label>Main Photo</label>

        <input
          type="file"

        <div
          id="photoPreview"

        <button
          type="submit"

      </form>

    </div>

  </section>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://hsmnybmcddtsyooltozw.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const propertiesElement =
  document.getElementById("properties");

const propertyForm =
  document.getElementById("propertyForm");

const postButton =
  document.getElementById("postButton");

const postMessage =
  document.getElementById("postMessage");

const photoPreview =
  document.getElementById("photoPreview");


/* =========================================
   ADMIN LOGIN
========================================= */

async function checkAdmin(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(!session){

    window.location.href =
      "login.html";

    return false;
  }


  return true;
}


/* =========================================
   SECTION
========================================= */

function showSection(id,button){

  document
    .querySelectorAll(".section")
    .forEach(section => {

      section.classList.remove("active");

    });


  document
    .getElementById(id)
    .classList.add("active");


  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.remove("active");

    });


  button.classList.add("active");


  if(id === "propertiesSection"){

    loadProperties();

  }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

  postMessage.textContent =
    text;

  postMessage.className =
    "message " + type;

}


/* =========================================
   PHOTO PREVIEW
========================================= */

document
  .getElementById("otherPhotos")
  .addEventListener(
    "change",
    function(){

      photoPreview.innerHTML = "";

      Array
        .from(this.files)
        .forEach(file => {

          const img =
            document.createElement("img");

          img.src =
            URL.createObjectURL(file);

          photoPreview.appendChild(img);

        });

    }
  );


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadImage(file){

  if(!file){

    throw new Error(
      "Image file irabura."
    );

  }


  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g,"-");


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2) +
    "-" +
    safeName;


  const filePath =
    "properties/" +
    fileName;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from("property-images")
    .upload(
      filePath,
      file,
      {
        upsert:false
      }
    );


  if(error){

    throw error;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from("property-images")
    .getPublicUrl(
      filePath
    );


  return data.publicUrl;
}


/* =========================================
   CREATE PROPERTY
========================================= */

propertyForm.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    postButton.disabled =
      true;

    postButton.textContent =
      "Posting...";


    showMessage(
      "Posting property...",
      "success"
    );


    try{

      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const propertyType =
        document
          .getElementById("propertyType")
          .value;


      const transactionType =
        document
          .getElementById("transactionType")
          .value;


      const price =
        Number(
          document
            .getElementById("price")
            .value
        );


      const country =
        document
          .getElementById("country")
          .value
          .trim();


      const province =
        document
          .getElementById("province")
          .value
          .trim();


      const district =
        document
          .getElementById("district")
          .value
          .trim();


      const sector =
        document
          .getElementById("sector")
          .value
          .trim();


      const bedrooms =
        Number(
          document
            .getElementById("bedrooms")
            .value || 0
        );


      const bathrooms =
        Number(
          document
            .getElementById("bathrooms")
            .value || 0
        );


      const parking =
        Number(
          document
            .getElementById("parking")
            .value || 0
        );


      const sellerName =
        document
          .getElementById("sellerName")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const mainPhotoFile =
        document
          .getElementById("mainPhoto")
          .files[0];


      const otherPhotoFiles =
        Array.from(
          document
            .getElementById("otherPhotos")
            .files
        );


      if(!mainPhotoFile){

        throw new Error(
          "Main Photo irakenewe."
        );

      }


      if(
        propertyType === "plot"
      ){

        /*
          Plot nta bedrooms,
          bathrooms cyangwa
          parking bisabwa.
          Ariko columns zizakomeza
          kubaho muri table.
        */

      }


      /* ==========================
         MAIN PHOTO
      ========================== */

      const mainPhotoUrl =
        await uploadImage(
          mainPhotoFile
        );


      /* ==========================
         OTHER PHOTOS
      ========================== */

      const otherPhotoUrls = [];


      for(
        const file
        of otherPhotoFiles
      ){

        const url =
          await uploadImage(file);

        otherPhotoUrls.push(url);

      }


      /* ==========================
         POSTING FEE
      ========================== */

      /*
        Admin post fee:
        <= 50,000,000 = 0.5%
        >  50,000,000 = 1%
      */

      let postingFee = 0;


      if(price < 50000000){

        postingFee =
          price * 0.005;

      }
      else{

        postingFee =
          price * 0.01;

      }


      /* ==========================
         INSERT INTO NEW TABLE
      ========================== */

      const {
        error
      } =
      await supabaseClient
        .from("property_posts")
        .insert({

          seller_name:
            sellerName,

          phone:
            phone,

          property_type:
            propertyType,

          transaction_type:
            transactionType,

          title:
            title,

          country:
            country,

          province:
            province,

          district:
            district,

          sector:
            sector,

          bedrooms:
            bedrooms,

          bathrooms:
            bathrooms,

          parking:
            parking,

          price:
            price,

          posting_fee:
            postingFee,

          main_photo:
            mainPhotoUrl,

          other_photos:
            otherPhotoUrls,

          description:
            description,

          status:
            "published"

        });


      if(error){

        throw error;

      }


      showMessage(
        "✅ Property posted successfully!",
        "success"
      );


      propertyForm.reset();


      document
        .getElementById("country")
        .value =
        "Rwanda";


      photoPreview.innerHTML =
        "";


      await loadProperties();

    }
    catch(error){

      console.error(error);

      showMessage(
        "❌ " +
        error.message,
        "error"
      );

    }


    postButton.disabled =
      false;

    postButton.textContent =
      "Post Property";

  }
);


/* =========================================
   LOAD PROPERTIES
========================================= */

async function loadProperties(){

  propertiesElement.innerHTML =
    `<div class="empty">
      Loading properties...
    </div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("property_posts")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    propertiesElement.innerHTML =
      `<div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>`;

    return;

  }


  if(!data || data.length === 0){

    propertiesElement.innerHTML =
      `<div class="empty">
        Nta property iraboneka.
      </div>`;

    return;

  }


  propertiesElement.innerHTML =
    "";


  data.forEach(property => {

    const card =
      document.createElement("div");

    card.className =
      "property";


    const mainPhoto =
      property.main_photo ||
      (
        Array.isArray(
          property.other_photos
        )
        ?
        property.other_photos[0]
        :
        ""
      ) ||
      "https://via.placeholder.com/600x400?text=No+Photo";


    card.innerHTML = `

      <img
        src="${escapeHtml(mainPhoto)}"
        alt="Property">


      <div class="property-body">

        <div class="property-title">

          ${escapeHtml(
            property.title ||
            "Property"
          )}

        </div>


        <div class="price">

          ${Number(
            property.price || 0
          ).toLocaleString()}

          RWF

        </div>


        <div class="location">

          📍
          ${escapeHtml(
            property.country || ""
          )},
          ${escapeHtml(
            property.province || ""
          )},
          ${escapeHtml(
            property.district || ""
          )},
          ${escapeHtml(
            property.sector || ""
          )}

          <br><br>

          🏷️ Type:
          ${escapeHtml(
            property.property_type || ""
          )}

          <br>

          📌 Status:
          <span class="status">

            ${escapeHtml(
              property.status || "pending"
            )}

          </span>

          <br><br>

          🛏️ Bedrooms:
          ${property.bedrooms ?? 0}

          <br>

          🚿 Bathrooms:
          ${property.bathrooms ?? 0}

          <br>

          🚗 Parking:
          ${property.parking ?? 0}

        </div>


        <div class="property-actions">

          <button
            class="button secondary"
            onclick="viewProperty('${property.id}')">

            View

          </button>


          <button
            class="button delete"
            onclick="deleteProperty('${property.id}')">

            🗑️ Delete

          </button>

        </div>

      </div>

    `;


    propertiesElement.appendChild(
      card
    );

  });

}


/* =========================================
   VIEW PROPERTY
========================================= */

async function viewProperty(id){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("property_posts")
    .select("*")
    .eq("id",id)
    .maybeSingle();


  if(error){

    alert(
      "❌ " +
      error.message
    );

    return;

  }


  if(!data){

    alert(
      "Property ntiyabonetse."
    );

    return;

  }


  const message =

    "PROPERTY DETAILS\n\n" +

    "Title: " +
    (data.title || "") +

    "\n\nSeller: " +
    (data.seller_name || "") +

    "\nPhone: " +
    (data.phone || "") +

    "\n\nProperty Type: " +
    (data.property_type || "") +

    "\nTransaction: " +
    (data.transaction_type || "") +

    "\n\nPrice: " +
    Number(
      data.price || 0
    ).toLocaleString() +
    " RWF" +

    "\nPosting Fee: " +
    Number(
      data.posting_fee || 0
    ).toLocaleString() +
    " RWF" +

    "\n\nLocation: " +
    (data.country || "") +
    " / " +
    (data.province || "") +
    " / " +
    (data.district || "") +
    " / " +
    (data.sector || "") +

    "\n\nBedrooms: " +
    (data.bedrooms ?? 0) +

    "\nBathrooms: " +
    (data.bathrooms ?? 0) +

    "\nParking: " +
    (data.parking ?? 0) +

    "\n\nDescription:\n" +
    (data.description || "");


  alert(message);

}


/* =========================================
   DELETE PROPERTY
========================================= */

async function deleteProperty(id){

  const confirmed =
    confirm(
      "Urashaka koko gusiba iyi property?"
    );


  if(!confirmed){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("property_posts")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "❌ " +
      error.message
    );

    return;

  }


  alert(
    "✅ Property yasibwe neza."
  );


  await loadProperties();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   HOME
========================================= */

function goHome(){

  window.location.href =
    "home.html";

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await supabaseClient
    .auth
    .signOut();

  window.location.href =
    "login.html";

}


/* =========================================
   START
========================================= */

(async function(){

  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    return;

  }


  await loadProperties();

})();

</script>

</body>
</html>
