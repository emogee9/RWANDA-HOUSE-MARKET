<!DOCTYPE html>
<html lang="rw">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Houses for Sale - Rwanda House Market</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#f2c400;
  color:#222;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

.back{
  display:inline-block;
  margin-top:10px;
  color:#222;
  text-decoration:none;
  font-weight:bold;
  background:white;
  padding:9px 15px;
  border-radius:8px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 50px;
}

.page-title{
  background:white;
  padding:25px;
  text-align:center;
  border-radius:15px;
  margin-bottom:25px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.page-title h2{
  margin-top:0;
}

.houses{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.house{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.house img{
  width:100%;
  height:230px;
  object-fit:cover;
  display:block;
}

.house-content{
  padding:20px;
}

.house h2{
  margin-top:0;
}

.price{
  color:#b27b00;
  font-size:21px;
  font-weight:bold;
  margin:10px 0;
}

.location{
  color:#555;
  margin-bottom:12px;
  line-height:1.6;
}

.type{
  display:inline-block;
  background:#fff8d6;
  color:#8a6500;
  padding:6px 10px;
  border-radius:15px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:10px;
}

.description{
  color:#555;
  line-height:1.6;
}

.details{
  display:inline-block;
  background:#f2c400;
  color:#222;
  text-decoration:none;
  padding:12px 20px;
  border-radius:8px;
  font-weight:bold;
  margin-top:8px;
}

.details:hover{
  background:#d4a900;
}

.empty{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:12px;
  color:#777;
}

.language{
  margin-top:15px;
}

.language select{
  padding:9px 12px;
  border:0;
  border-radius:7px;
  font-weight:bold;
}

@media(max-width:600px){

  .house img{
    height:210px;
  }

  .container{
    padding:20px 15px 40px;
  }

}

</style>
</head>


<body>

<header>

<h1 id="headerTitle">
🏡 RWANDA HOUSE MARKET
</h1>

<a
href="home.html"
class="back"
id="backButton">
← Back to Home
</a>

<div class="language">

<select id="languageSelect">

<option value="Kinyarwanda">
🇷🇼 Kinyarwanda
</option>

<option value="English">
🇬🇧 English
</option>

<option value="Français">
🇫🇷 Français
</option>

<option value="Kiswahili">
🇹🇿 Kiswahili
</option>

<option value="中文">
🇨🇳 中文
</option>

</select>

</div>

</header>


<div class="container">

<div class="page-title">

<h2 id="pageTitle">
🏡 Amazu agurishwa
</h2>

<p id="pageDescription">
Reba amazu ari kugurishwa mu Rwanda.
</p>

</div>


<div
id="houses"
class="houses">

<div class="empty">
Loading properties...
</div>

</div>

</div>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://hsmnybmcddtsyooltozw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
ELEMENTS
===================================================== */

const houses =
document.getElementById("houses");

const languageSelect =
document.getElementById("languageSelect");


/* =====================================================
TRANSLATIONS
===================================================== */

const pageTranslations = {

Kinyarwanda:{
title:"🏡 Amazu agurishwa",
description:"Reba amazu ari kugurishwa mu Rwanda.",
back:"← Subira kuri Home",
details:"Reba ibisobanuro",
houseForSale:"Inzu igurishwa"
},

English:{
title:"🏡 Houses for Sale",
description:"Find houses available for sale in Rwanda.",
back:"← Back to Home",
details:"View Details",
houseForSale:"House for Sale"
},

Français:{
title:"🏡 Maisons à vendre",
description:"Trouvez des maisons disponibles à la vente au Rwanda.",
back:"← Retour à l'accueil",
details:"Voir les détails",
houseForSale:"Maison à vendre"
},

Kiswahili:{
title:"🏡 Nyumba za Kuuza",
description:"Pata nyumba zinazopatikana kwa kuuza nchini Rwanda.",
back:"← Rudi Mwanzo",
details:"Tazama Maelezo",
houseForSale:"Nyumba ya Kuuza"
},

"中文":{
title:"🏡 出售房屋",
description:"寻找卢旺达可出售的房屋。",
back:"← 返回首页",
details:"查看详情",
houseForSale:"出售房屋"
}

};


/* =====================================================
LANGUAGE
===================================================== */

let language =
localStorage.getItem("selectedLanguage")
|| "Kinyarwanda";

languageSelect.value =
language;


languageSelect.addEventListener(
"change",
function(){

language =
this.value;

localStorage.setItem(
"selectedLanguage",
language
);

applyPageLanguage();

loadProperties();

}
);


/* =====================================================
APPLY PAGE LANGUAGE
===================================================== */

function applyPageLanguage(){

const t =
pageTranslations[language]
||
pageTranslations.Kinyarwanda;


document.getElementById(
"pageTitle"
).textContent =
t.title;


document.getElementById(
"pageDescription"
).textContent =
t.description;


document.getElementById(
"backButton"
).textContent =
t.back;

}


/* =====================================================
GET TRANSLATED VALUE
===================================================== */

function translatedValue(
translations,
fallback
){

if(
translations &&
typeof translations === "object"
){

return (
translations[language]
||
translations.English
||
translations.Kinyarwanda
||
Object.values(translations)[0]
||
fallback
);

}

return fallback;

}


/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
LOAD PROPERTIES
===================================================== */

async function loadProperties(){

houses.innerHTML = `
<div class="empty">
Loading properties...
</div>
`;


const {
data,
error
} =
await supabaseClient
.from("properties")
.select("*")
.eq("property_type","sale")
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(error);

houses.innerHTML = `
<div class="empty">
❌ ${escapeHtml(error.message)}
</div>
`;

return;

}


if(!data || data.length === 0){

houses.innerHTML = `
<div class="empty">
Nta nzu igurishwa iraboneka ubu.
</div>
`;

return;

}


houses.innerHTML = "";


data.forEach(property => {


const title =
translatedValue(
property.title_translations,
property.title ||
"Property"
);


const description =
translatedValue(
property.description_translations,
property.description ||
""
);


const mainPhoto =
property.main_photo
||
(
Array.isArray(property.other_photos)
?
property.other_photos[0]
:
""
)
||
"https://via.placeholder.com/800x500?text=No+Photo";


const t =
pageTranslations[language]
||
pageTranslations.Kinyarwanda;


const card =
document.createElement("div");

card.className =
"house";


card.innerHTML = `

<img
src="${escapeHtml(mainPhoto)}"
alt="${escapeHtml(title)}"
loading="lazy"
>

<div class="house-content">

<div class="type">
${escapeHtml(t.houseForSale)}
</div>

<h2>
${escapeHtml(title)}
</h2>

<div class="price">
${Number(property.price || 0).toLocaleString()} RWF
</div>

<div class="location">

📍
${escapeHtml(property.country || "")},
${escapeHtml(property.province || "")},
${escapeHtml(property.district || "")},
${escapeHtml(property.sector || "")}

<br>

🛏️ ${property.bedrooms ?? 0}
&nbsp;&nbsp;

🚿 ${property.bathrooms ?? 0}
&nbsp;&nbsp;

🚗 ${property.parking ?? 0}

</div>

<p class="description">
${escapeHtml(description)}
</p>

<a
href="house-details.html?id=${encodeURIComponent(property.id)}"
class="details">

${escapeHtml(t.details)}

</a>

</div>

`;


houses.appendChild(card);

});

}


/* =====================================================
START
===================================================== */

applyPageLanguage();

loadProperties();

</script>

</body>
</html>
