<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title id="browserTitle">Houses for Sale - Rwanda House Market</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #f2c400;
      color: #222;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    .back {
      display: inline-block;
      margin-top: 10px;
      color: #222;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 50px;
    }

    .page-title {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    .page-title h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }

    .page-title p {
      color: #666;
      margin-bottom: 0;
    }

    .empty {
      background: white;
      min-height: 300px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .empty-content {
      max-width: 600px;
    }

    .empty-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .empty h3 {
      margin: 0 0 10px;
      font-size: 25px;
      color: #444;
    }

    .empty p {
      margin: 0;
      color: #777;
      font-size: 16px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {

      header {
        padding: 20px 12px;
      }

      header h1 {
        font-size: 24px;
      }

      .container {
        padding: 20px 15px 40px;
      }

      .page-title {
        padding: 25px 15px;
      }

      .empty {
        min-height: 250px;
        padding: 20px;
      }

      .empty h3 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <h1 id="headerTitle">
      🏡 RWANDA HOUSE MARKET
    </h1>

    <a
      href="./home.html"
      class="back"
      id="backButton">
      ← Back to Home
    </a>

  </header>


  <!-- ================= MAIN ================= -->

  <div class="container">

    <div class="page-title">

      <h2 id="pageTitle">
        🏡 Houses for Sale
      </h2>

      <p id="pageDescription">
        Find houses available for sale in Rwanda.
      </p>

    </div>


    <!-- ================= NO POSTS ================= -->

    <div class="empty">

      <div class="empty-content">

        <div class="empty-icon">
          🏠
        </div>

        <h3 id="emptyTitle">
          No properties available
        </h3>

        <p id="emptyDescription">
          There are currently no houses posted for sale.
        </p>

      </div>

    </div>

  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    /* =========================
       LANGUAGE
    ========================= */

    const language =
      localStorage.getItem("selectedLanguage") || "English";


    /* =========================
       TRANSLATIONS
    ========================= */

    const translations = {

      Kinyarwanda: {

        browserTitle:
          "Amazu agurishwa - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Subira kuri Home",

        title:
          "🏡 Amazu agurishwa",

        description:
          "Shaka amazu ahari yo kugura mu Rwanda.",

        emptyTitle:
          "Nta nzu irashyirwaho",

        emptyDescription:
          "Kugeza ubu nta nzu yashyizweho ngo igurishwe."

      },


      English: {

        browserTitle:
          "Houses for Sale - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Back to Home",

        title:
          "🏡 Houses for Sale",

        description:
          "Find houses available for sale in Rwanda.",

        emptyTitle:
          "No properties available",

        emptyDescription:
          "There are currently no houses posted for sale."

      },


      Français: {

        browserTitle:
          "Maisons à vendre - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Retour à l'accueil",

        title:
          "🏡 Maisons à vendre",

        description:
          "Trouvez des maisons disponibles à la vente au Rwanda.",

        emptyTitle:
          "Aucune propriété disponible",

        emptyDescription:
          "Aucune maison n'est actuellement publiée à vendre."

      },


      Kiswahili: {

        browserTitle:
          "Nyumba za Kuuza - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← Rudi Mwanzo",

        title:
          "🏡 Nyumba za Kuuza",

        description:
          "Pata nyumba zinazopatikana kwa kuuza nchini Rwanda.",

        emptyTitle:
          "Hakuna mali inayopatikana",

        emptyDescription:
          "Kwa sasa hakuna nyumba iliyowekwa kwa ajili ya kuuza."

      },


      "中文": {

        browserTitle:
          "出售房屋 - Rwanda House Market",

        header:
          "🏡 RWANDA HOUSE MARKET",

        back:
          "← 返回首页",

        title:
          "🏡 出售房屋",

        description:
          "寻找卢旺达可出售的房屋。",

        emptyTitle:
          "暂无房产",

        emptyDescription:
          "目前没有发布出售的房屋。"

      }

    };


    /* =========================
       CHOOSE LANGUAGE
    ========================= */

    const t =
      translations[language] ||
      translations.English;


    /* =========================
       KEEP LANGUAGE
    ========================= */

    localStorage.setItem(
      "selectedLanguage",
      language
    );


    /* =========================
       APPLY TEXT
    ========================= */

    document.title =
      t.browserTitle;


    document.getElementById(
      "headerTitle"
    ).textContent =
      t.header;


    document.getElementById(
      "backButton"
    ).textContent =
      t.back;


    document.getElementById(
      "pageTitle"
    ).textContent =
      t.title;


    document.getElementById(
      "pageDescription"
    ).textContent =
      t.description;


    document.getElementById(
      "emptyTitle"
    ).textContent =
      t.emptyTitle;


    document.getElementById(
      "emptyDescription"
    ).textContent =
      t.emptyDescription;

  </script>

</body>

</html>
