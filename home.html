<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rwanda Property Visata</title>

  <!-- GOOGLE ADSENSE -->
  <script
    async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7520250190173475"
    crossorigin="anonymous">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background: #f4c542;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .welcome {
      color: white;
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 12px;

      text-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    .subtitle {
      color: white;
      font-size: 21px;
      margin-bottom: 15px;

      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ================= ADVERTISEMENT ================= */

    .ad-container {
      width: 100%;
      margin: 0 auto 25px auto;
      padding: 10px 0;
    }

    .ad-label {
      color: white;
      font-size: 12px;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    /* ================= LANGUAGES ================= */

    .languages {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .language-button {
      width: 100%;
      min-height: 75px;

      border: 3px solid white;
      border-radius: 14px;

      background: white;
      color: #d49b00;

      font-size: 23px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 5px 12px rgba(0,0,0,0.20);

      transition: 0.2s ease;
    }

    .language-button:hover {
      background: #fff8d6;
      border-color: white;

      transform: translateY(-2px);

      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
    }

    .language-button:active {
      transform: scale(0.98);
    }

    .kinyarwanda,
    .english,
    .french,
    .kiswahili,
    .chinese {
      background: white;
      color: #d49b00;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .welcome {
        font-size: 28px;
      }

      .subtitle {
        font-size: 18px;
      }

      .language-button {
        min-height: 68px;
        font-size: 20px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div class="welcome">
      WELCOME TO RWANDA PROPERTY VISATA 🇷🇼
    </div>

    <div class="subtitle">
      Choose your language
    </div>


    <!-- ================= GOOGLE ADSENSE AD ================= -->

    <div class="ad-container">

      <div class="ad-label">
        Advertisement
      </div>

      <ins
        class="adsbygoogle"
        style="display:block"
        data-ad-client="ca-pub-7520250190173475"
        data-ad-slot="7793944660"
        data-ad-format="auto"
        data-full-width-responsive="true">
      </ins>

      <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
      </script>

    </div>


    <!-- ================= LANGUAGE BUTTONS ================= -->

    <div class="languages">

      <button
        class="language-button kinyarwanda"
        onclick="goToHome('Kinyarwanda')">
        🇷🇼 Kinyarwanda
      </button>


      <button
        class="language-button english"
        onclick="goToHome('English')">
        🇬🇧 English
      </button>


      <button
        class="language-button french"
        onclick="goToHome('Français')">
        🇫🇷 Français
      </button>


      <button
        class="language-button kiswahili"
        onclick="goToHome('Kiswahili')">
        🌍 Kiswahili
      </button>


      <button
        class="language-button chinese"
        onclick="goToHome('中文')">
        🇨🇳 中文
      </button>

    </div>

  </div>


  <script>

    function goToHome(language) {

      localStorage.setItem(
        "selectedLanguage",
        language
      );

      window.location.href = "home.html";

    }

  </script>

</body>

</html>
