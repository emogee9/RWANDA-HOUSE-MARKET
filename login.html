<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - Rwanda Property Visata</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #3b2418;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
    }

    .login-card {
      background: white;

      padding: 35px;

      border-radius: 18px;

      border-top: 6px solid #d4a017;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.15);

      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;

      color: #d4a017;

      font-size: 30px;
    }

    .site-name {
      margin-top: 8px;

      color: #555;

      font-size: 17px;
      font-weight: bold;
    }

    .subtitle {
      color: #777;

      margin: 8px 0 28px;

      line-height: 1.5;
    }

    .form-group {
      text-align: left;

      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      color: #3b2418;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 2px solid #ddd;

      border-radius: 9px;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #d4a017;
    }

    .login-button {
      width: 100%;

      padding: 14px;

      margin-top: 8px;

      border: none;

      border-radius: 9px;

      background: #d4a017;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .login-button:hover {
      background: #b8860b;
    }

    .login-button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    #message {
      display: none;

      margin-top: 18px;

      padding: 13px;

      border-radius: 9px;

      font-weight: bold;

      line-height: 1.4;
    }

    .success {
      display: block !important;

      background: #e5f8e9;

      color: #16752d;

      border: 1px solid #9ad8a8;
    }

    .error {
      display: block !important;

      background: #ffe7e7;

      color: #a00000;

      border: 1px solid #e3aaaa;
    }

    .back-home {
      display: inline-block;

      margin-top: 22px;

      color: #d4a017;

      text-decoration: none;

      font-weight: bold;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    .admin-note {
      margin-top: 22px;

      padding: 12px;

      background: #fff8dc;

      border-radius: 8px;

      color: #765900;

      font-size: 13px;

      line-height: 1.5;
    }

    @media (max-width: 600px) {

      .login-card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 26px;
      }

    }

  </style>

</head>


<body>


  <div class="login-container">


    <div class="login-card">


      <div class="logo">
        🔐
      </div>


      <h1>
        Admin Login
      </h1>


      <div class="site-name">
        Rwanda Property Visata
      </div>


      <p class="subtitle">
        Injira muri Admin Panel kugira ngo ucunge properties za website.
      </p>


      <form id="loginForm">


        <div class="form-group">

          <label for="email">
            Admin Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton">

          Login as Admin

        </button>


      </form>


      <div id="message"></div>


      <div class="admin-note">

        🔒 Uru rubuga rwa Admin rugenewe gusa
        umuyobozi wa Rwanda Property Visata.

      </div>


      <a
        href="./home.html"
        class="back-home">

        ← Back to Website

      </a>


    </div>


  </div>



  <script>


    /* =========================================
       SUPABASE
    ========================================= */


    const SUPABASE_URL =
      "https://hsmnybmcddtsyooltozw.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =========================================
       ADMIN EMAIL
    ========================================= */


    const ADMIN_EMAIL =
      "rwandahousemarket@gmail.com";



    /* =========================================
       ELEMENTS
    ========================================= */


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const emailInput =
      document.getElementById(
        "email"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const message =
      document.getElementById(
        "message"
      );



    /* =========================================
       MESSAGE
    ========================================= */


    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        type;

    }



    /* =========================================
       ADMIN LOGIN
    ========================================= */


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        /*
          Banza turebe ko email
          ari iya Admin.
        */


        if (
          email !==
          ADMIN_EMAIL
        ) {

          showMessage(
            "❌ Ntabwo wemerewe kwinjira muri Admin Panel.",
            "error"
          );

          return;

        }


        loginButton.disabled =
          true;


        loginButton.textContent =
          "Logging in...";


        try {


          /*
            SUPABASE AUTH LOGIN
          */


          const {
            data,
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });



          /*
            NIBA LOGIN YANZE
          */


          if (error) {

            showMessage(
              "❌ Email cyangwa password ntabwo ari byo.",
              "error"
            );


            loginButton.disabled =
              false;


            loginButton.textContent =
              "Login as Admin";


            return;

          }



          /*
            REBA USER WABONETSE
          */


          if (
            !data ||
            !data.user
          ) {

            showMessage(
              "❌ Login ntiyagenze neza.",
              "error"
            );


            loginButton.disabled =
              false;


            loginButton.textContent =
              "Login as Admin";


            return;

          }



          /*
            ONGEYE KUGENZURA EMAIL
          */


          const loggedEmail =
            data.user.email
              .trim()
              .toLowerCase();


          if (
            loggedEmail !==
            ADMIN_EMAIL
          ) {


            /*
              NIBA ATARI ADMIN,
              TURASOHORA USER.
            */


            await supabaseClient
              .auth
              .signOut();


            showMessage(
              "❌ Uyu account ntabwo ari Admin.",
              "error"
            );


            loginButton.disabled =
              false;


            loginButton.textContent =
              "Login as Admin";


            return;

          }



          /*
            LOGIN YAGENZE NEZA
          */


          showMessage(
            "✅ Admin login successful! Turafungura Admin Panel...",
            "success"
          );


          loginButton.textContent =
            "Opening Admin Panel...";



          /*
            JYA MURI ADMIN PANEL
          */


          setTimeout(
            function() {

              window.location.href =
                "./admin.html";

            },
            800
          );


        }

        catch(error) {

          console.error(
            "Login error:",
            error
          );


          showMessage(
            "❌ Habaye ikibazo mu kwinjira. Ongera ugerageze.",
            "error"
          );


          loginButton.disabled =
            false;


          loginButton.textContent =
            "Login as Admin";

        }

      }
    );



    /* =========================================
       CHECK EXISTING SESSION
    ========================================= */


    async function checkExistingSession() {


      const {
        data
      } =
        await supabaseClient
          .auth
          .getSession();


      const session =
        data.session;


      if (
        session &&
        session.user &&
        session.user.email
          .toLowerCase() ===
          ADMIN_EMAIL
      ) {


        /*
          Niba admin yari asanzwe
          yinjiye, mujye muri admin.
        */


        window.location.href =
          "./admin.html";

      }

    }


    checkExistingSession();


  </script>


</body>

</html>
