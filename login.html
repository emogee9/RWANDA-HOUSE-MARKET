<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Rwanda House Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222222;
      min-height: 100vh;
    }

    header {
      background: #f4b400;
      color: #222222;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      color: #222222;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    nav a:hover {
      background: #ffffff;
    }

    .container {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border: 2px solid #f4b400;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    h1,
    h2 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 2px solid #eeeeee;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
    }

    input:focus,
    select:focus {
      border-color: #f4b400;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #f4b400;
      color: #222222;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd45a;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #fff8d6;
      color: #7a5b00;
      border: 1px solid #f4b400;
    }

    .error {
      display: block;
      background: #ffeaea;
      color: #9b2226;
      border: 1px solid #e0aaaa;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
    }

    .register-link a {
      color: #b27b00;
      font-weight: bold;
      text-decoration: none;
    }

    .deposit-box {
      background: #fffdf3;
      border: 2px solid #f4b400;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .balance {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .hidden {
      display: none;
    }

    footer {
      margin-top: 50px;
      background: #f4b400;
      color: #222222;
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .container {
        padding: 0 15px;
      }

      .card {
        padding: 25px 18px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    RWANDA HOUSE MARKET 🇷🇼
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="customer-home.html">Properties</a>
    <a href="register.html">Register</a>
  </nav>

</header>


<div class="container">

  <!-- LOGIN -->

  <div class="card">

    <h1>
      Customer Login
    </h1>

    <p class="subtitle">
      Login to continue to Rwanda House Market.
    </p>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button
        type="submit"
        id="loginButton">
        Login
      </button>

    </form>

    <div
      id="loginMessage"
      class="message">
    </div>

    <div class="register-link">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </div>

  </div>


  <!-- DEPOSIT -->

  <div
    class="card hidden"
    id="depositCard">

    <h2>
      💰 Deposit
    </h2>

    <p class="subtitle">
      Request a deposit to your account.
    </p>

    <div class="balance">

      Balance:

      <span id="balance">
        0
      </span>

      RWF

    </div>

    <div class="deposit-box">

      <label for="depositAmount">
        Deposit Amount
      </label>

      <input
        type="number"
        id="depositAmount"
        placeholder="Example: 5000"
        min="1"
      >

      <label for="paymentMethod">
        Payment Method
      </label>

      <select id="paymentMethod">

        <option value="">
          Choose payment method
        </option>

        <option value="MTN Mobile Money">
          MTN Mobile Money
        </option>

        <option value="Airtel Money">
          Airtel Money
        </option>

        <option value="Bank">
          Bank
        </option>

      </select>

      <button
        type="button"
        id="depositButton">
        Request Deposit
      </button>

      <div
        id="depositMessage"
        class="message">
      </div>

    </div>

  </div>

</div>


<footer>

  © 2026 Rwanda House Market 🇷🇼 — Find Houses, Plots & Properties

</footer>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://hsmnybmcddtsyooltozw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_oHhsRZQcMwIcReU48WE9mw_FdzMO29u";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     ELEMENTS
  ================================= */

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const depositCard =
    document.getElementById("depositCard");

  const depositButton =
    document.getElementById("depositButton");

  const depositMessage =
    document.getElementById("depositMessage");

  const balanceElement =
    document.getElementById("balance");


  /* ================================
     MESSAGE
  ================================= */

  function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
      "message " + type;

  }


  /* ================================
     LOAD PROFILE
  ================================= */

  async function loadProfile() {

    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError || !user) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from("Profile")
        .select("balance")
        .eq("user_id", user.id)
        .maybeSingle();


    if (error) {

      console.error(
        "Profile error:",
        error
      );

      return;
    }


    if (data) {

      balanceElement.textContent =
        Number(data.balance || 0)
          .toLocaleString();

    }

  }


  /* ================================
     LOGIN
  ================================= */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      loginButton.disabled = true;

      loginButton.textContent =
        "Logging in...";


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {

        showMessage(
          loginMessage,
          "❌ " + error.message,
          "error"
        );


        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

        return;
      }


      showMessage(
        loginMessage,
        "✅ Login successful!",
        "success"
      );


      depositCard.classList.remove(
        "hidden"
      );


      await loadProfile();


      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }
  );


  /* ================================
     DEPOSIT REQUEST
  ================================= */

  depositButton.addEventListener(
    "click",
    async function() {

      const amount =
        Number(
          document
            .getElementById("depositAmount")
            .value
        );


      const paymentMethod =
        document
          .getElementById("paymentMethod")
          .value;


      if (!amount || amount <= 0) {

        showMessage(
          depositMessage,
          "❌ Enter a valid amount.",
          "error"
        );

        return;
      }


      if (!paymentMethod) {

        showMessage(
          depositMessage,
          "❌ Choose a payment method.",
          "error"
        );

        return;
      }


      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth
          .getUser();


      if (!user) {

        showMessage(
          depositMessage,
          "❌ Please login first.",
          "error"
        );

        return;
      }


      depositButton.disabled = true;

      depositButton.textContent =
        "Sending...";


      const {
        error
      } =
        await supabaseClient
          .from("deposits")
          .insert({

            user_id: user.id,

            amount: amount,

            payment_method:
              paymentMethod,

            status: "pending"

          });


      if (error) {

        showMessage(
          depositMessage,
          "❌ " + error.message,
          "error"
        );

        depositButton.disabled =
          false;

        depositButton.textContent =
          "Request Deposit";

        return;
      }


      showMessage(
        depositMessage,
        "✅ Deposit request sent successfully. Waiting for confirmation.",
        "success"
      );


      document
        .getElementById("depositAmount")
        .value = "";


      document
        .getElementById("paymentMethod")
        .value = "";


      depositButton.disabled =
        false;

      depositButton.textContent =
        "Request Deposit";

    }
  );


  /* ================================
     CHECK EXISTING SESSION
  ================================= */

  async function checkSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth
        .getSession();


    if (session) {

      depositCard.classList.remove(
        "hidden"
      );

      await loadProfile();

    }

  }


  checkSession();

</script>

</body>
</html>
